<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<link rel="icon" type="image/png" href="images/favicon.png">
<title>Company Profile — Unresume</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
<link rel="stylesheet" href="css/globals.css">
<link rel="stylesheet" href="css/navbar.css">
<link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
<div class="dash-root">
  <div id="sidebar" data-roles="hr"></div>
  <div class="dash-content">
    <header class="dash-topbar" data-auto data-search="Search…"></header>
    <main class="dash-main">
      <div class="dash-greeting"><div class="g-blob"></div><div><h1 class="dash-h1">Company <span class="grad-text">Profile</span></h1><p class="dash-sub">How your company appears on job postings, and your verification status.</p></div></div>
      <div class="dash-cols">
        <form class="panel-card" id="form" style="display:flex;flex-direction:column;gap:14px" novalidate></form>
        <div class="dash-col-side"><div class="panel-card" id="verify"></div><div class="panel-card"><div class="sec-title" style="margin-bottom:8px">Plan</div><div class="d-note"><span class="material-symbols-rounded">sell</span><div><b>Free (beta)</b> — all features are free during beta and no limits are enforced. <a href="pricing.html" style="color:var(--brand);font-weight:700">See proposed plans</a></div></div></div><div class="panel-card" id="preview"></div></div>
      </div>
    </main>
  </div>
</div>
<script src="js/data.js"></script>
<script src="js/store.js"></script>
<script src="js/ui.js"></script>
<script src="js/components.js"></script>
<script>
const $ = id => document.getElementById(id), esc = UI.esc;
function render() {
  const co = UR.companies.mine(), reqs = UR.verifications.mine();
  $('form').innerHTML = `<h2 class="sec-title">Details</h2>
    <div class="form-grid2">${UI.field({ name: 'name', label: 'Company name', value: co.name, required: true })}${UI.field({ name: 'logo', label: 'Logo (emoji until image upload is available)', value: co.logo })}</div>
    <div class="form-grid3">${UI.field({ name: 'industry', label: 'Industry', value: co.industry })}${UI.field({ name: 'size', label: 'Size', type: 'select', value: co.size, options: ['1–10', '11–50', '51–200', '201–500', '501–1000', '1000+'] })}${UI.field({ name: 'location', label: 'Headquarters', value: co.location })}</div>
    ${UI.field({ name: 'website', label: 'Website', value: co.website, placeholder: 'https://' })}${UI.field({ name: 'about', label: 'About', type: 'textarea', value: co.about, rows: 5 })}
    <div><button class="cta-btn" type="submit">${UI.icon('save')}Save profile</button></div>`;
  const last = reqs[0];
  $('verify').innerHTML = `<div class="sec-title" style="margin-bottom:10px">Verification</div>
    ${co.verification === 'verified' ? `<div class="d-note good">${UI.icon('verified')}<div><b>Verified</b> since ${UI.fmtDate(co.verifiedAt)}. A verified badge shows on your jobs.</div></div>`
    : co.verification === 'pending' ? `<div class="d-note warn">${UI.icon('hourglass_top')}<div><b>Under review.</b> Submitted ${last ? UI.timeAgo(last.createdAt) : ''}. Jobs can go live once approved.</div></div>`
    : `<div class="d-note ${co.verification === 'rejected' ? 'bad' : 'warn'}">${UI.icon('gpp_maybe')}<div>${co.verification === 'rejected' ? `<b>Rejected:</b> ${esc(last && last.note || '')}` : '<b>Not verified.</b>'} Verification protects candidates from fake listings.</div></div><button class="btn-sm primary" style="margin-top:10px" onclick="requestV()">${UI.icon('verified_user')}Request verification</button>`}`;
  $('preview').innerHTML = `<div class="d-sec-title">Preview on job posts</div><div style="display:flex;gap:12px;align-items:center"><div class="l-logo">${esc(co.logo)}</div><div><b style="color:var(--text1)">${esc(co.name)}</b><div class="l-sub">${esc(co.industry || '—')} · ${esc(co.size || '')}</div></div></div><p style="font-size:13px;color:var(--text3);margin-top:10px;line-height:1.6">${esc(co.about || 'No description yet.')}</p>`;
}
$('form').addEventListener('submit', e => { e.preventDefault(); UI.run(() => UR.companies.update(Object.fromEntries(new FormData(e.target))), 'Company profile saved').catch(() => {}); });
function requestV() {
  UI.modal({ title: 'Request company verification', icon: 'verified_user', submitLabel: 'Submit', sub: 'An Unresume admin checks that your company is real and that you work there.',
    body: UI.field({ name: 'evidence', label: 'Registration details', type: 'textarea', required: true, placeholder: 'GSTIN / CIN, official domain, LinkedIn page…' }),
    onSubmit: d => { UR.companies.requestVerification(d.evidence); UI.toast('Verification requested'); } });
}
render();
UI.onChange(render);
</script>
</body>
</html>
