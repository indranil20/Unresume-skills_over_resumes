<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<link rel="icon" type="image/png" href="images/favicon.png">
<title>Feed — Unresume</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
<link rel="stylesheet" href="css/globals.css">
<link rel="stylesheet" href="css/navbar.css">
<style>
.feed-title{font-family:var(--font-display);font-size:18px;font-weight:800;color:var(--text1);letter-spacing:-.02em}
.feed-filters{display:inline-flex;gap:4px;background:#f5f4fd;border:1px solid var(--border);border-radius:14px;padding:5px}
.feed-filters .cat-pill{border:none;background:transparent;padding:8px 16px;border-radius:10px;box-shadow:none}
.feed-filters .cat-pill:hover{color:var(--brand)}
.feed-filters .cat-pill.active{background:#fff;color:var(--brand);box-shadow:var(--shadow-sm)}
.feed-content{width:100%}
/* Feed cards */
.feed-card{padding:22px;margin-bottom:16px;transition:border-color .15s,box-shadow .15s}
.feed-actor{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.feed-av{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;color:#fff;flex-shrink:0}
.feed-actor-name{font-size:15px;font-weight:700;color:var(--text1);margin-bottom:2px}
.feed-actor-meta{font-size:12.5px;color:var(--text3)}
.feed-type{margin-left:auto;width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center}
.feed-type .material-symbols-rounded{font-size:20px;font-variation-settings:'FILL' 1}
.feed-action{font-size:14px;color:var(--text2);line-height:1.65;margin-bottom:14px}
.feed-action strong{color:var(--text1)}
.feed-card-inner{background:#fafaff;border:1px solid var(--border);border-radius:16px;padding:14px 16px}
.feed-footer{display:flex;align-items:center;gap:6px;margin-top:16px;padding-top:14px;border-top:1px solid var(--border)}
.feed-action-btn{display:flex;align-items:center;gap:5px;font-size:13px;font-weight:600;color:var(--text3);cursor:pointer;transition:all .15s;background:none;border:none;padding:7px 10px;border-radius:10px;text-decoration:none}
.feed-action-btn:hover{color:var(--brand);background:#f5f4fd}
.feed-action-btn.liked{color:#e11d48}
.feed-action-btn.liked:hover{background:#fdecef}
/* Right panel */
.right-title{font-size:16px;font-weight:800;color:var(--text1);font-family:var(--font-display);letter-spacing:-.02em;margin-bottom:12px}
.follow-item{display:flex;align-items:center;gap:10px;padding:9px 0}
.follow-av{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:800;color:#fff;flex-shrink:0}
.follow-name{font-size:13.5px;font-weight:700;color:var(--text1)}
.follow-score{font-size:12px;color:var(--text3)}
.follow-btn{margin-left:auto;font-size:12.5px;font-weight:700;padding:7px 14px;border-radius:10px;border:none;background:#eeedfd;color:var(--brand);cursor:pointer;transition:all .15s;white-space:nowrap}
.follow-btn:hover{background:#e4e1fd}
.follow-btn.following{background:linear-gradient(90deg,#4f46e5,#7c3aed);color:#fff}
@media(max-width:640px){
  .dash-topbar{height:auto;flex-wrap:wrap;padding:12px}
  .feed-filters{width:100%;justify-content:space-between}
  .feed-filters .cat-pill{flex:1;padding:8px 6px}
}
</style>
<link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
<div class="dash-root">
  <div id="sidebar" data-role="candidate"></div>
  <div class="dash-content">
    <header class="dash-topbar">
      <span class="feed-title">Your Feed</span>
      <div class="feed-filters">
        <button class="cat-pill active" onclick="filterFeed('all',this)">All</button>
        <button class="cat-pill" onclick="filterFeed('submission',this)">Submissions</button>
        <button class="cat-pill" onclick="filterFeed('follow',this)">Follows</button>
      </div>
    </header>
    <main class="dash-main">
      <div class="dash-cols">
        <div class="feed-content" id="feedList"></div>

        <div class="dash-col-side">
          <div class="panel-card">
            <div class="right-title">Who to Follow</div>
            <div id="whoToFollow"></div>
          </div>
          <div class="panel-card">
            <div class="right-title">Trending Skills</div>
            <div style="display:flex;flex-wrap:wrap;gap:6px" id="trendSkills"></div>
          </div>
          <div class="grad-cta">
            <div class="grad-cta-icon"><span class="material-symbols-rounded" style="font-size:24px;font-variation-settings:'FILL' 1">work</span></div>
            <h3>New Job Tasks Available</h3>
            <p>3 new job-linked tasks posted this week. Prove your skills.</p>
            <a href="jobs.html">Browse Jobs <span class="material-symbols-rounded" style="font-size:17px">arrow_forward</span></a>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="js/components.js"></script>
<script src="js/data.js"></script>
<script>
const gradients = [
  'linear-gradient(135deg,#38bdf8,#2563eb)',
  'linear-gradient(135deg,#8b5cf6,#6d28d9)',
  'linear-gradient(135deg,#e879f9,#a855f7)',
  'linear-gradient(135deg,#2dd4bf,#0d9488)',
  'linear-gradient(135deg,#fbbf24,#f97316)',
  'linear-gradient(135deg,#818cf8,#4f46e5)',
];
const typeIcon = {
  submission:{icon:'task_alt',tint:'tint-blue',label:'submitted a task'},
  score:{icon:'grade',tint:'tint-purple',label:'received a score'},
  follow:{icon:'person_add',tint:'tint-pink',label:'started following'},
  badge:{icon:'emoji_events',tint:'tint-amber',label:'earned a badge'},
  job:{icon:'work',tint:'tint-teal',label:'applied for a job'},
};

let activeFilter = 'all';
const likedPosts = new Set();

function filterFeed(f, btn) {
  activeFilter = f;
  document.querySelectorAll('.feed-filters .cat-pill').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  render();
}

function toggleLike(id, btn) {
  if (likedPosts.has(id)) {
    likedPosts.delete(id);
    btn.classList.remove('liked');
    const cnt = btn.querySelector('.like-cnt');
    if (cnt) cnt.textContent = parseInt(cnt.textContent) - 1;
  } else {
    likedPosts.add(id);
    btn.classList.add('liked');
    const cnt = btn.querySelector('.like-cnt');
    if (cnt) cnt.textContent = parseInt(cnt.textContent) + 1;
  }
}

function render() {
  let items = getFeed();
  if (activeFilter !== 'all') items = items.filter(f => f.type === activeFilter);

  document.getElementById('feedList').innerHTML = items.map((item, i) => {
    const t = typeIcon[item.type] || typeIcon.submission;
    const initials = item.actorName.split(' ').map(w=>w[0]).join('').slice(0,2);
    const likes = Math.floor(Math.random()*20)+1;
    return `<div class="feed-card">
      <div class="feed-actor">
        <div class="feed-av" style="background:${gradients[i%gradients.length]}">${initials}</div>
        <div>
          <div class="feed-actor-name">${item.actorName}</div>
          <div class="feed-actor-meta">@${item.actorUsername} · ${item.time}</div>
        </div>
        <div class="feed-type ${t.tint}">
          <span class="material-symbols-rounded">${t.icon}</span>
        </div>
      </div>
      <div class="feed-action">${item.actorName} <strong>${item.action}</strong> ${item.target ? `<a href="#" style="color:var(--brand);font-weight:700;text-decoration:none">"${item.target}"</a>` : ''} ${item.score ? `and scored <strong class="c-purple">${item.score}/100</strong>` : ''}</div>
      ${item.target ? `<div class="feed-card-inner">
        <div style="display:flex;align-items:center;gap:12px">
          <span class="icon-chip ${t.tint}"><span class="material-symbols-rounded" style="font-size:18px">${t.icon}</span></span>
          <div style="font-size:14px;font-weight:700;color:var(--text1)">${item.target}</div>
          ${item.score ? `<span class="d-pill tint-purple" style="margin-left:auto"><span class="material-symbols-rounded">star</span>${item.score}/100</span>` : ''}
        </div>
      </div>` : ''}
      <div class="feed-footer">
        <button class="feed-action-btn ${likedPosts.has(item.id)?'liked':''}" onclick="toggleLike('${item.id}',this)">
          <span class="material-symbols-rounded" style="font-size:17px">${likedPosts.has(item.id)?'favorite':'favorite_border'}</span>
          <span class="like-cnt">${likes}</span>
        </button>
        <button class="feed-action-btn">
          <span class="material-symbols-rounded" style="font-size:17px">chat_bubble_outline</span>
          <span>${Math.floor(Math.random()*8)}</span>
        </button>
        <button class="feed-action-btn">
          <span class="material-symbols-rounded" style="font-size:17px">share</span>
        </button>
        <a href="candidate-profile.html?u=${item.actorUsername}" class="feed-action-btn" style="margin-left:auto">View Profile</a>
      </div>
    </div>`;
  }).join('') || `<div class="d-empty">
    <div class="d-empty-icon"><span class="material-symbols-rounded" style="font-size:30px">dynamic_feed</span></div>
    No activity yet. Follow more candidates!
  </div>`;
}

// Who to follow
const candidates = getCandidates().slice(0,4);
document.getElementById('whoToFollow').innerHTML = candidates.map((c, i) => {
  const initials = c.name.split(' ').map(w=>w[0]).join('').slice(0,2);
  return `<div class="follow-item">
    <div class="follow-av" style="background:${gradients[i%gradients.length]}">${initials}</div>
    <div style="flex:1;min-width:0">
      <div class="follow-name">${c.name}</div>
      <div class="follow-score">Score ${c.score} · Rank #${c.rank}</div>
    </div>
    <button class="follow-btn" onclick="this.textContent=this.textContent==='Follow'?'Following':'Follow';this.classList.toggle('following')">Follow</button>
  </div>`;
}).join('');

// Trending skills
const skills = ['React','Python','UI/UX','Node.js','Data Science','Figma'];
document.getElementById('trendSkills').innerHTML = skills.map(s =>
  `<a href="jobs.html" class="cat-pill" style="font-size:12px">${s}</a>`
).join('');

render();
</script>
</body>
</html>
