<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<link rel="icon" type="image/png" href="images/favicon.png">
<title>Audit Log — Unresume Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
<link rel="stylesheet" href="css/globals.css">
<link rel="stylesheet" href="css/navbar.css">
<link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
<div class="dash-root">
  <div id="sidebar" data-roles="admin"></div>
  <div class="dash-content">
    <header class="dash-topbar" data-auto data-search="Search action, target, user…"></header>
    <main class="dash-main">
      <div class="dash-greeting"><div class="g-blob"></div><div><h1 class="dash-h1">Audit <span class="grad-text">Log</span></h1><p class="dash-sub">Every state-changing action on the platform: who, what and when. Append-only.</p></div>
        <button class="cta-btn" onclick="exportCSV()"><span class="material-symbols-rounded" style="font-size:18px">download</span> Export CSV</button></div>
      <div class="d-toolbar"><select id="areaF" aria-label="Area"><option value="">All areas</option></select><span class="spacer"></span><span class="d-pill gray" id="count"></span></div>
      <div class="d-table-wrap"><table class="d-table stack"><thead><tr><th>When</th><th>Actor</th><th>Action</th><th>Target</th><th>Details</th></tr></thead><tbody id="rows"></tbody></table></div>
      <div style="text-align:center;margin-top:12px"><button class="btn-sm" id="more" onclick="limit+=100;render()">Show more</button></div>
    </main>
  </div>
</div>
<script src="js/data.js"></script>
<script src="js/store.js"></script>
<script src="js/ui.js"></script>
<script src="js/components.js"></script>
<script>
const $ = id => document.getElementById(id), esc = UI.esc;
let limit = 100;
function data() { const area = $('areaF').value; return UR.admin.auditLog({ q: ($('topbarSearch') || { value: '' }).value }).filter(a => !area || a.action.startsWith(area + '.')); }
function render() {
  const all = UR.admin.auditLog();
  const areas = [...new Set(all.map(a => a.action.split('.')[0]))].sort();
  const cur = $('areaF').value;
  $('areaF').innerHTML = `<option value="">All areas</option>` + areas.map(a => `<option ${a === cur ? 'selected' : ''}>${a}</option>`).join('');
  const list = data();
  $('count').textContent = `${list.length} entries`;
  $('rows').innerHTML = list.slice(0, limit).map(a => `<tr><td data-label="When">${UI.fmtDateTime(a.at)}</td><td data-label="Actor">${esc(a.actorName || a.actor)}${a.role ? ` <small style="color:var(--text4)">${esc(a.role)}</small>` : ''}</td><td data-label="Action"><code>${esc(a.action)}</code></td><td data-label="Target"><code style="font-size:12px">${esc(a.target)}</code></td><td data-label="Details" style="max-width:340px">${esc(a.details || '')}</td></tr>`).join('') || `<tr><td colspan="5">${UI.empty('history', 'No matching entries')}</td></tr>`;
  $('more').style.display = list.length > limit ? '' : 'none';
}
function exportCSV() { UI.csv(`audit-log-${new Date().toISOString().slice(0, 10)}.csv`, ['At', 'Actor', 'Role', 'Action', 'Target', 'Details'], data().map(a => [a.at, a.actorName || a.actor, a.role, a.action, a.target, a.details])); }
$('areaF').addEventListener('change', render);
render();
if ($('topbarSearch')) $('topbarSearch').addEventListener('input', UI.debounce(render, 200));
UI.onChange(render);
</script>
</body>
</html>
