<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<link rel="icon" type="image/png" href="images/favicon.png">
<title>Edit Profile — Unresume</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
<link rel="stylesheet" href="css/globals.css">
<link rel="stylesheet" href="css/navbar.css">
<style>
.ep-card{background:var(--bg-card);border:1px solid var(--border);border-radius:18px;padding:0 32px 32px;max-width:760px;overflow:hidden}
.ep-cover{height:96px;margin:0 -32px;background:linear-gradient(100deg,#efedfd 0%,#e4defc 55%,#d6cefb 100%);position:relative;overflow:hidden}
.ep-cover::before{content:'';position:absolute;width:240px;height:240px;right:10%;top:-150px;border-radius:46% 54% 42% 58%/52% 38% 62% 48%;background:linear-gradient(160deg,#c7c2fa,#b9b1f7);opacity:.6}
.ep-av-row{display:flex;align-items:flex-end;gap:18px;margin:-40px 0 28px;position:relative}
.ep-av{width:96px;height:96px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-size:32px;font-weight:800;color:#fff;flex-shrink:0;box-shadow:0 0 0 6px #fff,0 14px 30px rgba(79,70,229,.25)}
.ep-av-hint{font-size:12.5px;color:var(--text3)}
.ep-form{display:flex;flex-direction:column;gap:18px}
textarea.input-area{width:100%;background:var(--bg-elevated);border:1px solid var(--border);border-radius:11px;padding:11px 14px;color:var(--text1);font-size:14px;font-family:var(--font-body);resize:vertical;min-height:90px;outline:none;transition:border-color .15s}
textarea.input-area:focus{border-color:rgba(91,108,245,.45)}
textarea.input-area::placeholder{color:var(--text4)}
.skill-chip{padding:7px 14px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s;background:var(--bg-elevated);border:1px solid var(--border);color:var(--text3)}
.skill-chip:hover{border-color:var(--border-light)}
.skill-chip.on{background:rgba(91,108,245,.15);border-color:rgba(91,108,245,.45);color:var(--brand)}
.ep-actions{display:flex;gap:10px;margin-top:6px}
.save-btn{padding:12px 22px;background:linear-gradient(135deg,#8b5cf6,#6d28d9);border:none;border-radius:11px;font-size:14.5px;font-weight:700;color:#fff;cursor:pointer;display:flex;align-items:center;gap:8px;transition:opacity .2s}
.save-btn:hover{opacity:.9}
@media(max-width:640px){
  .ep-card{padding:0 16px 22px}
  .ep-cover{margin:0 -16px;height:80px}
  .ep-av-row{flex-direction:column;align-items:flex-start;gap:10px;margin-bottom:22px}
  .ep-av{width:84px;height:84px;font-size:28px}
  .ep-actions{flex-direction:column}
  .ep-actions>*{justify-content:center}
}
</style>
<link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
<div class="dash-root">
  <div id="sidebar" data-roles="candidate"></div>
  <div class="dash-content">
    <header class="dash-topbar">
      <div class="topbar-search">
        <span class="material-symbols-rounded" style="font-size:18px;color:var(--text4)">search</span>
        <input type="text" placeholder="Search…">
      </div>
    </header>
    <main class="dash-main">
      <div class="dash-greeting"><div class="g-blob"></div><svg class="g-spark" viewBox="0 0 44 44" aria-hidden="true"><path d="M8 30 L26 6"/><path d="M20 36 L38 14"/><path d="M30 40 L40 32"/></svg><div><h1 class="dash-h1">Edit Profile</h1><p class="dash-sub">Update how you appear to companies and other candidates.</p></div></div>

      <div class="ep-card">
        <div class="ep-cover"></div>
        <div class="ep-av-row">
          <div class="ep-av" id="epAv"></div>
          <div style="padding-bottom:8px">
            <div style="font-size:13.5px;font-weight:700;color:var(--text1);margin-bottom:3px">Profile photo</div>
            <div class="ep-av-hint">Generated from your initials — photo upload coming soon.</div>
          </div>
        </div>

        <form class="ep-form" onsubmit="handleSave(event)">
          <div class="form-field">
            <label class="form-label">Full Name</label>
            <div class="input-wrap"><input type="text" id="nameInput"></div>
          </div>

          <div class="form-field">
            <label class="form-label">Username</label>
            <div class="input-wrap"><span style="color:var(--text4)">@</span><input type="text" id="usernameInput"></div>
          </div>

          <div class="form-field">
            <label class="form-label">Short Bio</label>
            <textarea class="input-area" id="bioInput" placeholder="Briefly describe yourself and your goals…"></textarea>
          </div>

          <div class="form-field">
            <label class="form-label">Skills</label>
            <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:6px" id="skillsWrap"></div>
            <p style="font-size:12px;color:var(--text4);margin-top:8px" id="skillCount"></p>
          </div>

          <div class="ep-actions">
            <button type="submit" class="save-btn" id="saveBtn">
              <span class="material-symbols-rounded" style="font-size:18px">check</span> Save Changes
            </button>
            <a href="candidate-profile.html" class="btn-ghost" style="padding:12px 20px;font-size:14.5px">Cancel</a>
          </div>
        </form>
      </div>
    </main>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/store.js"></script>
<script src="js/ui.js"></script>
<script src="js/components.js"></script>
<script>
const me = UR.user();
const c = UR.candidates.get(me.username);
const allSkills = [...new Set([...UR.candidates.allSkills(), ...c.skills])];
const selected = new Set(c.skills);
const $ = id => document.getElementById(id);

$('epAv').textContent = UI.initials(c.name);
$('epAv').style.background = UI.grad(c.username);
$('nameInput').value = c.name;
$('usernameInput').value = c.username;
$('bioInput').value = c.bio || '';
$('nameInput').required = true;

function renderSkills() {
  $('skillsWrap').innerHTML = allSkills.map(s => `<button type="button" class="skill-chip ${selected.has(s) ? 'on' : ''}" aria-pressed="${selected.has(s)}" data-skill="${UI.esc(s)}">${UI.esc(s)}</button>`).join('')
    + `<span style="display:inline-flex;gap:6px"><div class="input-wrap" style="padding:7px 12px"><input id="newSkill" placeholder="Add a skill" maxlength="30" style="width:120px"></div><button type="button" class="btn-sm" id="addSkill">Add</button></span>`;
  $('skillCount').textContent = `${selected.size} selected — skills you list are self-declared until a verified task score backs them up.`;
  $('skillsWrap').querySelectorAll('[data-skill]').forEach(b => b.addEventListener('click', () => { const s = b.dataset.skill; selected.has(s) ? selected.delete(s) : selected.add(s); renderSkills(); }));
  $('addSkill').addEventListener('click', addSkill);
  $('newSkill').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); addSkill(); } });
}
function addSkill() { const v = $('newSkill').value.trim(); if (!v) return; if (!allSkills.includes(v)) allSkills.push(v); selected.add(v); renderSkills(); }
renderSkills();

async function handleSave(e) {
  e.preventDefault();
  const btn = $('saveBtn'), label = btn.innerHTML;
  btn.innerHTML = '<span class="spinner"></span>'; btn.disabled = true;
  try {
    UR.candidates.updateProfile({ name: $('nameInput').value, username: $('usernameInput').value.trim().toLowerCase(), bio: $('bioInput').value, skills: [...selected] });
    UI.toast('Profile saved');
    setTimeout(() => { location.href = 'candidate-profile.html'; }, 600);
  } catch (err) {
    UI.toast(err.message, 'error');
    btn.innerHTML = label; btn.disabled = false;
  }
}
</script>
</body>
</html>
