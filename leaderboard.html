<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<link rel="icon" type="image/png" href="images/favicon.png">
<title>Leaderboard — Unresume</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
<link rel="stylesheet" href="css/globals.css">
<link rel="stylesheet" href="css/navbar.css">
<link rel="stylesheet" href="css/dashboard.css">
<style>
.page-wrap{overflow-x:clip}
.lb-hero{position:relative;padding:56px 24px 12px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:16px}
.lb-hero::before{content:'';position:absolute;width:640px;height:420px;left:50%;top:-40px;transform:translateX(-50%);border-radius:50%;background:radial-gradient(circle,rgba(167,139,250,.22),transparent 65%);pointer-events:none;z-index:-1}
.lb-hero h1{font-family:var(--font-display);font-size:clamp(36px,5vw,58px);font-weight:800;color:var(--text1);letter-spacing:-.04em;line-height:1.06}
.lb-hero p{font-size:clamp(15px,1.5vw,17px);color:var(--text3);max-width:520px;line-height:1.7}
.lb-filter{display:inline-flex;align-items:center;gap:4px;flex-wrap:wrap;justify-content:center;background:#fff;border:1px solid var(--border);border-radius:14px;padding:5px;box-shadow:var(--shadow-sm);margin-top:8px}
.lb-tab{padding:9px 18px;background:transparent;border:none;border-radius:10px;font-size:13px;font-weight:700;color:var(--text3);cursor:pointer;transition:all .15s}
.lb-tab:hover{color:var(--brand)}
.lb-tab.active{background:linear-gradient(90deg,#4f46e5,#7c3aed);color:#fff;box-shadow:0 4px 14px rgba(79,70,229,.28)}
.lb-wrap{max-width:960px;margin:0 auto;padding:40px 24px 96px}

/* Podium */
.podium{display:grid;grid-template-columns:repeat(3,1fr);align-items:end;gap:20px;margin-bottom:44px}
.podium.count-1{grid-template-columns:minmax(0,300px);justify-content:center}
.podium.count-2{grid-template-columns:repeat(2,minmax(0,300px));justify-content:center}
.podium-card{position:relative;background:#fff;border:1px solid var(--border);border-radius:22px;padding:28px 20px 22px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;box-shadow:var(--shadow-sm);text-decoration:none;transition:box-shadow .2s,transform .2s}
.podium-card:hover{transform:translateY(-4px);box-shadow:var(--shadow-md)}
.podium-card.first{padding-top:40px;padding-bottom:30px;box-shadow:0 30px 60px rgba(79,70,229,.14);border-color:#e2defb}
.podium-card.first::before{content:'';position:absolute;inset:0;border-radius:22px;background:linear-gradient(180deg,#f3f1fe,#fff 55%);z-index:0}
.podium-card>*{position:relative;z-index:1}
.podium-crown{position:absolute;top:-20px;left:50%;transform:translateX(-50%);width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;background:linear-gradient(135deg,#fbbf24,#f59e0b);box-shadow:0 6px 16px rgba(245,158,11,.35);z-index:2}
.podium-crown .material-symbols-rounded{font-size:22px;font-variation-settings:'FILL' 1}
.podium-av-wrap{position:relative;margin-bottom:10px}
.podium-avatar{border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:800;color:#fff}
.podium-medal{position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);min-width:28px;height:28px;padding:0 8px;border-radius:100px;display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:800;color:#fff;border:3px solid #fff}
.podium-name{font-size:15px;font-weight:700;color:var(--text1);font-family:var(--font-display);margin-top:4px}
.podium-uname{font-size:12px;color:var(--text4);font-weight:500}
.podium-score{font-family:var(--font-display);font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1.1;margin-top:8px}
.podium-score small{font-size:13px;font-weight:600;color:var(--text4);letter-spacing:0;margin-left:3px}
.podium-meta{font-size:12px;color:var(--text3);font-weight:500}

/* Table */
.lb-table{background:#fff;border:1px solid var(--border);border-radius:22px;overflow:hidden;box-shadow:var(--shadow-md)}
.lb-head{display:grid;grid-template-columns:64px 1fr 200px 90px 110px;background:#fafaff;padding:14px 24px;border-bottom:1px solid var(--border)}
.lb-head span{font-size:11px;font-weight:700;color:var(--text4);text-transform:uppercase;letter-spacing:.07em}
.lb-row{display:grid;grid-template-columns:64px 1fr 200px 90px 110px;padding:14px 24px;border-bottom:1px solid var(--border);align-items:center;transition:background .12s;text-decoration:none}
.lb-row:last-child{border-bottom:none}
.lb-row:hover{background:#f7f6fe}
.lb-rank{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:var(--text3);background:var(--bg-elevated)}
.lb-rank.r1{background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#fff}
.lb-rank.r2{background:linear-gradient(135deg,#cbd5e1,#94a3b8);color:#fff}
.lb-rank.r3{background:linear-gradient(135deg,#f0a868,#c2703d);color:#fff}
.lb-avatar{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-size:13.5px;font-weight:800;color:#fff;margin-right:14px;flex-shrink:0}
.lb-name{font-size:14px;font-weight:700;color:var(--text1)}
.lb-uname{font-size:12.5px;color:var(--text4);font-weight:500;margin-top:1px}
.lb-score-cell{display:flex;align-items:center;gap:12px;padding-right:24px}
.lb-score{font-family:var(--font-display);font-size:15px;font-weight:800;color:var(--text1);min-width:34px}
.lb-bar{flex:1;height:6px;background:var(--bg-elevated);border-radius:100px;overflow:hidden}
.lb-bar-fill{height:100%;border-radius:100px;background:linear-gradient(90deg,#4f46e5,#7c3aed)}
.lb-tasks{font-size:14px;color:var(--text2);font-weight:600}
.badge-pill{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:5px 11px;border-radius:100px}
.badge-pill .material-symbols-rounded{font-size:14px;font-variation-settings:'FILL' 1}
.lb-empty{padding:48px 24px;text-align:center;color:var(--text3);font-size:14px}

@media(max-width:760px){
  .podium{grid-template-columns:1fr;max-width:340px;margin-left:auto;margin-right:auto}
  .podium.count-2{grid-template-columns:1fr}
  .podium-card.first{order:-1}
  .lb-head,.lb-row{grid-template-columns:48px 1fr 70px 56px;padding-left:16px;padding-right:16px}
  .lb-head span:last-child,.lb-row .badge-wrap{display:none}
  .lb-bar{display:none}
  .lb-score-cell{padding-right:0}
}
@media(max-width:480px){
  .lb-hero{padding:40px 16px 8px}
  .lb-filter{flex-wrap:nowrap;overflow-x:auto;max-width:100%;justify-content:flex-start;scrollbar-width:none}
  .lb-filter::-webkit-scrollbar{display:none}
  .lb-tab{flex-shrink:0;padding:9px 14px}
  .lb-wrap{padding:28px 12px 72px}
  .lb-head,.lb-row{grid-template-columns:42px 1fr 52px;padding-left:12px;padding-right:12px}
  .lb-head span:nth-child(4),.lb-row .lb-tasks{display:none}
  .lb-avatar{width:34px;height:34px;font-size:12px;margin-right:10px}
  .lb-name,.lb-uname{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
}
</style>
</head>
<body>
<div id="navbar"></div>

<div class="page-wrap">
  <div class="lb-hero">
    <div class="section-badge"><span class="material-symbols-rounded" style="font-size:15px;font-variation-settings:'FILL' 1">trophy</span> Leaderboard</div>
    <h1>Skill <span class="grad-text">Leaderboards</span></h1>
    <p>Rankings based only on verified task scores — awarded by company reviewers against published rubrics. <a href="#how" onclick="document.getElementById('how').open=true" style="color:var(--brand);font-weight:700">How it works</a></p>
    <div class="lb-filter" id="trackTabs" role="tablist" aria-label="Skill track"></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:6px">
      <select id="skillSel" class="tc-select" aria-label="Skill within track" style="width:auto;padding:9px 12px;font-size:13px;font-weight:600"></select>
      <select id="expSel" class="tc-select" aria-label="Experience level" style="width:auto;padding:9px 12px;font-size:13px;font-weight:600"><option value="">All experience levels</option><option>Entry</option><option>Mid</option><option>Senior</option></select>
    </div>
  </div>

  <div class="lb-wrap">
    <details class="how" id="how" style="margin-bottom:28px">
      <summary><span class="material-symbols-rounded" style="color:var(--brand)">calculate</span>How leaderboard scores are calculated</summary>
      <ul id="howList"></ul>
    </details>
    <div class="podium" id="podium"></div>
    <div class="lb-table">
      <div class="lb-head">
        <span>Rank</span><span>Candidate</span><span id="scoreHead">Track score</span><span>Verified tasks</span><span>Level</span>
      </div>
      <div id="lbBody"></div>
    </div>
  </div>
</div>

<div id="footer"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="js/data.js"></script>
<script src="js/store.js"></script>
<script src="js/ui.js"></script>
<script src="js/components.js"></script>
<script>
const esc = UI.esc, s = UR.settings(), tracks = UR.candidates.tracks();
const medal = [
  { bg:'linear-gradient(135deg,#fbbf24,#f59e0b)', ring:'#fbbf24', color:'#b7791f' },
  { bg:'linear-gradient(135deg,#cbd5e1,#94a3b8)', ring:'#cbd5e1', color:'#64748b' },
  { bg:'linear-gradient(135deg,#f0a868,#c2703d)', ring:'#f0a868', color:'#c2703d' },
];
const me = UR.user();
const myStats = me && me.role === 'candidate' ? UR.candidates.stats(me.username) : null;
let track = UI.param('track') || (myStats && myStats.primaryTrack) || 'frontend', skill = UI.param('skill') || '', exp = '';
const w = s.difficultyWeights;
document.getElementById('howList').innerHTML = [
  `<b>Verified task score (0–100)</b> — a company or Unresume reviewer scores the submission against the task's published 100-point rubric.`,
  `<b>Difficulty weighting</b> — Beginner ×${w.Beginner}, Intermediate ×${w.Intermediate}, Advanced ×${w.Advanced}. Harder tasks count more towards an average; they don't add free points.`,
  `<b>Best attempt only</b> — if you retake a standard assessment (allowed after ${s.retakeCooldownDays} days), only your best verified score for that task counts. Retakes can't inflate a score.`,
  `<b>Track score (0–1000)</b> = 10 × the difficulty-weighted average of your verified scores on tasks in that track. Example: 90 (Advanced) and 80 (Beginner) → (90×1.25 + 80×0.8) ÷ 2.05 = 86.1 → 861.`,
  `<b>Separate tracks</b> — Frontend, Backend, Mobile, Data & ML, Design and Product are ranked separately. A designer is never ranked against a data scientist.`,
  `<b>Eligibility</b> — you appear in a track after ${Math.max(s.rankMinTasks, s.trackMinTasks)} verified tasks in it, and in a skill view after 2 verified tasks using that skill.`,
  `<b>Not counted</b> — portfolio likes, followers, self-declared skills and external projects. Scores under dispute keep counting until a moderator decides; voided scores are removed.`,
  `<b>Your choice</b> — hide yourself from leaderboards in Settings → Privacy. Hidden candidates show as "Anonymous candidate" or are omitted.`,
].map(x => `<li>${x}</li>`).join('');
if (location.hash === '#how') document.getElementById('how').open = true;

function renderControls() {
  document.getElementById('trackTabs').innerHTML = tracks.map(tr => `<button class="lb-tab ${tr.key === track ? 'active' : ''}" role="tab" aria-selected="${tr.key === track}" onclick="setTrack('${tr.key}')">${esc(tr.label)}</button>`).join('');
  const tr = tracks.find(x => x.key === track);
  document.getElementById('skillSel').innerHTML = `<option value="">All ${esc(tr.label)} skills</option>` + tr.skills.map(k => `<option ${k === skill ? 'selected' : ''}>${esc(k)}</option>`).join('');
}
function setTrack(k) { track = k; skill = ''; renderControls(); render(); }
document.getElementById('skillSel').addEventListener('change', e => { skill = e.target.value; render(); });
document.getElementById('expSel').addEventListener('change', e => { exp = e.target.value; render(); });

function render() {
  const rows = UR.candidates.leaderboard({ track, skill: skill || undefined, experience: exp || undefined });
  const tr = tracks.find(x => x.key === track);
  document.getElementById('scoreHead').textContent = skill ? `${skill} score` : `${tr.label} score`;
  const maxScore = rows.length ? rows[0].score : 1;
  const top3 = rows.slice(0, 3);
  const order = top3.length === 3 ? [1, 0, 2] : top3.length === 2 ? [0, 1] : [0];
  const podium = document.getElementById('podium');
  podium.className = 'podium count-' + top3.length;
  const tag = r => r.username ? 'a' : 'div';
  podium.innerHTML = top3.length ? order.map(i => {
    const c = top3[i], first = i === 0, size = first ? 96 : 76, m = medal[Math.min(c.rank - 1, 2)];
    return `<${tag(c)} ${c.username ? `href="candidate-profile.html?u=${c.username}"` : ''} class="podium-card ${first ? 'first' : ''}">
      ${first ? '<div class="podium-crown"><span class="material-symbols-rounded">emoji_events</span></div>' : ''}
      <div class="podium-av-wrap"><div class="podium-avatar" style="width:${size}px;height:${size}px;font-size:${first ? 28 : 22}px;background:${UI.grad(c.username || 'anon')};box-shadow:0 0 0 4px #fff,0 0 0 7px ${m.ring},0 12px 28px rgba(79,70,229,.2)">${c.username ? UI.initials(c.name) : '?'}</div>
        <div class="podium-medal" style="background:${m.bg}">${c.rank}</div></div>
      <div class="podium-name">${esc(c.name)}${c.isMe ? ' (you)' : ''}</div><div class="podium-uname">${c.username ? '@' + esc(c.username) : 'Private'} · ${esc(c.experience || '')}</div>
      <div class="podium-score ${first ? 'grad-text' : ''}" style="${first ? '' : 'color:' + m.color}">${c.score}<small>/1000</small></div>
      <div class="podium-meta">${c.tasks} verified task${c.tasks === 1 ? '' : 's'}</div></${tag(c)}>`;
  }).join('') : '';
  document.getElementById('lbBody').innerHTML = rows.length ? rows.map(c => `
    <${tag(c)} ${c.username ? `href="candidate-profile.html?u=${c.username}"` : ''} class="lb-row" ${c.isMe ? 'style="background:#f3f1fe"' : ''}>
      <span><span class="lb-rank ${c.rank <= 3 ? 'r' + c.rank : ''}">${c.rank}</span></span>
      <div style="display:flex;align-items:center;min-width:0"><div class="lb-avatar" style="background:${UI.grad(c.username || 'anon')}">${c.username ? UI.initials(c.name) : '?'}</div>
        <div style="min-width:0"><div class="lb-name">${esc(c.name)}${c.isMe ? ' (you)' : ''}</div><div class="lb-uname">${c.username ? '@' + esc(c.username) : 'Scores visible to the candidate only'}</div></div></div>
      <span class="lb-score-cell"><span class="lb-score">${c.score}</span><span class="lb-bar"><span class="lb-bar-fill" style="display:block;width:${Math.round(c.score / maxScore * 100)}%"></span></span></span>
      <span class="lb-tasks">${c.tasks}</span>
      <span class="badge-wrap"><span class="badge-pill tint-purple">${esc(c.experience || '—')}</span></span>
    </${tag(c)}>`).join('') : `<div class="lb-empty">No one is ranked in ${esc(skill || tr.label)}${exp ? ' at ' + exp + ' level' : ''} yet. Candidates appear after ${skill ? 2 : Math.max(s.rankMinTasks, s.trackMinTasks)} verified tasks.${me && me.role === 'candidate' ? ' <a href="assessments.html?tab=library" style="color:var(--brand);font-weight:700">Take a standard assessment</a>' : ''}</div>`;
  if (myStats) {
    const t2 = myStats.tracks.find(x => x.track === track);
    document.getElementById('lbBody').insertAdjacentHTML('afterbegin', !rows.some(r => r.isMe) ? `<div class="lb-empty" style="padding:14px;background:#fafaff;border-bottom:1px solid var(--border)">${t2 ? `You have ${t2.count} verified task${t2.count === 1 ? '' : 's'} in ${esc(tr.label)} (score ${t2.score}). ${t2.ranked ? 'You are hidden or filtered out — check Settings → Privacy or the filters.' : `You'll be ranked after ${Math.max(s.rankMinTasks, s.trackMinTasks)}.`}` : `You have no verified tasks in ${esc(tr.label)} yet.`}</div>` : '');
  }
  if (window.gsap) {
    gsap.from('.lb-row', { opacity: 0, y: 12, duration: .35, stagger: .04, ease: 'power2.out', clearProps: 'transform,opacity' });
    gsap.from('.podium-card', { opacity: 0, y: 20, duration: .45, stagger: .08, ease: 'power3.out', clearProps: 'transform,opacity' });
  }
}
renderControls();
render();</script>
</body>
</html>
