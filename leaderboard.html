<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<link rel="icon" type="image/png" href="images/favicon.png">
<title>Leaderboard — Unresume</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
<link rel="stylesheet" href="css/globals.css">
<link rel="stylesheet" href="css/navbar.css">
<style>
.page-wrap{overflow-x:clip}
.lb-hero{position:relative;padding:56px 24px 12px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:16px}
.lb-hero::before{content:'';position:absolute;width:640px;height:420px;left:50%;top:-40px;transform:translateX(-50%);border-radius:50%;background:radial-gradient(circle,rgba(167,139,250,.22),transparent 65%);pointer-events:none;z-index:-1}
.lb-hero h1{font-family:var(--font-display);font-size:clamp(36px,5vw,58px);font-weight:800;color:var(--text1);letter-spacing:-.04em;line-height:1.06}
.lb-hero p{font-size:clamp(15px,1.5vw,17px);color:var(--text3);max-width:520px;line-height:1.7}
.lb-filter{display:inline-flex;align-items:center;gap:4px;flex-wrap:wrap;justify-content:center;background:#fff;border:1px solid var(--border);border-radius:14px;padding:5px;box-shadow:var(--shadow-sm);margin-top:8px}
.lb-tab{padding:9px 18px;background:transparent;border:none;border-radius:10px;font-size:13px;font-weight:700;color:var(--text3);cursor:pointer;transition:all .15s}
.lb-tab:hover{color:var(--brand)}
.lb-tab.active{background:linear-gradient(90deg,#4f46e5,#7c3aed);color:#fff;box-shadow:0 4px 14px rgba(79,70,229,.28)}
.lb-wrap{max-width:960px;margin:0 auto;padding:40px 24px 96px}

/* Podium */
.podium{display:grid;grid-template-columns:repeat(3,1fr);align-items:end;gap:20px;margin-bottom:44px}
.podium.count-1{grid-template-columns:minmax(0,300px);justify-content:center}
.podium.count-2{grid-template-columns:repeat(2,minmax(0,300px));justify-content:center}
.podium-card{position:relative;background:#fff;border:1px solid var(--border);border-radius:22px;padding:28px 20px 22px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;box-shadow:var(--shadow-sm);text-decoration:none;transition:box-shadow .2s,transform .2s}
.podium-card:hover{transform:translateY(-4px);box-shadow:var(--shadow-md)}
.podium-card.first{padding-top:40px;padding-bottom:30px;box-shadow:0 30px 60px rgba(79,70,229,.14);border-color:#e2defb}
.podium-card.first::before{content:'';position:absolute;inset:0;border-radius:22px;background:linear-gradient(180deg,#f3f1fe,#fff 55%);z-index:0}
.podium-card>*{position:relative;z-index:1}
.podium-crown{position:absolute;top:-20px;left:50%;transform:translateX(-50%);width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;background:linear-gradient(135deg,#fbbf24,#f59e0b);box-shadow:0 6px 16px rgba(245,158,11,.35);z-index:2}
.podium-crown .material-symbols-rounded{font-size:22px;font-variation-settings:'FILL' 1}
.podium-av-wrap{position:relative;margin-bottom:10px}
.podium-avatar{border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:800;color:#fff}
.podium-medal{position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);min-width:28px;height:28px;padding:0 8px;border-radius:100px;display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:800;color:#fff;border:3px solid #fff}
.podium-name{font-size:15px;font-weight:700;color:var(--text1);font-family:var(--font-display);margin-top:4px}
.podium-uname{font-size:12px;color:var(--text4);font-weight:500}
.podium-score{font-family:var(--font-display);font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1.1;margin-top:8px}
.podium-score small{font-size:13px;font-weight:600;color:var(--text4);letter-spacing:0;margin-left:3px}
.podium-meta{font-size:12px;color:var(--text3);font-weight:500}

/* Table */
.lb-table{background:#fff;border:1px solid var(--border);border-radius:22px;overflow:hidden;box-shadow:var(--shadow-md)}
.lb-head{display:grid;grid-template-columns:64px 1fr 200px 90px 110px;background:#fafaff;padding:14px 24px;border-bottom:1px solid var(--border)}
.lb-head span{font-size:11px;font-weight:700;color:var(--text4);text-transform:uppercase;letter-spacing:.07em}
.lb-row{display:grid;grid-template-columns:64px 1fr 200px 90px 110px;padding:14px 24px;border-bottom:1px solid var(--border);align-items:center;transition:background .12s;text-decoration:none}
.lb-row:last-child{border-bottom:none}
.lb-row:hover{background:#f7f6fe}
.lb-rank{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:var(--text3);background:var(--bg-elevated)}
.lb-rank.r1{background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#fff}
.lb-rank.r2{background:linear-gradient(135deg,#cbd5e1,#94a3b8);color:#fff}
.lb-rank.r3{background:linear-gradient(135deg,#f0a868,#c2703d);color:#fff}
.lb-avatar{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-size:13.5px;font-weight:800;color:#fff;margin-right:14px;flex-shrink:0}
.lb-name{font-size:14px;font-weight:700;color:var(--text1)}
.lb-uname{font-size:12.5px;color:var(--text4);font-weight:500;margin-top:1px}
.lb-score-cell{display:flex;align-items:center;gap:12px;padding-right:24px}
.lb-score{font-family:var(--font-display);font-size:15px;font-weight:800;color:var(--text1);min-width:34px}
.lb-bar{flex:1;height:6px;background:var(--bg-elevated);border-radius:100px;overflow:hidden}
.lb-bar-fill{height:100%;border-radius:100px;background:linear-gradient(90deg,#4f46e5,#7c3aed)}
.lb-tasks{font-size:14px;color:var(--text2);font-weight:600}
.badge-pill{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:5px 11px;border-radius:100px}
.badge-pill .material-symbols-rounded{font-size:14px;font-variation-settings:'FILL' 1}
.lb-empty{padding:48px 24px;text-align:center;color:var(--text3);font-size:14px}

@media(max-width:760px){
  .podium{grid-template-columns:1fr;max-width:340px;margin-left:auto;margin-right:auto}
  .podium.count-2{grid-template-columns:1fr}
  .podium-card.first{order:-1}
  .lb-head,.lb-row{grid-template-columns:48px 1fr 70px 56px;padding-left:16px;padding-right:16px}
  .lb-head span:last-child,.lb-row .badge-wrap{display:none}
  .lb-bar{display:none}
  .lb-score-cell{padding-right:0}
}
</style>
</head>
<body>
<div id="navbar"></div>

<div class="page-wrap">
  <div class="lb-hero">
    <div class="section-badge"><span class="material-symbols-rounded" style="font-size:15px;font-variation-settings:'FILL' 1">trophy</span> Leaderboard</div>
    <h1><span class="grad-text">Global</span> Leaderboard</h1>
    <p>Rankings based on verified task scores. Real skills, real proof.</p>
    <div class="lb-filter">
      <button class="lb-tab active" onclick="setFilter('all',this)">All Skills</button>
      <button class="lb-tab" onclick="setFilter('React',this)">React</button>
      <button class="lb-tab" onclick="setFilter('Python',this)">Python</button>
      <button class="lb-tab" onclick="setFilter('UI/UX',this)">UI/UX</button>
      <button class="lb-tab" onclick="setFilter('Data Science',this)">Data Science</button>
    </div>
  </div>

  <div class="lb-wrap">
    <div class="podium" id="podium"></div>
    <div class="lb-table">
      <div class="lb-head">
        <span>Rank</span><span>Candidate</span><span>Score</span><span>Tasks</span><span>Badge</span>
      </div>
      <div id="lbBody"></div>
    </div>
  </div>
</div>

<div id="footer"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="js/components.js"></script>
<script src="js/data.js"></script>
<script>
let filter = 'all';
function setFilter(f, btn) {
  filter = f;
  document.querySelectorAll('.lb-tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  render();
}

const badgeStyle = {
  Diamond: { cls:'tint-blue',   icon:'diamond' },
  Gold:    { cls:'',            icon:'workspace_premium', style:'background:#fef6e4;color:#b7791f' },
  Silver:  { cls:'',            icon:'military_tech',     style:'background:#f1f5f9;color:#64748b' },
  Elite:   { cls:'tint-purple', icon:'bolt' },
  Pro:     { cls:'tint-purple', icon:'star' },
  Rising:  { cls:'tint-teal',   icon:'trending_up' },
};
const gradients = [
  'linear-gradient(135deg,#38bdf8,#2563eb)',
  'linear-gradient(135deg,#8b5cf6,#6d28d9)',
  'linear-gradient(135deg,#e879f9,#a855f7)',
  'linear-gradient(135deg,#2dd4bf,#0d9488)',
  'linear-gradient(135deg,#fbbf24,#f97316)',
  'linear-gradient(135deg,#818cf8,#4f46e5)',
];
const medal = [
  { bg:'linear-gradient(135deg,#fbbf24,#f59e0b)', ring:'#fbbf24', color:'#b7791f' },
  { bg:'linear-gradient(135deg,#cbd5e1,#94a3b8)', ring:'#cbd5e1', color:'#64748b' },
  { bg:'linear-gradient(135deg,#f0a868,#c2703d)', ring:'#f0a868', color:'#c2703d' },
];

const initialsOf = name => name.split(' ').map(w => w[0]).join('').slice(0,2);
function badgeHtml(b) {
  const s = badgeStyle[b] || { cls:'', icon:'verified', style:'background:var(--bg-elevated);color:var(--text3)' };
  return `<span class="badge-pill ${s.cls}" style="${s.style||''}"><span class="material-symbols-rounded">${s.icon}</span>${b}</span>`;
}

function render() {
  const all = [...getCandidates()].sort((a,b) => b.score - a.score);
  const colorOf = c => gradients[all.indexOf(c) % gradients.length];
  const candidates = all.filter(c => filter === 'all' || c.skills.includes(filter));
  const maxScore = candidates.length ? candidates[0].score : 1;

  // Podium (top 3) — visual order 2, 1, 3
  const top3 = candidates.slice(0,3);
  const order = top3.length === 3 ? [1,0,2] : top3.length === 2 ? [0,1] : [0];
  const podium = document.getElementById('podium');
  podium.className = 'podium count-' + top3.length;
  podium.innerHTML = top3.length ? order.map(r => {
    const c = top3[r];
    const first = r === 0;
    const size = first ? 96 : 76;
    return `<a href="candidate-profile.html?u=${c.username}" class="podium-card ${first?'first':''}">
      ${first ? '<div class="podium-crown"><span class="material-symbols-rounded">emoji_events</span></div>' : ''}
      <div class="podium-av-wrap">
        <div class="podium-avatar" style="width:${size}px;height:${size}px;font-size:${first?28:22}px;background:${colorOf(c)};box-shadow:0 0 0 4px #fff,0 0 0 7px ${medal[r].ring},0 12px 28px rgba(79,70,229,.2)">${initialsOf(c.name)}</div>
        <div class="podium-medal" style="background:${medal[r].bg}">${r+1}</div>
      </div>
      <div class="podium-name">${c.name}</div>
      <div class="podium-uname">@${c.username}</div>
      <div class="podium-score ${first?'grad-text':''}" style="${first?'':'color:'+medal[r].color}">${c.score}<small>pts</small></div>
      <div class="podium-meta">${c.tasksCompleted} tasks · ${c.badge}</div>
    </a>`;
  }).join('') : '';

  // Table
  document.getElementById('lbBody').innerHTML = candidates.length ? candidates.map((c, i) => `
    <a href="candidate-profile.html?u=${c.username}" class="lb-row">
      <span><span class="lb-rank ${i<3?'r'+(i+1):''}">${i+1}</span></span>
      <div style="display:flex;align-items:center;min-width:0">
        <div class="lb-avatar" style="background:${colorOf(c)}">${initialsOf(c.name)}</div>
        <div style="min-width:0"><div class="lb-name">${c.name}</div><div class="lb-uname">@${c.username}</div></div>
      </div>
      <span class="lb-score-cell"><span class="lb-score">${c.score}</span><span class="lb-bar"><span class="lb-bar-fill" style="display:block;width:${Math.round(c.score/maxScore*100)}%"></span></span></span>
      <span class="lb-tasks">${c.tasksCompleted}</span>
      <span class="badge-wrap">${badgeHtml(c.badge)}</span>
    </a>`).join('') : '<div class="lb-empty">No candidates for this skill yet.</div>';

  gsap.from('.lb-row', {opacity:0, y:12, duration:.35, stagger:.04, ease:'power2.out'});
  gsap.from('.podium-card', {opacity:0, y:20, duration:.45, stagger:.08, ease:'power3.out', clearProps:'transform,opacity'});
}

render();
</script>
</body>
</html>
