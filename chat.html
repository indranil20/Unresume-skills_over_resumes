<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<link rel="icon" type="image/png" href="images/favicon.png">
<title>Chat — Unresume</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
<link rel="stylesheet" href="css/globals.css">
<link rel="stylesheet" href="css/navbar.css">
<style>
body{background:linear-gradient(135deg,#f3f1fe 0%,#f7f7fd 45%,#efedfd 100%)}
.chat-root{display:flex;gap:16px;height:100vh;overflow:hidden;padding:16px}
.panel{background:#fff;border:1px solid var(--border);border-radius:24px;box-shadow:var(--shadow-md);overflow:hidden}
/* Left sidebar */
.conv-list{width:340px;display:flex;flex-direction:column;flex-shrink:0}
.conv-brand{display:flex;align-items:center;justify-content:space-between;padding:18px 18px 6px}
.conv-brand img{height:32px;width:auto}
.conv-header{padding:12px 20px 8px;display:flex;align-items:center;justify-content:space-between}
.conv-title{font-family:var(--font-display);font-size:24px;font-weight:800;color:var(--text1);letter-spacing:-.03em}
.icon-btn{width:38px;height:38px;border-radius:12px;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;background:#eeedfd;color:var(--brand);transition:all .15s}
.icon-btn:hover{background:linear-gradient(90deg,#4f46e5,#7c3aed);color:#fff}
.icon-btn.plain{background:transparent;color:var(--text3)}
.icon-btn.plain:hover{background:var(--bg-elevated);color:var(--text1)}
.conv-search{padding:8px 16px 12px}
.conv-search .search-wrap{display:flex;align-items:center;gap:10px;background:#fafaff;border:1px solid var(--border-light);border-radius:14px;padding:11px 14px;transition:all .15s}
.conv-search .search-wrap:focus-within{border-color:var(--brand);box-shadow:0 0 0 4px rgba(79,70,229,.1);background:#fff}
.conv-search input{flex:1;min-width:0;background:none;border:none;outline:none;font-size:13.5px;color:var(--text1);font-family:var(--font-body)}
.conv-search input::placeholder{color:var(--text4)}
#convList{padding:4px 10px 12px;display:flex;flex-direction:column;gap:2px}
.conv-item{display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;cursor:pointer;transition:background .12s;text-decoration:none}
.conv-item:hover{background:#f7f6fe}
.conv-item.active{background:#eeedfd}
.conv-av{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-size:15px;font-weight:800;color:#fff;flex-shrink:0;position:relative}
.conv-av .unread-dot{position:absolute;top:0;right:0;width:12px;height:12px;border-radius:50%;background:#f43f5e;border:2.5px solid #fff}
.conv-meta{flex:1;min-width:0}
.conv-name{font-size:14px;font-weight:700;color:var(--text1);margin-bottom:2px}
.conv-role{font-size:11.5px;color:var(--brand);font-weight:600;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv-preview{font-size:12.5px;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv-item.unread .conv-preview{color:var(--text1);font-weight:600}
.conv-side{display:flex;flex-direction:column;align-items:flex-end;gap:6px;align-self:flex-start;margin-top:2px}
.conv-time{font-size:11px;color:var(--text4);white-space:nowrap}
.conv-count{min-width:20px;height:20px;padding:0 6px;border-radius:100px;background:linear-gradient(90deg,#4f46e5,#7c3aed);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
/* Right chat pane */
.chat-pane{flex:1;min-width:0;display:flex;flex-direction:column}
.chat-topbar{height:76px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;padding:0 24px;flex-shrink:0}
.online-dot{position:absolute;bottom:1px;right:1px;width:12px;height:12px;border-radius:50%;background:#10b981;border:2.5px solid #fff}
.chat-messages{flex:1;overflow-y:auto;padding:24px 28px 16px;display:flex;flex-direction:column;gap:10px;background:linear-gradient(180deg,#fbfbff,#f6f5fd)}
.msg-day{text-align:center;margin:4px 0 10px}
.msg-day span{display:inline-block;font-size:11.5px;color:var(--text3);font-weight:700;background:#fff;border:1px solid var(--border);border-radius:100px;padding:5px 14px;box-shadow:var(--shadow-sm)}
.msg-row{display:flex;align-items:flex-end;gap:10px}
.msg-row.mine{flex-direction:row-reverse}
.msg-av{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#fff;flex-shrink:0}
.msg-col{display:flex;flex-direction:column;gap:4px;max-width:62%}
.msg-row.mine .msg-col{align-items:flex-end}
.msg-bubble{padding:12px 16px;border-radius:18px;font-size:14px;line-height:1.55;word-break:break-word}
.msg-bubble.them{background:#fff;border:1px solid var(--border);color:var(--text1);border-bottom-left-radius:6px;box-shadow:var(--shadow-sm)}
.msg-bubble.mine{background:linear-gradient(90deg,#4f46e5,#7c3aed);color:#fff;border-bottom-right-radius:6px;box-shadow:0 6px 16px rgba(79,70,229,.22)}
.msg-time{font-size:10.5px;color:var(--text4);padding:0 6px;white-space:nowrap}
/* Input */
.chat-input-wrap{padding:16px 24px 20px;border-top:1px solid var(--border);flex-shrink:0}
.chat-input-bar{display:flex;align-items:flex-end;gap:10px;background:#fafaff;border:1px solid var(--border-light);border-radius:18px;padding:8px 8px 8px 18px;transition:all .15s}
.chat-input-bar:focus-within{border-color:var(--brand);box-shadow:0 0 0 4px rgba(79,70,229,.1);background:#fff}
.chat-input-bar textarea{flex:1;background:none;border:none;outline:none;font-size:14px;color:var(--text1);font-family:var(--font-body);resize:none;max-height:120px;line-height:1.5;padding:9px 0}
.chat-input-bar textarea::placeholder{color:var(--text4)}
.send-btn{width:44px;height:44px;border-radius:14px;background:linear-gradient(90deg,#4f46e5,#7c3aed);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 4px 14px rgba(79,70,229,.3);transition:transform .15s,filter .15s}
.send-btn:hover{filter:brightness(1.08);transform:translateY(-1px)}
/* 3-dot menu */
.menu-wrap{position:relative}
.icon-btn.plain.open{background:#eeedfd;color:var(--brand)}
.chat-menu{display:none;position:absolute;top:calc(100% + 8px);right:0;z-index:60;width:240px;background:#fff;border:1px solid var(--border);border-radius:18px;padding:8px;box-shadow:0 20px 50px rgba(30,27,75,.16);animation:menuIn .14s ease-out}
.chat-menu.open{display:block}
@keyframes menuIn{from{opacity:0;transform:translateY(-6px) scale(.98)}to{opacity:1;transform:none}}
.menu-item{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border:none;background:none;border-radius:12px;font-size:13.5px;font-weight:600;color:var(--text1);text-align:left;cursor:pointer;text-decoration:none;font-family:var(--font-body);transition:background .12s,color .12s}
.menu-item .material-symbols-rounded{font-size:20px;color:var(--text3);transition:color .12s}
.menu-item:hover{background:#f5f4fd;color:var(--brand)}
.menu-item:hover .material-symbols-rounded{color:var(--brand)}
.menu-item.danger{color:#e11d48}
.menu-item.danger .material-symbols-rounded{color:#e11d48}
.menu-item.danger:hover{background:#fdecef;color:#e11d48}
.menu-sep{height:1px;background:var(--border);margin:6px 8px}
/* list flags */
.conv-flags{display:inline-flex;gap:2px;margin-left:4px;vertical-align:middle}
.conv-flags .material-symbols-rounded{font-size:15px;color:var(--text4)}
/* in-chat search */
.chat-search{display:none;align-items:center;gap:10px;padding:10px 24px;border-bottom:1px solid var(--border);background:#fafaff;flex-shrink:0}
.chat-search.open{display:flex}
.chat-search input{flex:1;min-width:0;border:1px solid var(--border-light);background:#fff;border-radius:12px;padding:9px 12px;font-size:13.5px;font-family:var(--font-body);color:var(--text1);outline:none}
.chat-search input:focus{border-color:var(--brand);box-shadow:0 0 0 4px rgba(79,70,229,.1)}
.chat-search-count{font-size:12.5px;color:var(--text3);font-weight:600;white-space:nowrap}
mark{background:#fde68a;color:inherit;border-radius:4px;padding:0 2px}
.msg-bubble.mine mark{background:rgba(255,255,255,.35)}
/* blocked */
.blocked-note{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;padding:14px;border-radius:16px;background:#fdecef;color:#9f1239;font-size:13.5px;font-weight:600}
.blocked-note button{border:none;background:#fff;color:#e11d48;font-weight:700;font-size:13px;padding:8px 14px;border-radius:10px;cursor:pointer}
/* contact info panel */
.chat-who{display:flex;align-items:center;gap:14px;flex:1;min-width:0;cursor:pointer;border-radius:14px;padding:6px 8px;margin-left:-8px;transition:background .15s}
.chat-who:hover{background:#f5f4fd}
.info-panel{width:360px;flex-shrink:0;display:none;flex-direction:column;overflow:hidden}
.info-panel.open{display:flex;animation:panelIn .2s ease-out}
@keyframes panelIn{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:none}}
.info-head{display:flex;align-items:center;gap:10px;padding:16px 16px 12px;flex-shrink:0}
.info-head-title{font-family:var(--font-display);font-size:17px;font-weight:800;color:var(--text1);letter-spacing:-.02em}
.info-body{flex:1;overflow-y:auto;padding:0 18px 20px;scrollbar-width:none}
.info-body::-webkit-scrollbar{display:none}
.info-hero{position:relative;text-align:center;padding:26px 16px 22px;border-radius:22px;background:linear-gradient(160deg,#efedfd,#e4defc 60%,#d6cefb);border:1px solid #e2defb;overflow:hidden;margin-bottom:16px}
.info-hero::before{content:'';position:absolute;width:220px;height:220px;right:-80px;top:-110px;border-radius:46% 54% 42% 58%/52% 38% 62% 48%;background:linear-gradient(160deg,#c7c2fa,#b9b1f7);opacity:.55}
.info-hero>*{position:relative}
.info-av{width:96px;height:96px;border-radius:50%;margin:0 auto 14px;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-size:32px;font-weight:800;color:#fff;box-shadow:0 0 0 6px #fff,0 14px 30px rgba(79,70,229,.25);position:relative}
.info-av .online-dot{width:18px;height:18px;border-width:3.5px;bottom:4px;right:4px}
.info-name{font-family:var(--font-display);font-size:22px;font-weight:800;color:var(--text1);letter-spacing:-.03em}
.info-role{font-size:13.5px;color:var(--text3);margin-top:3px}
.info-status{display:inline-flex;align-items:center;gap:6px;margin-top:10px;font-size:12px;font-weight:700;padding:5px 12px;border-radius:100px;background:#fff}
.info-status i{width:8px;height:8px;border-radius:50%;display:block}
.info-quick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.info-quick button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px;border-radius:16px;border:1px solid var(--border);background:#fff;font-size:12px;font-weight:700;color:var(--text2);cursor:pointer;transition:all .15s;font-family:var(--font-body)}
.info-quick button .material-symbols-rounded{font-size:22px;color:var(--brand)}
.info-quick button:hover{border-color:#e2defb;background:#f7f6fe;color:var(--brand)}
.info-quick button.on{background:#eeedfd;border-color:#e2defb;color:var(--brand)}
.info-sec{background:#fff;border:1px solid var(--border);border-radius:18px;padding:16px;margin-bottom:14px}
.info-sec-title{font-size:11px;font-weight:700;color:var(--text4);text-transform:uppercase;letter-spacing:.08em;margin-bottom:12px}
.info-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.info-stat{text-align:center;padding:10px 4px;border-radius:14px;background:#fafaff}
.info-stat-v{font-family:var(--font-display);font-size:18px;font-weight:800;line-height:1.1}
.info-stat-l{font-size:11px;color:var(--text3);margin-top:2px}
.info-row{display:flex;align-items:center;gap:12px;padding:8px 0;font-size:13.5px;color:var(--text1);font-weight:500}
.info-row .ic{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.info-row .ic .material-symbols-rounded{font-size:18px;font-variation-settings:'FILL' 1}
.info-row small{display:block;font-size:11.5px;color:var(--text3);font-weight:500}
.info-skills{display:flex;flex-wrap:wrap;gap:6px}
.info-skills span{font-size:12px;font-weight:700;padding:5px 11px;border-radius:100px;background:#eeedfd;color:var(--brand)}
.info-link{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:14px;padding:12px;border-radius:12px;background:linear-gradient(90deg,#4f46e5,#7c3aed);color:#fff;font-size:13.5px;font-weight:700;text-decoration:none;box-shadow:0 6px 16px rgba(79,70,229,.25)}
.info-danger .menu-item{padding:11px 10px}
@media(max-width:1200px){
  .info-panel{position:fixed;top:16px;right:16px;bottom:16px;z-index:150;box-shadow:0 30px 70px rgba(30,27,75,.25)}
}
@media(max-width:640px){
  .info-panel{top:10px;right:10px;bottom:10px;left:10px;width:auto}
}
/* new chat modal */
.nc-modal{background:#fff;border-radius:24px;max-width:440px;width:100%;box-shadow:0 30px 70px rgba(30,27,75,.2);animation:menuIn .16s ease-out;display:flex;flex-direction:column;max-height:min(620px,90vh);overflow:hidden}
.nc-head{display:flex;align-items:center;justify-content:space-between;padding:20px 20px 8px}
.nc-head h3{font-family:var(--font-display);font-size:20px;font-weight:800;color:var(--text1);letter-spacing:-.02em}
.nc-search{padding:8px 20px 12px}
.nc-list{overflow-y:auto;padding:0 10px 14px;scrollbar-width:none}
.nc-list::-webkit-scrollbar{display:none}
.nc-label{font-size:11px;font-weight:700;color:var(--text4);text-transform:uppercase;letter-spacing:.08em;padding:8px 12px 6px}
.nc-item{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border:none;background:none;border-radius:14px;cursor:pointer;text-align:left;font-family:var(--font-body);transition:background .12s}
.nc-item:hover,.nc-item:focus-visible{background:#f5f4fd;outline:none}
.nc-item .conv-av{width:42px;height:42px;font-size:14px}
.nc-name{font-size:14px;font-weight:700;color:var(--text1)}
.nc-sub{font-size:12px;color:var(--text3);margin-top:1px}
.nc-tag{margin-left:auto;font-size:11px;font-weight:700;padding:4px 10px;border-radius:100px;background:#e6f8f5;color:#0d9488;white-space:nowrap}
.nc-empty{text-align:center;padding:36px 12px;color:var(--text3);font-size:13.5px}
/* confirm modal + toast */
.modal-bg{display:none;position:fixed;inset:0;z-index:200;background:rgba(30,27,75,.35);backdrop-filter:blur(6px);align-items:center;justify-content:center;padding:20px}
.modal-bg.open{display:flex}
.modal{background:#fff;border-radius:24px;padding:28px;max-width:380px;width:100%;box-shadow:0 30px 70px rgba(30,27,75,.2);text-align:center;animation:menuIn .16s ease-out}
.modal-icon{width:60px;height:60px;border-radius:50%;margin:0 auto 16px;display:flex;align-items:center;justify-content:center;background:#fdecef;color:#e11d48}
.modal-icon .material-symbols-rounded{font-size:30px}
.modal h3{font-family:var(--font-display);font-size:20px;font-weight:800;color:var(--text1);margin-bottom:8px}
.modal p{font-size:14px;color:var(--text3);line-height:1.6;margin-bottom:22px}
.modal-actions{display:flex;gap:10px}
.modal-actions button{flex:1;padding:12px;border-radius:12px;font-size:14px;font-weight:700;cursor:pointer;border:1px solid var(--border);background:#fff;color:var(--text1)}
.modal-actions .confirm{border:none;background:#e11d48;color:#fff}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);opacity:0;z-index:300;display:flex;align-items:center;gap:10px;background:#0e1230;color:#fff;font-size:13.5px;font-weight:600;padding:12px 18px;border-radius:14px;box-shadow:0 16px 40px rgba(14,18,48,.3);transition:all .2s;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast .material-symbols-rounded{font-size:20px;color:#5eead4}
/* Empty state */
.chat-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:var(--text3)}
.chat-empty-icon{width:80px;height:80px;border-radius:50%;background:#eeedfd;color:var(--brand);display:flex;align-items:center;justify-content:center}
@media(max-width:900px){.conv-list{width:280px}}
@media(max-width:640px){
  .chat-root{padding:10px;gap:10px}
  .conv-list{width:76px}
  .conv-brand,.conv-header,.conv-search,.conv-meta,.conv-side{display:none}
  #convList{padding:10px 6px}
  .conv-item{padding:8px;justify-content:center}
  .chat-topbar{padding:0 14px}
  .chat-messages{padding:16px 14px}
  .msg-col{max-width:80%}
  .chat-input-wrap{padding:12px}
}
</style>
</head>
<body>
<div class="chat-root">
  <!-- Conversation list -->
  <div class="conv-list panel">
    <div class="conv-brand">
      <a href="index.html"><img src="images/unresume-logo-dark.png" alt="Unresume"></a>
    </div>
    <div class="conv-header">
      <span class="conv-title">Messages</span>
      <button class="icon-btn" title="New chat" onclick="openNewChat()">
        <span class="material-symbols-rounded" style="font-size:20px">edit_square</span>
      </button>
    </div>
    <div class="conv-search">
      <div class="search-wrap">
        <span class="material-symbols-rounded" style="font-size:20px;color:var(--brand)">search</span>
        <input type="text" placeholder="Search conversations…" oninput="filterConvs(this.value)">
      </div>
    </div>
    <div id="convList" style="overflow-y:auto;flex:1"></div>
  </div>

  <!-- Chat pane -->
  <div class="chat-pane panel" id="chatPane">
    <div class="chat-empty" id="emptyState">
      <div class="chat-empty-icon"><span class="material-symbols-rounded" style="font-size:38px;font-variation-settings:'FILL' 1">chat</span></div>
      <h3 style="font-family:var(--font-display);font-size:20px;font-weight:800;color:var(--text1)">Select a conversation</h3>
      <p style="font-size:14px;text-align:center;max-width:260px;line-height:1.6">Choose a conversation from the list to start chatting</p>
    </div>
    <div id="activeChatView" style="display:none;flex-direction:column;flex:1;overflow:hidden">
      <div class="chat-topbar" id="chatTopbar"></div>
      <div class="chat-search" id="chatSearch">
        <span class="material-symbols-rounded" style="font-size:20px;color:var(--brand)">search</span>
        <input type="text" id="chatSearchInput" placeholder="Search in this conversation…" oninput="renderMessages(activeConvId)">
        <span class="chat-search-count" id="chatSearchCount"></span>
        <button class="icon-btn plain" style="width:34px;height:34px" onclick="closeChatSearch()" title="Close search"><span class="material-symbols-rounded" style="font-size:20px">close</span></button>
      </div>
      <div class="chat-messages" id="chatMessages"></div>
      <div class="chat-input-wrap">
        <div class="blocked-note" id="blockedNote" style="display:none"></div>
        <div class="chat-input-bar" id="chatInputBar">
          <textarea id="msgInput" rows="1" placeholder="Type a message…" onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
          <button class="send-btn" onclick="sendMessage()">
            <span class="material-symbols-rounded" style="font-size:20px;color:#fff;font-variation-settings:'FILL' 1">send</span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Contact info -->
  <aside class="info-panel panel" id="infoPanel" aria-label="Contact info">
    <div class="info-head">
      <button class="icon-btn plain" onclick="closeInfo()" title="Close"><span class="material-symbols-rounded" style="font-size:22px">close</span></button>
      <span class="info-head-title">Contact info</span>
    </div>
    <div class="info-body" id="infoBody"></div>
  </aside>
</div>

<div class="modal-bg" id="confirmModal" onclick="if(event.target===this)closeConfirm()">
  <div class="modal">
    <div class="modal-icon"><span class="material-symbols-rounded" id="confirmIcon">delete</span></div>
    <h3 id="confirmTitle"></h3>
    <p id="confirmText"></p>
    <div class="modal-actions">
      <button onclick="closeConfirm()">Cancel</button>
      <button class="confirm" id="confirmBtn"></button>
    </div>
  </div>
</div>
<div class="modal-bg" id="newChatModal" onclick="if(event.target===this)closeNewChat()">
  <div class="nc-modal" role="dialog" aria-label="New chat">
    <div class="nc-head">
      <h3>New chat</h3>
      <button class="icon-btn plain" onclick="closeNewChat()" title="Close"><span class="material-symbols-rounded" style="font-size:22px">close</span></button>
    </div>
    <div class="nc-search conv-search" style="padding:8px 20px 12px">
      <div class="search-wrap">
        <span class="material-symbols-rounded" style="font-size:20px;color:var(--brand)">search</span>
        <input type="text" id="ncSearch" placeholder="Search by name or skill…" oninput="renderNewChat()">
      </div>
    </div>
    <div class="nc-list" id="ncList"></div>
  </div>
</div>
<div class="toast" id="toast"><span class="material-symbols-rounded">check_circle</span><span id="toastText"></span></div>

<script src="js/components.js"></script>
<script src="js/data.js"></script>
<script>
const gradients = [
  'linear-gradient(135deg,#38bdf8,#2563eb)',
  'linear-gradient(135deg,#e879f9,#a855f7)',
  'linear-gradient(135deg,#2dd4bf,#0d9488)',
];
const esc = s => String(s).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const convData = getConversations();
let activeConvId = null;
let localMessages = {};
convData.forEach((c, i) => { localMessages[c.id] = [...c.messages]; c.colorIdx = i; });
const convGrad = c => gradients[c.colorIdx % gradients.length];

const ME = 'Jay D';
const ME_INITIALS = 'JD';
const ME_GRAD = 'linear-gradient(135deg,#38bdf8,#2563eb)';

const candidateByName = Object.fromEntries(getCandidates().map(c => [c.name, c.username]));
let convFilter = '';

// Case-insensitive highlight on the raw text, escaping each piece
function highlight(text, q) {
  if (!q) return esc(text);
  const lower = text.toLowerCase(), needle = q.toLowerCase();
  let out = '', i = 0, j;
  while ((j = lower.indexOf(needle, i)) !== -1) {
    out += esc(text.slice(i, j)) + '<mark>' + esc(text.slice(j, j + q.length)) + '</mark>';
    i = j + q.length;
  }
  return out + esc(text.slice(i));
}

function renderConvList(filter = convFilter) {
  convFilter = filter;
  document.getElementById('convList').innerHTML = convData
    .filter(c => c.withName.toLowerCase().includes(filter.toLowerCase()))
    .sort((a, b) => (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0))
    .map((c, i) => {
      const msgs = localMessages[c.id];
      const last = msgs[msgs.length-1];
      const initials = c.withName.split(' ').map(w=>w[0]).join('').slice(0,2);
      return `<a href="#" class="conv-item ${activeConvId===c.id?'active':''} ${c.unread?'unread':''}" onclick="openConv(${c.id});return false" title="${c.withName}">
        <div class="conv-av" style="background:${convGrad(c)}">
          ${initials}
          ${c.unread ? '<span class="unread-dot"></span>':''}
        </div>
        <div class="conv-meta">
          <div class="conv-name">${c.withName}<span class="conv-flags">${c.pinned?'<span class="material-symbols-rounded" title="Pinned">keep</span>':''}${c.muted?'<span class="material-symbols-rounded" title="Muted">notifications_off</span>':''}${c.blocked?'<span class="material-symbols-rounded" title="Blocked">block</span>':''}</span></div>
          <div class="conv-role">${c.role}</div>
          <div class="conv-preview">${last?esc(last.text):'<em>No messages yet</em>'}</div>
        </div>
        <div class="conv-side">
          <div class="conv-time">${last?last.time:''}</div>
          ${c.unread ? `<span class="conv-count">${c.unread}</span>` : ''}
        </div>
      </a>`;
    }).join('');
}

function openConv(id) {
  activeConvId = id;
  const conv = convData.find(c => c.id === id);
  if (!conv) return;
  conv.unread = false;

  document.getElementById('emptyState').style.display = 'none';
  const view = document.getElementById('activeChatView');
  view.style.display = 'flex';
  view.style.flexDirection = 'column';

  closeChatSearch(false);
  renderTopbar();
  renderMessages(id);
  renderConvList();
  applyBlocked();
  if (infoOpen()) renderInfo();
  if (!conv.blocked) document.getElementById('msgInput').focus();
}

function activeConv() { return convData.find(c => c.id === activeConvId); }

function renderTopbar() {
  const conv = activeConv();
  const ci = convData.indexOf(conv);
  const profileUser = candidateByName[conv.withName];
  document.getElementById('chatTopbar').innerHTML = `
    <div class="chat-who" onclick="openInfo()" title="View contact info" role="button" tabindex="0" onkeydown="if(event.key==='Enter')openInfo()">
      <div class="conv-av" style="background:${convGrad(conv)};width:46px;height:46px;font-size:15px">${conv.withName.split(' ').map(w=>w[0]).join('').slice(0,2)}${conv.blocked?'':'<span class="online-dot"></span>'}</div>
      <div style="flex:1;min-width:0">
        <div style="font-size:16px;font-weight:800;color:var(--text1);font-family:var(--font-display);letter-spacing:-.01em">${conv.withName}</div>
        <div style="font-size:12.5px;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${conv.role}</div>
      </div>
    </div>
    <div class="menu-wrap">
      <button class="icon-btn plain" id="menuBtn" onclick="toggleChatMenu(event)" title="More options" aria-haspopup="menu"><span class="material-symbols-rounded" style="font-size:22px">more_vert</span></button>
      <div class="chat-menu" id="chatMenu" role="menu">
        <button class="menu-item" onclick="openInfo()"><span class="material-symbols-rounded">info</span>Contact info</button>
        ${profileUser ? `<a class="menu-item" href="candidate-profile.html?u=${profileUser}"><span class="material-symbols-rounded">person</span>View Profile</a>` : ''}
        <button class="menu-item" onclick="menuAction('search')"><span class="material-symbols-rounded">search</span>Search in chat</button>
        <button class="menu-item" onclick="menuAction('pin')"><span class="material-symbols-rounded">${conv.pinned?'keep_off':'keep'}</span>${conv.pinned?'Unpin chat':'Pin chat'}</button>
        <button class="menu-item" onclick="menuAction('mute')"><span class="material-symbols-rounded">${conv.muted?'notifications':'notifications_off'}</span>${conv.muted?'Unmute notifications':'Mute notifications'}</button>
        <button class="menu-item" onclick="menuAction('unread')"><span class="material-symbols-rounded">mark_chat_unread</span>Mark as unread</button>
        <div class="menu-sep"></div>
        <button class="menu-item danger" onclick="menuAction('clear')"><span class="material-symbols-rounded">delete_sweep</span>Clear chat</button>
        <button class="menu-item danger" onclick="menuAction('block')"><span class="material-symbols-rounded">block</span>${conv.blocked?'Unblock':'Block'} ${conv.withName.split(' ')[0]}</button>
        <button class="menu-item danger" onclick="menuAction('report')"><span class="material-symbols-rounded">flag</span>Report</button>
      </div>
    </div>
  `;
}

function toggleChatMenu(e) {
  e.stopPropagation();
  const open = document.getElementById('chatMenu').classList.toggle('open');
  document.getElementById('menuBtn').classList.toggle('open', open);
}
function closeChatMenu() {
  const m = document.getElementById('chatMenu');
  if (m) { m.classList.remove('open'); document.getElementById('menuBtn').classList.remove('open'); }
}
document.addEventListener('click', e => { if (!e.target.closest('.menu-wrap')) closeChatMenu(); });
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  // close the top-most layer first
  if (document.getElementById('confirmModal').classList.contains('open')) closeConfirm();
  else if (document.getElementById('newChatModal').classList.contains('open')) closeNewChat();
  else if (document.getElementById('chatMenu')?.classList.contains('open')) closeChatMenu();
  else closeInfo();
});

function menuAction(action) {
  const conv = activeConv();
  const first = conv.withName.split(' ')[0];
  closeChatMenu();
  if (action === 'search') {
    if (window.innerWidth <= 1200) closeInfo(); // panel overlays the chat on smaller screens
    document.getElementById('chatSearch').classList.add('open');
    document.getElementById('chatSearchInput').focus();
  } else if (action === 'pin') {
    conv.pinned = !conv.pinned;
    showToast(conv.pinned ? 'Chat pinned to top' : 'Chat unpinned');
  } else if (action === 'mute') {
    conv.muted = !conv.muted;
    showToast(conv.muted ? `Notifications muted for ${first}` : `Notifications unmuted for ${first}`);
  } else if (action === 'unread') {
    conv.unread = 1;
    showToast('Marked as unread');
  } else if (action === 'clear') {
    askConfirm({ icon:'delete_sweep', title:'Clear this chat?', text:`All messages with ${conv.withName} will be removed from this chat.`, btn:'Clear chat', onYes: () => {
      localMessages[conv.id] = [];
      renderMessages(conv.id);
      refreshActive();
      showToast('Chat cleared');
    }});
  } else if (action === 'block') {
    if (conv.blocked) {
      conv.blocked = false;
      showToast(`${first} unblocked`);
    } else {
      askConfirm({ icon:'block', title:`Block ${first}?`, text:`${conv.withName} won't be able to message you, and you won't be able to reply.`, btn:'Block', onYes: () => {
        conv.blocked = true;
        refreshActive();
        showToast(`${first} blocked`);
      }});
      return;
    }
  } else if (action === 'report') {
    askConfirm({ icon:'flag', title:`Report ${first}?`, text:'Our team will review this conversation. They won\'t be notified.', btn:'Report', onYes: () => showToast('Report submitted. Thanks for letting us know.') });
    return;
  }
  refreshActive();
}

function refreshActive() {
  renderTopbar();
  renderConvList();
  applyBlocked();
  if (infoOpen()) renderInfo();
}

// ── Contact info panel ──
const candidateFull = Object.fromEntries(getCandidates().map(c => [c.name, c]));
const infoOpen = () => document.getElementById('infoPanel').classList.contains('open');
function openInfo() {
  closeChatMenu();
  renderInfo();
  document.getElementById('infoPanel').classList.add('open');
}
function closeInfo() { document.getElementById('infoPanel').classList.remove('open'); }

function renderInfo() {
  const conv = activeConv();
  if (!conv) return;
  const ci = convData.indexOf(conv);
  const initials = conv.withName.split(' ').map(w=>w[0]).join('').slice(0,2);
  const [roleTitle, org] = conv.role.split(' · ');
  const cand = candidateFull[conv.withName];
  const first = conv.withName.split(' ')[0];
  const msgCount = localMessages[conv.id].length;

  const details = cand ? `
    <div class="info-sec">
      <div class="info-sec-title">Skill Profile</div>
      <div class="info-stats">
        <div class="info-stat"><div class="info-stat-v grad-text">${cand.score}</div><div class="info-stat-l">Score</div></div>
        <div class="info-stat"><div class="info-stat-v c-blue">#${cand.rank}</div><div class="info-stat-l">Rank</div></div>
        <div class="info-stat"><div class="info-stat-v c-teal">${cand.tasksCompleted}</div><div class="info-stat-l">Tasks</div></div>
      </div>
      <div class="info-row" style="margin-top:8px"><span class="ic tint-amber"><span class="material-symbols-rounded">workspace_premium</span></span><div>${cand.badge}<small>Badge</small></div></div>
      <div class="info-sec-title" style="margin-top:10px">Skills</div>
      <div class="info-skills">${cand.skills.map(s => `<span>${s}</span>`).join('')}</div>
      <a class="info-link" href="candidate-profile.html?u=${cand.username}">View full profile <span class="material-symbols-rounded" style="font-size:18px">arrow_forward</span></a>
    </div>` : `
    <div class="info-sec">
      <div class="info-sec-title">About</div>
      <div class="info-row"><span class="ic tint-purple"><span class="material-symbols-rounded">badge</span></span><div>${roleTitle}<small>Role</small></div></div>
      ${org ? `<div class="info-row"><span class="ic tint-blue"><span class="material-symbols-rounded">apartment</span></span><div>${org}<small>Company</small></div></div>` : ''}
    </div>`;

  document.getElementById('infoBody').innerHTML = `
    <div class="info-hero">
      <div class="info-av" style="background:${convGrad(conv)}">${initials}${conv.blocked?'':'<span class="online-dot"></span>'}</div>
      <div class="info-name">${conv.withName}</div>
      <div class="info-role">${conv.role}</div>
      <div class="info-status" style="color:${conv.blocked?'#e11d48':'#0d9488'}"><i style="background:${conv.blocked?'#e11d48':'#10b981'}"></i>${conv.blocked?'Blocked':'Online'}</div>
    </div>

    <div class="info-quick">
      <button onclick="menuAction('search')"><span class="material-symbols-rounded">search</span>Search</button>
      <button class="${conv.muted?'on':''}" onclick="menuAction('mute')"><span class="material-symbols-rounded">${conv.muted?'notifications_off':'notifications'}</span>${conv.muted?'Muted':'Mute'}</button>
      <button class="${conv.pinned?'on':''}" onclick="menuAction('pin')"><span class="material-symbols-rounded">keep</span>${conv.pinned?'Pinned':'Pin'}</button>
    </div>

    ${details}

    <div class="info-sec">
      <div class="info-row" style="padding:0"><span class="ic tint-teal"><span class="material-symbols-rounded">forum</span></span><div>${msgCount} message${msgCount!==1?'s':''}<small>In this conversation</small></div></div>
    </div>

    <div class="info-sec info-danger" style="padding:8px">
      <button class="menu-item danger" onclick="menuAction('clear')"><span class="material-symbols-rounded">delete_sweep</span>Clear chat</button>
      <button class="menu-item danger" onclick="menuAction('block')"><span class="material-symbols-rounded">block</span>${conv.blocked?'Unblock':'Block'} ${first}</button>
      <button class="menu-item danger" onclick="menuAction('report')"><span class="material-symbols-rounded">flag</span>Report ${first}</button>
    </div>`;
}

function applyBlocked() {
  const conv = activeConv();
  const note = document.getElementById('blockedNote');
  document.getElementById('chatInputBar').style.display = conv.blocked ? 'none' : '';
  note.style.display = conv.blocked ? 'flex' : 'none';
  note.innerHTML = conv.blocked ? `<span class="material-symbols-rounded" style="font-size:20px">block</span>You blocked ${esc(conv.withName)}.<button onclick="menuAction('block')">Unblock</button>` : '';
}

function closeChatSearch(rerender = true) {
  document.getElementById('chatSearch').classList.remove('open');
  document.getElementById('chatSearchInput').value = '';
  document.getElementById('chatSearchCount').textContent = '';
  if (rerender && activeConvId) renderMessages(activeConvId);
}

let confirmHandler = null;
function askConfirm({ icon, title, text, btn, onYes }) {
  document.getElementById('confirmIcon').textContent = icon;
  document.getElementById('confirmTitle').textContent = title;
  document.getElementById('confirmText').textContent = text;
  document.getElementById('confirmBtn').textContent = btn;
  confirmHandler = onYes;
  document.getElementById('confirmModal').classList.add('open');
}
function closeConfirm() {
  document.getElementById('confirmModal').classList.remove('open');
  confirmHandler = null;
}
document.getElementById('confirmBtn').addEventListener('click', () => {
  const fn = confirmHandler;
  closeConfirm();
  if (fn) fn();
});

// ── New chat ──
const ME_NAME = 'Jay Desai';
// Stable colour per candidate, so the avatar matches before and after the chat is created
const candColorIdx = name => getCandidates().findIndex(c => c.name === name);
function openNewChat() {
  closeChatMenu();
  document.getElementById('ncSearch').value = '';
  renderNewChat();
  document.getElementById('newChatModal').classList.add('open');
  setTimeout(() => document.getElementById('ncSearch').focus(), 50);
}
function closeNewChat() { document.getElementById('newChatModal').classList.remove('open'); }

function renderNewChat() {
  const q = document.getElementById('ncSearch').value.trim().toLowerCase();
  const match = (name, extra) => !q || name.toLowerCase().includes(q) || extra.some(s => s.toLowerCase().includes(q));
  const existing = convData.filter(c => match(c.withName, [c.role]));
  const people = getCandidates().filter(c => c.name !== ME_NAME && !convData.some(v => v.withName === c.name) && match(c.name, c.skills));
  const avatar = (name, bg) => `<div class="conv-av" style="background:${bg}">${name.split(' ').map(w=>w[0]).join('').slice(0,2)}</div>`;

  let html = '';
  if (existing.length) {
    html += `<div class="nc-label">Recent chats</div>` + existing.map(c => `
      <button class="nc-item" onclick="startChat('${c.withName}')">
        ${avatar(c.withName, convGrad(c))}
        <div style="min-width:0"><div class="nc-name">${c.withName}</div><div class="nc-sub">${c.role}</div></div>
        <span class="nc-tag">Existing chat</span>
      </button>`).join('');
  }
  if (people.length) {
    html += `<div class="nc-label">Candidates</div>` + people.map(c => `
      <button class="nc-item" onclick="startChat('${c.name}')">
        ${avatar(c.name, gradients[candColorIdx(c.name) % gradients.length])}
        <div style="min-width:0"><div class="nc-name">${c.name}</div><div class="nc-sub">${c.skills.slice(0,2).join(', ')} · Rank #${c.rank}</div></div>
      </button>`).join('');
  }
  document.getElementById('ncList').innerHTML = html || `<div class="nc-empty">No one matches "${esc(q)}".</div>`;
}

function startChat(name) {
  let conv = convData.find(c => c.withName === name);
  if (!conv) {
    const cand = getCandidates().find(c => c.name === name);
    conv = {
      id: Math.max(...convData.map(c => c.id)) + 1,
      withName: cand.name,
      role: `Candidate · Rank #${cand.rank}`,
      unread: 0,
      messages: [],
      colorIdx: candColorIdx(cand.name),
    };
    convData.unshift(conv);          // newest chat goes to the top (after pinned ones)
    localMessages[conv.id] = [];
    showToast(`New chat with ${cand.name.split(' ')[0]}`);
  }
  closeNewChat();
  document.querySelector('.conv-search input').value = '';
  renderConvList('');
  openConv(conv.id);
}

let toastTimer;
function showToast(msg) {
  document.getElementById('toastText').textContent = msg;
  const t = document.getElementById('toast');
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

function renderMessages(convId) {
  const conv = convData.find(c => c.id === convId);
  const ci = convData.indexOf(conv);
  const msgs = localMessages[convId];
  const container = document.getElementById('chatMessages');

  const q = document.getElementById('chatSearchInput').value.trim();
  const shown = q ? msgs.filter(m => m.text.toLowerCase().includes(q.toLowerCase())) : msgs;
  document.getElementById('chatSearchCount').textContent = q ? `${shown.length} match${shown.length!==1?'es':''}` : '';

  if (!msgs.length) {
    container.innerHTML = `<div class="chat-empty"><div class="chat-empty-icon"><span class="material-symbols-rounded" style="font-size:36px">forum</span></div><p style="font-size:14px">No messages here yet.</p></div>`;
    return;
  }
  if (!shown.length) {
    container.innerHTML = `<div class="chat-empty"><div class="chat-empty-icon"><span class="material-symbols-rounded" style="font-size:36px">search_off</span></div><p style="font-size:14px">No messages match "${esc(q)}".</p></div>`;
    return;
  }

  // Day divider
  let html = `<div class="msg-day"><span>Today</span></div>`;
  shown.forEach(m => {
    const isMine = m.from === 'me';
    const initials = isMine ? ME_INITIALS : conv.withName.split(' ').map(w=>w[0]).join('').slice(0,2);
    const grad = isMine ? ME_GRAD : convGrad(conv);
    html += `<div class="msg-row ${isMine?'mine':''}">
      <div class="msg-av" style="background:${grad}">${initials}</div>
      <div class="msg-col">
        <div class="msg-bubble ${isMine?'mine':'them'}">${highlight(m.text, q)}</div>
        <span class="msg-time">${m.time}</span>
      </div>
    </div>`;
  });
  container.innerHTML = html;
  container.scrollTop = container.scrollHeight;
}

function sendMessage() {
  const inp = document.getElementById('msgInput');
  const text = inp.value.trim();
  if (!text || !activeConvId) return;
  const now = new Date();
  const time = now.getHours().toString().padStart(2,'0') + ':' + now.getMinutes().toString().padStart(2,'0');
  localMessages[activeConvId].push({id: Date.now().toString(), from:'me', text, time});
  inp.value = '';
  inp.style.height = 'auto';
  renderMessages(activeConvId);
  renderConvList();
  if (infoOpen()) renderInfo();
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

function filterConvs(q) {
  renderConvList(q);
}

renderConvList();
openConv(convData[0].id);
</script>
</body>
</html>
