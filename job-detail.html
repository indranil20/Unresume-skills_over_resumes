<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<link rel="icon" type="image/png" href="images/favicon.png">
<title>Job Detail — Unresume</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
<link rel="stylesheet" href="css/globals.css">
<link rel="stylesheet" href="css/navbar.css">
<style>
.page-wrap{overflow-x:clip}
.jd-page{padding:28px 24px 96px;position:relative}
.jd-inner{max-width:1200px;margin:0 auto}
.breadcrumb{display:flex;align-items:center;gap:8px;margin-bottom:20px;font-size:13px;flex-wrap:wrap}
.back-link{display:inline-flex;align-items:center;gap:6px;color:var(--text2);text-decoration:none;font-weight:600;background:#fff;border:1px solid var(--border);border-radius:100px;padding:6px 14px 6px 10px;box-shadow:var(--shadow-sm);transition:all .15s}
.back-link:hover{color:var(--brand);border-color:rgba(79,70,229,.35)}
.crumb-sep{color:var(--text4)}
#breadTitle{color:var(--text3);font-weight:600}

/* header */
.jd-header{position:relative;background:#fff;border:1px solid var(--border);border-radius:24px;box-shadow:var(--shadow-md);overflow:hidden;margin-bottom:24px}
.jd-cover{position:relative;height:110px;background:linear-gradient(100deg,#efedfd 0%,#e4defc 50%,#d6cefb 100%);overflow:hidden}
.jd-cover .b1{position:absolute;width:300px;height:300px;right:10%;top:-170px;border-radius:46% 54% 42% 58%/52% 38% 62% 48%;background:linear-gradient(160deg,#c7c2fa,#b9b1f7);opacity:.6}
.jd-cover .b2{position:absolute;width:380px;height:380px;right:-120px;bottom:-280px;border-radius:50%;background:radial-gradient(circle,rgba(124,58,237,.2),transparent 65%)}
.jd-cover svg{position:absolute;right:36px;top:22px;width:50px;height:50px;stroke:var(--brand);stroke-width:2.4;fill:none;stroke-linecap:round}
.jd-head-body{display:flex;gap:22px;align-items:flex-start;flex-wrap:wrap;padding:20px 32px 28px}
.jd-head-cta{align-self:center}
.job-logo-lg{position:relative;z-index:1;width:96px;height:96px;border-radius:24px;margin-top:-68px;display:flex;align-items:center;justify-content:center;font-size:44px;flex-shrink:0;box-shadow:0 0 0 6px #fff,0 16px 36px rgba(79,70,229,.18)}
.jd-head-info{flex:1;min-width:240px}
.jd-company{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;color:var(--text3);font-weight:600;margin-bottom:4px}
.jd-title{font-family:var(--font-display);font-size:clamp(28px,3.6vw,40px);font-weight:800;color:var(--text1);letter-spacing:-.035em;line-height:1.1;margin-bottom:14px}
.jd-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.meta-badge{display:inline-flex;align-items:center;gap:5px;padding:6px 13px;border-radius:100px;font-size:12.5px;font-weight:700}
.meta-badge .material-symbols-rounded{font-size:15px;font-variation-settings:'FILL' 1}
.jd-head-cta .btn-primary{padding:15px 26px;font-size:14.5px}

.jd-layout{display:grid;grid-template-columns:1fr 340px;gap:24px;align-items:start}
.jd-layout>*{min-width:0}
.jd-main{display:flex;flex-direction:column;gap:20px}
.section-card{background:#fff;border:1px solid var(--border);border-radius:20px;padding:26px 28px;box-shadow:var(--shadow-sm)}
.card-title{display:flex;align-items:center;gap:12px;font-family:var(--font-display);font-size:18px;font-weight:800;color:var(--text1);letter-spacing:-.02em;margin-bottom:16px}
.card-icon{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.card-icon .material-symbols-rounded{font-size:21px;font-variation-settings:'FILL' 1}
.body-text{font-size:14.5px;color:var(--text2);line-height:1.8}
.req-list{list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.req-item{display:flex;align-items:flex-start;gap:12px;font-size:14px;color:var(--text1);font-weight:500;line-height:1.5;background:#fafaff;border:1px solid var(--border);border-radius:14px;padding:14px 16px}
.req-check{width:24px;height:24px;border-radius:50%;background:#e6f8f5;color:#0d9488;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.req-check .material-symbols-rounded{font-size:16px;font-weight:700}
.skills-wrap{display:flex;flex-wrap:wrap;gap:8px}
.skill-tag-lg{padding:8px 16px;background:#eeedfd;border-radius:100px;font-size:13px;font-weight:700;color:var(--brand)}

/* Task section */
.task-section{position:relative;overflow:hidden;background:linear-gradient(160deg,#f5f3ff 0%,#fff 45%);border:1px solid #e2defb;border-radius:24px;padding:30px;display:flex;flex-direction:column;gap:24px;box-shadow:0 24px 50px rgba(79,70,229,.1)}
.task-section::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,#4f46e5,#7c3aed,#c026d3)}
.task-head{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.task-icon-wrap{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#fff;background:linear-gradient(90deg,#4f46e5,#7c3aed);box-shadow:var(--shadow-brand)}
.task-icon-wrap .material-symbols-rounded{font-size:24px;font-variation-settings:'FILL' 1}
.task-eyebrow{font-size:11px;font-weight:700;color:var(--brand);letter-spacing:.08em;text-transform:uppercase;margin-bottom:3px}
.task-title{font-family:var(--font-display);font-size:21px;font-weight:800;color:var(--text1);letter-spacing:-.02em}
.task-stats{display:flex;gap:8px;flex-wrap:wrap}
.task-stat{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:var(--text2);background:#fff;border:1px solid var(--border);border-radius:100px;padding:7px 13px}
.task-stat .material-symbols-rounded{font-size:16px;color:var(--brand)}
.task-brief{background:#fff;border:1px solid var(--border);border-radius:16px;padding:20px 22px}
.sub-title{font-size:14px;font-weight:700;color:var(--text1);margin-bottom:10px}
.rubric-box{background:#fff;border:1px solid var(--border);border-radius:16px;padding:18px 22px}
.rubric-row{grid-template-columns:1.1fr 1fr 60px}
.rubric-bar-outer{height:8px;background:#eeedfd}
.file-type-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.file-type-card{background:#fff;border:1px solid var(--border);border-radius:16px;padding:16px;display:flex;gap:14px;align-items:center}
.file-icon{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.file-icon .material-symbols-rounded{font-size:21px;font-variation-settings:'FILL' 1}
.apply-btn{width:100%;padding:16px;background:linear-gradient(90deg,#4f46e5,#7c3aed);border:none;border-radius:14px;font-size:15.5px;font-weight:700;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .2s,filter .2s,box-shadow .2s;text-decoration:none;box-shadow:0 8px 24px rgba(79,70,229,.32)}
.apply-btn:hover{filter:brightness(1.06);transform:translateY(-1px);box-shadow:0 12px 30px rgba(79,70,229,.4)}
.no-task{text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px}

/* Aside */
.jd-aside{display:flex;flex-direction:column;gap:18px;position:sticky;top:110px}
.aside-card{background:#fff;border:1px solid var(--border);border-radius:20px;padding:22px;box-shadow:var(--shadow-sm)}
.aside-apply{position:relative;overflow:hidden;background:linear-gradient(140deg,#4f46e5,#7c3aed);border:none;color:#fff;box-shadow:0 20px 40px rgba(79,70,229,.3)}
.aside-apply::before{content:'';position:absolute;width:220px;height:220px;right:-80px;top:-90px;border-radius:50%;background:rgba(255,255,255,.12)}
.aside-apply::after{content:'';position:absolute;width:140px;height:140px;left:-50px;bottom:-70px;border-radius:50%;background:rgba(255,255,255,.08)}
.aside-apply>*{position:relative;z-index:1}
.aside-apply .aside-title{color:#fff;font-size:18px}
.aside-apply p{color:rgba(255,255,255,.85)!important}
.aside-title{font-family:var(--font-display);font-size:15px;font-weight:800;color:var(--text1);margin-bottom:10px;letter-spacing:-.01em}
.aside-apply-btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:13px;background:#fff;border:none;border-radius:12px;font-size:14px;font-weight:700;color:var(--brand);cursor:pointer;text-decoration:none;transition:transform .15s,box-shadow .15s;margin-top:16px;box-shadow:0 6px 16px rgba(14,18,48,.15)}
.aside-apply-btn:hover{transform:translateY(-1px);box-shadow:0 10px 22px rgba(14,18,48,.2)}
.aside-apply-btn .material-symbols-rounded{font-size:18px}
.company-row{display:flex;align-items:center;gap:12px;margin-top:4px}
.company-logo{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0}
.steps{position:relative;display:flex;flex-direction:column;gap:16px;margin-top:6px}
.steps::before{content:'';position:absolute;left:15px;top:16px;bottom:16px;width:2px;background:repeating-linear-gradient(180deg,#d9d7ee 0 4px,transparent 4px 8px)}
.step-row{position:relative;display:flex;gap:12px;align-items:center}
.step-num{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:#fff;flex-shrink:0;box-shadow:0 0 0 4px #fff}

.jd-empty{text-align:center;padding:64px 24px;display:flex;flex-direction:column;align-items:center;gap:14px}
.jd-empty-icon{width:64px;height:64px;border-radius:50%;background:#eeedfd;color:var(--brand);display:flex;align-items:center;justify-content:center}

@media(max-width:960px){
  .jd-layout{grid-template-columns:1fr}
  .jd-aside{position:static}
}
@media(max-width:640px){
  .jd-head-body{padding:20px 20px 22px;flex-direction:column;align-items:flex-start;gap:16px}
  .jd-head-cta{align-self:stretch}
  .jd-head-cta,.jd-head-cta .btn-primary{width:100%;justify-content:center}
  .req-list,.file-type-grid{grid-template-columns:1fr}
  .section-card{padding:22px 20px}
  .task-section{padding:24px 18px}
  .rubric-row{grid-template-columns:1fr 60px}
  .rubric-row .rubric-bar-outer{grid-column:1/-1;grid-row:2}
}
</style>
</head>
<body>
<div id="navbar"></div>
<div class="page-wrap">
  <div class="jd-page">
    <div class="jd-inner">
      <div class="breadcrumb">
        <a href="jobs.html" class="back-link"><span class="material-symbols-rounded" style="font-size:18px">arrow_back</span> All Jobs</a>
        <span class="crumb-sep">/</span>
        <span id="breadTitle">Loading…</span>
      </div>
      <div id="jdHeader"></div>
      <div class="jd-layout">
        <div class="jd-main" id="jdMain">
          <div style="color:var(--text4);padding:40px 0">Loading job…</div>
        </div>
        <aside class="jd-aside" id="jdAside"></aside>
      </div>
    </div>
  </div>
</div>
<div id="footer"></div>
<script src="js/components.js"></script>
<script src="js/data.js"></script>
<script>
const params = new URLSearchParams(location.search);
const id = parseInt(params.get('id'));
const jobs = getJobs(), tasks = getTasks();
const job = jobs.find(j => j.id === id);
const catTint = { Engineering:'tint-blue', Design:'tint-pink', Data:'tint-purple' };

if (!job) {
  document.getElementById('breadTitle').textContent = 'Not found';
  document.getElementById('jdMain').innerHTML = `<div class="section-card jd-empty">
    <div class="jd-empty-icon"><span class="material-symbols-rounded" style="font-size:30px">search_off</span></div>
    <p style="color:var(--text3);font-size:14px">This job listing doesn't exist or may have been removed.</p>
    <a href="jobs.html" class="back-link"><span class="material-symbols-rounded" style="font-size:18px">arrow_back</span> Back to all jobs</a>
  </div>`;
  document.querySelector('.jd-layout').style.gridTemplateColumns = '1fr';
  throw new Error('Job not found');
}

const task = job.hasTask ? tasks.find(t => t.jobId === job.id) : null;
const tint = catTint[job.category] || 'tint-teal';
const applyHref = task ? `task-workplace.html?id=${task.id}` : '#';

document.title = `${job.title} — Unresume`;
document.getElementById('breadTitle').textContent = job.title;

document.getElementById('jdHeader').innerHTML = `
  <div class="jd-header">
    <div class="jd-cover">
      <div class="b1"></div><div class="b2"></div>
      <svg viewBox="0 0 44 44" aria-hidden="true"><path d="M8 30 L26 6"/><path d="M20 36 L38 14"/><path d="M30 40 L40 32"/></svg>
    </div>
    <div class="jd-head-body">
      <div class="job-logo-lg ${tint}">${job.logo}</div>
      <div class="jd-head-info">
        <div class="jd-company"><span class="material-symbols-rounded" style="font-size:17px;color:var(--brand)">apartment</span>${job.company}</div>
        <div class="jd-title">${job.title}</div>
        <div class="jd-meta">
          <span class="meta-badge ${tint}"><span class="material-symbols-rounded">category</span>${job.category}</span>
          ${job.hasTask?`<span class="meta-badge tint-teal"><span class="material-symbols-rounded">task_alt</span>Includes Task</span>`:''}
          ${job.featured?`<span class="meta-badge" style="background:linear-gradient(90deg,#4f46e5,#7c3aed);color:#fff"><span class="material-symbols-rounded">bolt</span>Featured</span>`:''}
        </div>
      </div>
      ${task ? `<div class="jd-head-cta"><a href="${applyHref}" class="btn-primary">Start Task & Apply <span class="material-symbols-rounded" style="font-size:18px">arrow_forward</span></a></div>` : ''}
    </div>
  </div>`;

document.getElementById('jdMain').innerHTML = `
  <div class="section-card">
    <div class="card-title"><span class="card-icon tint-blue"><span class="material-symbols-rounded">info</span></span>About this role</div>
    <p class="body-text">${job.description}</p>
  </div>

  <div class="section-card">
    <div class="card-title"><span class="card-icon tint-teal"><span class="material-symbols-rounded">checklist</span></span>Requirements</div>
    <ul class="req-list">
      ${job.requirements.map(r=>`<li class="req-item"><span class="req-check"><span class="material-symbols-rounded">check</span></span>${r}</li>`).join('')}
    </ul>
  </div>

  <div class="section-card">
    <div class="card-title"><span class="card-icon tint-pink"><span class="material-symbols-rounded">psychology</span></span>Skills Assessed</div>
    <div class="skills-wrap">${job.skills.map(s=>`<span class="skill-tag-lg">${s}</span>`).join('')}</div>
  </div>

  ${task ? `
  <div class="task-section">
    <div class="task-head">
      <div style="display:flex;align-items:center;gap:14px">
        <div class="task-icon-wrap"><span class="material-symbols-rounded">assignment</span></div>
        <div>
          <div class="task-eyebrow">Skill Task</div>
          <div class="task-title">${task.title}</div>
        </div>
      </div>
      <div class="task-stats">
        <span class="task-stat"><span class="material-symbols-rounded">schedule</span>${task.timeLimit}</span>
        <span class="task-stat"><span class="material-symbols-rounded">group</span>${task.submissionsCount} submissions</span>
      </div>
    </div>

    <div class="task-brief">
      <div class="sub-title">Task Brief</div>
      <p class="body-text">${task.brief}</p>
    </div>

    <div class="rubric-box">
      <div class="sub-title">Scoring Rubric <span style="font-size:11.5px;font-weight:500;color:var(--text4)">(you see this before you submit)</span></div>
      ${task.rubric.map(r=>`
        <div class="rubric-row">
          <div style="font-size:13.5px;color:var(--text1);font-weight:600">${r.criterion}</div>
          <div class="rubric-bar-outer"><div class="rubric-bar-inner" style="width:${r.points}%"></div></div>
          <div style="font-size:13px;font-weight:800;color:var(--brand);text-align:right">${r.points}pts</div>
        </div>`).join('')}
    </div>

    <div class="file-type-grid">
      <div class="file-type-card">
        <div class="file-icon tint-purple"><span class="material-symbols-rounded">lock</span></div>
        <div><div style="font-size:14px;font-weight:700;color:var(--text1)">Working File</div><div style="font-size:12.5px;color:var(--text3)">Private — only you and the reviewer</div></div>
      </div>
      <div class="file-type-card">
        <div class="file-icon tint-teal"><span class="material-symbols-rounded">public</span></div>
        <div><div style="font-size:14px;font-weight:700;color:var(--text1)">Final Output</div><div style="font-size:12.5px;color:var(--text3)">Public — shown in your portfolio</div></div>
      </div>
    </div>

    <a href="${applyHref}" class="apply-btn">
      Start Task & Apply
      <span class="material-symbols-rounded" style="font-size:20px">arrow_forward</span>
    </a>
  </div>` : `<div class="section-card no-task">
    <div class="jd-empty-icon"><span class="material-symbols-rounded" style="font-size:30px">mail</span></div>
    <p style="color:var(--text3);font-size:14px">This listing doesn't include a task. Contact the company to apply.</p>
  </div>`}
`;

const stepGrads = ['linear-gradient(135deg,#8b5cf6,#6d28d9)','linear-gradient(135deg,#38bdf8,#2563eb)','linear-gradient(135deg,#e879f9,#a855f7)'];
document.getElementById('jdAside').innerHTML = `
  <div class="aside-card aside-apply">
    <div class="aside-title">Apply via Task</div>
    <p style="font-size:13.5px;line-height:1.7">${job.hasTask?'Complete the task and submit. No resume, no cover letter — just your work.':'Contact the company directly to apply for this role.'}</p>
    <a href="${applyHref}" class="aside-apply-btn">${job.hasTask?'Start Task':'Contact Company'} <span class="material-symbols-rounded">arrow_forward</span></a>
  </div>

  <div class="aside-card">
    <div class="aside-title">About ${job.company}</div>
    <div class="company-row">
      <div class="company-logo ${tint}">${job.logo}</div>
      <div><div style="font-weight:700;color:var(--text1);font-size:14.5px">${job.company}</div><div style="font-size:12.5px;color:var(--text3)">${job.category}</div></div>
    </div>
  </div>

  <div class="aside-card">
    <div class="aside-title">How it works</div>
    <div class="steps">
      ${['Complete the task','Get scored by reviewer','HR contacts top scorers'].map((s,i)=>`<div class="step-row"><div class="step-num" style="background:${stepGrads[i]}">${i+1}</div><span style="font-size:13.5px;color:var(--text1);font-weight:600;line-height:1.5">${s}</span></div>`).join('')}
    </div>
  </div>`;
</script>
</body>
</html>
