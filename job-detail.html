<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<link rel="icon" type="image/png" href="images/favicon.png">
<title>Job Detail — Unresume</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
<link rel="stylesheet" href="css/globals.css">
<link rel="stylesheet" href="css/navbar.css">
<link rel="stylesheet" href="css/dashboard.css">
<style>
.page-wrap{overflow-x:clip}
.jd-page{padding:28px 24px 96px;position:relative}
.jd-inner{max-width:1200px;margin:0 auto}
.breadcrumb{display:flex;align-items:center;gap:8px;margin-bottom:20px;font-size:13px;flex-wrap:wrap}
.back-link{display:inline-flex;align-items:center;gap:6px;color:var(--text2);text-decoration:none;font-weight:600;background:#fff;border:1px solid var(--border);border-radius:100px;padding:6px 14px 6px 10px;box-shadow:var(--shadow-sm);transition:all .15s}
.back-link:hover{color:var(--brand);border-color:rgba(79,70,229,.35)}
.crumb-sep{color:var(--text4)}
#breadTitle{color:var(--text3);font-weight:600}

/* header */
.jd-header{position:relative;background:#fff;border:1px solid var(--border);border-radius:24px;box-shadow:var(--shadow-md);overflow:hidden;margin-bottom:24px}
.jd-cover{position:relative;height:110px;background:linear-gradient(100deg,#efedfd 0%,#e4defc 50%,#d6cefb 100%);overflow:hidden}
.jd-cover .b1{position:absolute;width:300px;height:300px;right:10%;top:-170px;border-radius:46% 54% 42% 58%/52% 38% 62% 48%;background:linear-gradient(160deg,#c7c2fa,#b9b1f7);opacity:.6}
.jd-cover .b2{position:absolute;width:380px;height:380px;right:-120px;bottom:-280px;border-radius:50%;background:radial-gradient(circle,rgba(124,58,237,.2),transparent 65%)}
.jd-cover svg{position:absolute;right:36px;top:22px;width:50px;height:50px;stroke:var(--brand);stroke-width:2.4;fill:none;stroke-linecap:round}
.jd-head-body{display:flex;gap:22px;align-items:flex-start;flex-wrap:wrap;padding:20px 32px 28px}
.jd-head-cta{align-self:center}
.job-logo-lg{position:relative;z-index:1;width:96px;height:96px;border-radius:24px;margin-top:-68px;display:flex;align-items:center;justify-content:center;font-size:44px;flex-shrink:0;box-shadow:0 0 0 6px #fff,0 16px 36px rgba(79,70,229,.18)}
.jd-head-info{flex:1;min-width:240px}
.jd-company{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;color:var(--text3);font-weight:600;margin-bottom:4px}
.jd-title{font-family:var(--font-display);font-size:clamp(28px,3.6vw,40px);font-weight:800;color:var(--text1);letter-spacing:-.035em;line-height:1.1;margin-bottom:14px}
.jd-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.meta-badge{display:inline-flex;align-items:center;gap:5px;padding:6px 13px;border-radius:100px;font-size:12.5px;font-weight:700}
.meta-badge .material-symbols-rounded{font-size:15px;font-variation-settings:'FILL' 1}
.jd-head-cta .btn-primary{padding:15px 26px;font-size:14.5px}

.jd-layout{display:grid;grid-template-columns:1fr 340px;gap:24px;align-items:start}
.jd-layout>*{min-width:0}
.jd-main{display:flex;flex-direction:column;gap:20px}
.section-card{background:#fff;border:1px solid var(--border);border-radius:20px;padding:26px 28px;box-shadow:var(--shadow-sm)}
.card-title{display:flex;align-items:center;gap:12px;font-family:var(--font-display);font-size:18px;font-weight:800;color:var(--text1);letter-spacing:-.02em;margin-bottom:16px}
.card-icon{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.card-icon .material-symbols-rounded{font-size:21px;font-variation-settings:'FILL' 1}
.body-text{font-size:14.5px;color:var(--text2);line-height:1.8}
.req-list{list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.req-item{display:flex;align-items:flex-start;gap:12px;font-size:14px;color:var(--text1);font-weight:500;line-height:1.5;background:#fafaff;border:1px solid var(--border);border-radius:14px;padding:14px 16px}
.req-check{width:24px;height:24px;border-radius:50%;background:#e6f8f5;color:#0d9488;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.req-check .material-symbols-rounded{font-size:16px;font-weight:700}
.skills-wrap{display:flex;flex-wrap:wrap;gap:8px}
.skill-tag-lg{padding:8px 16px;background:#eeedfd;border-radius:100px;font-size:13px;font-weight:700;color:var(--brand)}

/* Task section */
.task-section{position:relative;overflow:hidden;background:linear-gradient(160deg,#f5f3ff 0%,#fff 45%);border:1px solid #e2defb;border-radius:24px;padding:30px;display:flex;flex-direction:column;gap:24px;box-shadow:0 24px 50px rgba(79,70,229,.1)}
.task-section::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,#4f46e5,#7c3aed,#c026d3)}
.task-head{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.task-icon-wrap{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#fff;background:linear-gradient(90deg,#4f46e5,#7c3aed);box-shadow:var(--shadow-brand)}
.task-icon-wrap .material-symbols-rounded{font-size:24px;font-variation-settings:'FILL' 1}
.task-eyebrow{font-size:11px;font-weight:700;color:var(--brand);letter-spacing:.08em;text-transform:uppercase;margin-bottom:3px}
.task-title{font-family:var(--font-display);font-size:21px;font-weight:800;color:var(--text1);letter-spacing:-.02em}
.task-stats{display:flex;gap:8px;flex-wrap:wrap}
.task-stat{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:var(--text2);background:#fff;border:1px solid var(--border);border-radius:100px;padding:7px 13px}
.task-stat .material-symbols-rounded{font-size:16px;color:var(--brand)}
.task-brief{background:#fff;border:1px solid var(--border);border-radius:16px;padding:20px 22px}
.sub-title{font-size:14px;font-weight:700;color:var(--text1);margin-bottom:10px}
.rubric-box{background:#fff;border:1px solid var(--border);border-radius:16px;padding:18px 22px}
.rubric-row{grid-template-columns:1.1fr 1fr 60px}
.rubric-bar-outer{height:8px;background:#eeedfd}
.file-type-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.file-type-card{background:#fff;border:1px solid var(--border);border-radius:16px;padding:16px;display:flex;gap:14px;align-items:center}
.file-icon{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.file-icon .material-symbols-rounded{font-size:21px;font-variation-settings:'FILL' 1}
.apply-btn{width:100%;padding:16px;background:linear-gradient(90deg,#4f46e5,#7c3aed);border:none;border-radius:14px;font-size:15.5px;font-weight:700;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .2s,filter .2s,box-shadow .2s;text-decoration:none;box-shadow:0 8px 24px rgba(79,70,229,.32)}
.apply-btn:hover{filter:brightness(1.06);transform:translateY(-1px);box-shadow:0 12px 30px rgba(79,70,229,.4)}
.no-task{text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px}

/* Aside */
.jd-aside{display:flex;flex-direction:column;gap:18px;position:sticky;top:110px}
.aside-card{background:#fff;border:1px solid var(--border);border-radius:20px;padding:22px;box-shadow:var(--shadow-sm)}
.aside-apply{position:relative;overflow:hidden;background:linear-gradient(140deg,#4f46e5,#7c3aed);border:none;color:#fff;box-shadow:0 20px 40px rgba(79,70,229,.3)}
.aside-apply::before{content:'';position:absolute;width:220px;height:220px;right:-80px;top:-90px;border-radius:50%;background:rgba(255,255,255,.12)}
.aside-apply::after{content:'';position:absolute;width:140px;height:140px;left:-50px;bottom:-70px;border-radius:50%;background:rgba(255,255,255,.08)}
.aside-apply>*{position:relative;z-index:1}
.aside-apply .aside-title{color:#fff;font-size:18px}
.aside-apply p{color:rgba(255,255,255,.85)!important}
.aside-title{font-family:var(--font-display);font-size:15px;font-weight:800;color:var(--text1);margin-bottom:10px;letter-spacing:-.01em}
.aside-apply-btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:13px;background:#fff;border:none;border-radius:12px;font-size:14px;font-weight:700;color:var(--brand);cursor:pointer;text-decoration:none;transition:transform .15s,box-shadow .15s;margin-top:16px;box-shadow:0 6px 16px rgba(14,18,48,.15)}
.aside-apply-btn:hover{transform:translateY(-1px);box-shadow:0 10px 22px rgba(14,18,48,.2)}
.aside-apply-btn .material-symbols-rounded{font-size:18px}
.company-row{display:flex;align-items:center;gap:12px;margin-top:4px}
.company-logo{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0}
.steps{position:relative;display:flex;flex-direction:column;gap:16px;margin-top:6px}
.steps::before{content:'';position:absolute;left:15px;top:16px;bottom:16px;width:2px;background:repeating-linear-gradient(180deg,#d9d7ee 0 4px,transparent 4px 8px)}
.step-row{position:relative;display:flex;gap:12px;align-items:center}
.step-num{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:#fff;flex-shrink:0;box-shadow:0 0 0 4px #fff}

.journey{list-style:none;display:flex;gap:6px;flex-wrap:wrap;padding:0;margin:0}
.journey li{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:var(--text4);padding:6px 11px 6px 6px;border-radius:100px;background:var(--bg-elevated)}
.journey li span{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#fff}
.journey li.done{color:#0d9488;background:#e6f8f5}.journey li.now{color:#fff;background:linear-gradient(90deg,#4f46e5,#7c3aed)}.journey li.now span{color:var(--brand)}
.trust-list{list-style:none;padding:0;margin:14px 0 0;display:flex;flex-direction:column;gap:8px}
.trust-list li{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--text3);font-weight:600}.trust-list li.ok .material-symbols-rounded{color:#0d9488}
.jd-empty{text-align:center;padding:64px 24px;display:flex;flex-direction:column;align-items:center;gap:14px}
.jd-empty-icon{width:64px;height:64px;border-radius:50%;background:#eeedfd;color:var(--brand);display:flex;align-items:center;justify-content:center}

@media(max-width:960px){
  .jd-layout{grid-template-columns:1fr}
  .jd-aside{position:static}
}
@media(max-width:640px){
  .jd-head-body{padding:20px 20px 22px;flex-direction:column;align-items:flex-start;gap:16px}
  .jd-head-cta{align-self:stretch}
  .jd-head-cta,.jd-head-cta .btn-primary{width:100%;justify-content:center}
  .req-list,.file-type-grid{grid-template-columns:1fr}
  .section-card{padding:22px 20px}
  .task-section{padding:24px 18px}
  .rubric-row{grid-template-columns:1fr 60px}
  .rubric-row .rubric-bar-outer{grid-column:1/-1;grid-row:2}
}
</style>
</head>
<body>
<div id="navbar"></div>
<div class="page-wrap">
  <div class="jd-page">
    <div class="jd-inner">
      <div class="breadcrumb">
        <a href="jobs.html" class="back-link"><span class="material-symbols-rounded" style="font-size:18px">arrow_back</span> All Jobs</a>
        <span class="crumb-sep">/</span>
        <span id="breadTitle">Loading…</span>
      </div>
      <div id="jdHeader"></div>
      <div class="jd-layout">
        <div class="jd-main" id="jdMain">
          <div style="color:var(--text4);padding:40px 0">Loading job…</div>
        </div>
        <aside class="jd-aside" id="jdAside"></aside>
      </div>
    </div>
  </div>
</div>
<div id="footer"></div>
<script src="js/data.js"></script>
<script src="js/store.js"></script>
<script src="js/ui.js"></script>
<script src="js/components.js"></script>
<script>
const catTint = { Engineering:'tint-blue', Design:'tint-pink', Data:'tint-purple', Product:'tint-amber' };
const esc = UI.esc;

function render() {
  const id = parseInt(UI.param('id'), 10);
  const job = Number.isFinite(id) ? UR.jobs.get(id) : null;
  const u = UR.user();
  if (!job) {
    document.getElementById('breadTitle').textContent = 'Not found';
    document.getElementById('jdHeader').innerHTML = '';
    document.getElementById('jdAside').innerHTML = '';
    document.getElementById('jdMain').innerHTML = `<div class="section-card jd-empty">
      <div class="jd-empty-icon"><span class="material-symbols-rounded" style="font-size:30px">search_off</span></div>
      <p style="color:var(--text3);font-size:14px">This job listing doesn't exist, has closed, or was removed.</p>
      <a href="jobs.html" class="back-link"><span class="material-symbols-rounded" style="font-size:18px">arrow_back</span> Back to all jobs</a></div>`;
    document.querySelector('.jd-layout').style.gridTemplateColumns = '1fr';
    return;
  }
  const task = job.task;
  const el = UR.verifiedApply.eligibility(job.id) || { offered: false };
  const kindInfo = task ? UR.ASSESSMENT_KINDS[task.kind || 'advanced'] : null, aiInfo = task ? UR.AI_POLICY[task.aiPolicy || 'disclose'] : null;
  const tint = catTint[job.category] || 'tint-teal';
  const app = u && u.role === 'candidate' ? UR.applications.forJob(job.id) : null;
  const isCandidate = !u || u.role === 'candidate';
  const closed = job.status !== 'open';
  const deadlinePassed = job.deadline && new Date(job.deadline) < new Date();
  const taskHref = `task-workplace.html?id=${task ? task.id : ''}`;
  const loginHref = `login.html?next=${encodeURIComponent('task-workplace.html?id=' + (task ? task.id : ''))}`;

  // Primary call to action depends on who is viewing and where they are in the process
  let cta;
  if (!task || closed || deadlinePassed) cta = { label: closed ? 'Applications closed' : deadlinePassed ? 'Deadline passed' : 'Task not published', href: null };
  else if (!u) cta = { label: 'Sign in to start task', href: loginHref };
  else if (!isCandidate) cta = { label: 'Only candidates can apply', href: null };
  else if ((!app || app.status === 'withdrawn') && el.met) cta = { label: 'Apply with verified scores', href: '#apply-verified' };
  else if (!app || app.status === 'withdrawn') cta = { label: 'Start Task & Apply', href: taskHref };
  else if (app.taskRequested && !app.submission && app.status !== 'in_progress') cta = { label: 'Start requested task', href: taskHref };
  else if (app.status === 'in_progress') cta = { label: 'Continue task', href: taskHref };
  else cta = { label: 'View application', href: 'my-applications.html' };

  document.title = `${job.title} — Unresume`;
  document.getElementById('breadTitle').textContent = job.title;
  const ctaBtn = cls => cta.href ? `<a href="${cta.href}" class="${cls}">${esc(cta.label)} <span class="material-symbols-rounded" style="font-size:18px">arrow_forward</span></a>` : `<button class="${cls}" disabled style="opacity:.55;cursor:not-allowed">${esc(cta.label)}</button>`;

  document.getElementById('jdHeader').innerHTML = `
  <div class="jd-header">
    <div class="jd-cover"><div class="b1"></div><div class="b2"></div><svg viewBox="0 0 44 44" aria-hidden="true"><path d="M8 30 L26 6"/><path d="M20 36 L38 14"/><path d="M30 40 L40 32"/></svg></div>
    <div class="jd-head-body">
      <div class="job-logo-lg ${tint}">${job.logo}</div>
      <div class="jd-head-info">
        <div class="jd-company"><span class="material-symbols-rounded" style="font-size:17px;color:var(--brand)">apartment</span>${esc(job.company)}${job.companyVerified ? ' <span class="material-symbols-rounded" title="Verified company" style="font-size:16px;color:#0d9488;font-variation-settings:\'FILL\' 1">verified</span>' : ''}</div>
        <div class="jd-title">${esc(job.title)}</div>
        <div class="jd-meta">
          <span class="meta-badge ${tint}"><span class="material-symbols-rounded">category</span>${esc(job.category)}</span>
          ${job.location ? `<span class="meta-badge tint-blue"><span class="material-symbols-rounded">location_on</span>${esc(job.location)}</span>` : ''}
          ${job.deadline ? `<span class="meta-badge ${deadlinePassed ? 'tint-red' : 'tint-amber'}"><span class="material-symbols-rounded">event</span>Apply by ${UI.fmtDate(job.deadline)}</span>` : ''}
          ${job.featured ? `<span class="meta-badge" style="background:linear-gradient(90deg,#4f46e5,#7c3aed);color:#fff"><span class="material-symbols-rounded">bolt</span>Featured</span>` : ''}
          ${app ? UI.appPill(app.status) : ''}
        </div>
      </div>
      <div class="jd-head-cta">${ctaBtn('btn-primary')}</div>
    </div>
  </div>`;

  document.getElementById('jdMain').innerHTML = `
  <div class="section-card"><div class="card-title"><span class="card-icon tint-blue"><span class="material-symbols-rounded">info</span></span>About this role</div><p class="body-text">${esc(job.description)}</p></div>
  <div class="section-card"><div class="card-title"><span class="card-icon tint-teal"><span class="material-symbols-rounded">checklist</span></span>Role requirements</div>
    <ul class="req-list">${job.requirements.map(r => `<li class="req-item"><span class="req-check"><span class="material-symbols-rounded">check</span></span>${esc(r)}</li>`).join('')}</ul></div>
  <div class="section-card"><div class="card-title"><span class="card-icon tint-pink"><span class="material-symbols-rounded">psychology</span></span>Skills assessed</div>
    <div class="skills-wrap">${job.skills.map(s => `<span class="skill-tag-lg">${esc(s)}</span>`).join('')}</div></div>
  ${journeyHTML(app)}
  ${el.offered ? verifiedCardHTML(job, el, app) : ''}
  ${task ? `
  <div class="task-section">
    <div class="task-head">
      <div style="display:flex;align-items:center;gap:14px"><div class="task-icon-wrap"><span class="material-symbols-rounded">assignment</span></div>
        <div><div class="task-eyebrow">Skill task · how you apply</div><div class="task-title">${esc(task.title)}</div></div></div>
      <div class="task-stats">
        <span class="task-stat"><span class="material-symbols-rounded">category</span>${esc(kindInfo.label)}</span>
        <span class="task-stat"><span class="material-symbols-rounded">hourglass_top</span>~${task.estimatedHours}h of work</span>
        <span class="task-stat"><span class="material-symbols-rounded">timer</span>${UR.fmtDuration(task.timeLimitMin)} window once started</span>
        <span class="task-stat"><span class="material-symbols-rounded">signal_cellular_alt</span>${esc(task.difficulty || 'Intermediate')}</span>
        <span class="task-stat"><span class="material-symbols-rounded">group</span>${job.applicants} applicant${job.applicants === 1 ? '' : 's'}</span>
      </div>
    </div>
    <div class="d-note">${UI.icon('smart_toy')}<div><b>${esc(aiInfo.label)}.</b> ${esc(aiInfo.desc)} <a href="terms.html#integrity" style="color:var(--brand);font-weight:700">AI-use policy</a></div></div>
    ${task.confidential ? `<div class="d-note warn">${UI.icon('lock')}<div><b>Confidential task.</b> Your output can be shown to recruiters but not posted publicly.</div></div>` : ''}
    <div class="task-brief"><div class="sub-title">Task brief</div><p class="body-text">${esc(task.brief)}</p></div>
    <div class="task-brief"><div class="sub-title">Task requirements — what your submission must include</div>
      <ul class="req-list" style="margin-top:10px">${task.requirements.map(r => `<li class="req-item"><span class="req-check"><span class="material-symbols-rounded">check</span></span>${esc(r)}</li>`).join('')}</ul></div>
    <div class="rubric-box">
      <div class="sub-title">Scoring rubric <span style="font-size:11.5px;font-weight:500;color:var(--text4)">(100 points — the reviewer scores each criterion)</span></div>
      ${task.rubric.map(r => `<div class="rubric-row">
        <div><div style="font-size:13.5px;color:var(--text1);font-weight:600">${esc(r.criterion)}</div>${r.description ? `<div style="font-size:12px;color:var(--text3)">${esc(r.description)}</div>` : ''}</div>
        <div class="rubric-bar-outer"><div class="rubric-bar-inner" style="width:${r.points}%"></div></div>
        <div style="font-size:13px;font-weight:800;color:var(--brand);text-align:right">${r.points} pts</div></div>`).join('')}
    </div>
    <div class="file-type-grid">
      <div class="file-type-card"><div class="file-icon tint-purple"><span class="material-symbols-rounded">lock</span></div><div><div style="font-size:14px;font-weight:700;color:var(--text1)">Working File</div><div style="font-size:12.5px;color:var(--text3)">Private — only you and the reviewer</div></div></div>
      <div class="file-type-card"><div class="file-icon tint-teal"><span class="material-symbols-rounded">public</span></div><div><div style="font-size:14px;font-weight:700;color:var(--text1)">Final Output</div><div style="font-size:12.5px;color:var(--text3)">${esc((task.submissionTypes || []).join(' · ') || 'Any format')}</div></div></div>
    </div>
    ${ctaBtn('apply-btn')}
  </div>` : `<div class="section-card no-task"><div class="jd-empty-icon"><span class="material-symbols-rounded" style="font-size:30px">assignment_late</span></div><p style="color:var(--text3);font-size:14px">The company hasn't published the task for this role yet, so applications are not open.</p></div>`}`;

  const stepGrads = ['linear-gradient(135deg,#8b5cf6,#6d28d9)', 'linear-gradient(135deg,#38bdf8,#2563eb)', 'linear-gradient(135deg,#e879f9,#a855f7)', 'linear-gradient(135deg,#2dd4bf,#0d9488)'];
  document.getElementById('jdAside').innerHTML = `
  <div class="aside-card aside-apply">
    <div class="aside-title">${app && app.status !== 'withdrawn' ? 'Your application' : el.met ? 'Two ways to apply' : 'Apply via task'}</div>
    <p style="font-size:13.5px;line-height:1.7">${app && app.status !== 'withdrawn' ? `Status: <b>${UR.APP_STATUS[app.status].label}</b>${app.taskScore != null ? ` · verified score ${app.taskScore}/100` : ''}` : el.met ? 'Your verified scores qualify — apply now without a new task, or take the role task below.' : `Complete the task (~${task ? task.estimatedHours : '?'}h of work) and submit. No resume, no cover letter — just your work.`}</p>
    ${cta.href ? `<a href="${cta.href}" class="aside-apply-btn">${esc(cta.label)} <span class="material-symbols-rounded">arrow_forward</span></a>` : `<div class="aside-apply-btn" style="opacity:.7;cursor:default">${esc(cta.label)}</div>`}
  </div>
  <div class="aside-card">
    <div class="aside-title">About ${esc(job.company)}</div>
    <div class="company-row"><div class="company-logo ${tint}">${job.logo}</div><div><div style="font-weight:700;color:var(--text1);font-size:14.5px">${esc(job.company)}</div><div style="font-size:12.5px;color:var(--text3)">${esc(job.type || '')}</div></div></div>
    <ul class="trust-list">
      <li class="${job.trust.verified ? 'ok' : ''}">${UI.icon(job.trust.verified ? 'verified' : 'help', 17)}${job.trust.verified ? 'Company verified by Unresume' : 'Company not yet verified'}</li>
      <li class="${job.trust.hasActiveRecruiter ? 'ok' : ''}">${UI.icon('person_check', 17)}${job.trust.hasActiveRecruiter ? 'Active recruiter on this account' : 'No active recruiter'}</li>
      <li class="ok">${UI.icon('handshake', 17)}${job.trust.hires} hire${job.trust.hires === 1 ? '' : 's'} made on Unresume</li>
      <li class="ok">${UI.icon('schedule', 17)}${job.trust.avgReviewDays != null ? `Reviews in ~${job.trust.avgReviewDays} days` : 'No reviews yet'} · target ≤ ${job.trust.reviewSlaDays} days</li>
      <li class="ok">${UI.icon('gavel', 17)}Scores can be disputed with Unresume, not the company</li>
    </ul>
  </div>
  <div class="aside-card">
    <div class="aside-title">How it works</div>
    <div class="steps">${['Start the task — the timer begins', 'Submit working file + final output', 'A company reviewer scores it against the rubric', 'Top scorers are shortlisted and invited to interview'].map((s, i) => `<div class="step-row"><div class="step-num" style="background:${stepGrads[i]}">${i + 1}</div><span style="font-size:13.5px;color:var(--text1);font-weight:600;line-height:1.5">${s}</span></div>`).join('')}</div>
  </div>
  ${u ? `<button class="btn-ghost" style="justify-content:center;font-size:13px" onclick="reportJob(${job.id}, '${esc(job.title).replace(/'/g, '&#39;')}')"><span class="material-symbols-rounded" style="font-size:17px">flag</span>Report this listing</button>` : ''}`;
}

const JOURNEY = [['Discover', 'search'], ['Apply', 'send'], ['Assessment', 'assignment'], ['Verified score', 'verified'], ['Shortlist', 'thumb_up'], ['Interview', 'event'], ['Hired', 'handshake']];
function journeyHTML(app) {
  const idx = !app || app.status === 'withdrawn' ? 0 : { in_progress: 2, submitted: 2, scored: 3, shortlisted: 4, interview: 5, offer: 5, hired: 6, rejected: 3, expired: 2 }[app.status] ?? 1;
  return `<div class="section-card" style="padding:18px 22px"><div class="card-title" style="margin-bottom:12px;font-size:15px"><span class="card-icon tint-purple" style="width:32px;height:32px"><span class="material-symbols-rounded" style="font-size:18px">route</span></span>Your hiring journey</div>
    <ol class="journey">${JOURNEY.map(([l, ic], i) => `<li class="${i < idx ? 'done' : i === idx ? 'now' : ''}"><span>${UI.icon(i < idx ? 'check' : ic, 16)}</span>${l}</li>`).join('')}</ol>
    ${app && app.status === 'rejected' ? '<p style="font-size:12.5px;color:var(--text3);margin-top:8px">This application closed. Your verified score still counts towards your profile.</p>' : ''}</div>`;
}
function verifiedCardHTML(job, el, app) {
  const u = UR.user(), applied = app && app.status !== 'withdrawn';
  return `<div class="section-card" id="apply-verified" style="border-color:#c4ede6">
    <div class="card-title"><span class="card-icon tint-teal"><span class="material-symbols-rounded">verified</span></span>Skip the task with existing verified scores</div>
    <p class="body-text" style="font-size:14px">${esc(job.company)} accepts verified skill scores from previous Unresume assessments. If you meet every requirement you can apply now — no new task. The company may still invite you to the role assessment later.</p>
    <div class="d-table-wrap" style="box-shadow:none;margin:12px 0"><table class="d-table"><thead><tr><th>Skill</th><th>Required</th><th>Your verified score</th><th></th></tr></thead><tbody>
      ${el.rows.length ? el.rows.map(r => `<tr><td><b>${esc(r.skill)}</b></td><td>${r.minScore}/1000 · ${el.minTasks}+ tasks</td><td>${r.score != null ? `${r.score}/1000 <small style="color:var(--text3)">(${r.tasks} task${r.tasks === 1 ? '' : 's'})</small>` : '<span style="color:var(--text4)">No verified tasks</span>'}</td><td>${r.met ? UI.pill('Met', 'tint-teal', 'check') : UI.pill('Not yet', 'gray')}</td></tr>`).join('')
        : (job.acceptVerified || []).map(r => `<tr><td><b>${esc(r.skill)}</b></td><td>${r.minScore}/1000</td><td colspan="2" style="color:var(--text3)">${u ? 'Only candidates can apply' : 'Sign in to check'}</td></tr>`).join('')}</tbody></table></div>
    ${applied ? `<div class="d-note good">${UI.icon('check')}<div>You've applied${app.route === 'verified_score' ? ' with your verified scores' : ''}. Track it in <a href="my-applications.html" style="color:inherit;font-weight:800">My Applications</a>.</div></div>`
      : el.met ? `<button class="apply-btn" onclick="applyVerified(${job.id})">Apply with my verified scores ${UI.icon('arrow_forward', 20)}</button>`
      : u && u.role === 'candidate' ? `<p style="font-size:13px;color:var(--text3)">Not there yet? Take a <a href="assessments.html?tab=library" style="color:var(--brand);font-weight:700">standard assessment</a> — one verified score can be reused for many jobs — or complete this job's task below.</p>` : ''}
  </div>`;
}
async function applyVerified(jobId) {
  const r = await UI.confirm({ title: 'Apply with your verified scores?', icon: 'verified', confirmLabel: 'Apply', text: 'The company sees your verified scores, rubric breakdowns and profile. No new task is needed now.', input: { label: 'Short note to the hiring team (optional)', placeholder: 'Why this role interests you' } });
  if (r.ok) UI.run(() => UR.verifiedApply.apply(jobId, r.value || ''), 'Application sent with your verified scores').catch(() => {});
}
async function reportJob(id, title) {
  const r = await UI.confirm({ title: 'Report this listing', icon: 'flag', confirmLabel: 'Send report', text: 'Unresume moderators review every report. The company is not told who reported it.',
    input: { label: 'What is wrong?', type: 'select', options: ['Misleading requirements', 'Scam or fraud', 'Discriminatory content', 'Task asks for unpaid production work', 'Other'], required: true } });
  if (!r.ok) return;
  UI.run(() => UR.reports.create({ type: 'job', targetId: id, targetLabel: title, reason: r.value }), 'Report sent to Unresume moderators').catch(() => {});
}

render();
UI.onChange(render);
</script>
</body>
</html>
