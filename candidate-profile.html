<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<link rel="icon" type="image/png" href="images/favicon.png">
<title>Candidate Profile — Unresume</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
<link rel="stylesheet" href="css/globals.css">
<link rel="stylesheet" href="css/navbar.css">
<style>
.page-wrap{overflow-x:clip}
.prof-inner{max-width:1100px;margin:0 auto;padding:28px 24px 0}

/* cover */
.prof-cover{position:relative;height:190px;border-radius:24px;overflow:hidden;background:linear-gradient(100deg,#efedfd 0%,#e4defc 50%,#d6cefb 100%);border:1px solid #e2defb}
.prof-cover .b1{position:absolute;width:320px;height:320px;right:8%;top:-120px;border-radius:46% 54% 42% 58%/52% 38% 62% 48%;background:linear-gradient(160deg,#c7c2fa,#b9b1f7);opacity:.6}
.prof-cover .b2{position:absolute;width:220px;height:220px;left:18%;bottom:-140px;border-radius:60% 40% 55% 45%/50% 60% 40% 50%;background:linear-gradient(160deg,#d9d4fb,#c7c2fa);opacity:.7}
.prof-cover .b3{position:absolute;width:420px;height:420px;right:-120px;bottom:-260px;border-radius:50%;background:radial-gradient(circle,rgba(124,58,237,.18),transparent 65%)}
.prof-cover svg{position:absolute;right:40px;top:28px;width:56px;height:56px;stroke:var(--brand);stroke-width:2.4;fill:none;stroke-linecap:round}

/* profile card */
.prof-card{position:relative;margin:-64px 24px 0;background:#fff;border:1px solid var(--border);border-radius:22px;box-shadow:var(--shadow-md);padding:0 28px 26px;display:flex;gap:24px;align-items:flex-start;flex-wrap:wrap}
.prof-av{width:124px;height:124px;border-radius:50%;margin-top:-52px;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-size:40px;font-weight:800;color:#fff;flex-shrink:0;box-shadow:0 0 0 6px #fff,0 16px 36px rgba(79,70,229,.25)}
.prof-info{flex:1;min-width:240px;padding-top:22px}
.prof-name-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:2px}
.prof-name{font-family:var(--font-display);font-size:clamp(24px,3.4vw,34px);font-weight:800;color:var(--text1);letter-spacing:-.03em;line-height:1.15}
.prof-verified{color:var(--brand);font-size:24px;font-variation-settings:'FILL' 1}
.prof-uname{font-size:14px;color:var(--text3);font-weight:500;margin-bottom:14px}
.prof-skills{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.prof-skill{font-size:12px;font-weight:700;padding:6px 13px;border-radius:100px;background:#eeedfd;color:var(--brand)}
.prof-follow{display:flex;gap:22px;flex-wrap:wrap;font-size:13.5px;color:var(--text3)}
.prof-follow span{display:inline-flex;align-items:center;gap:6px}
.prof-follow .material-symbols-rounded{font-size:18px;color:var(--text4)}
.prof-follow strong{color:var(--text1);font-family:var(--font-display);font-weight:800}
.prof-actions{display:flex;gap:10px;margin-left:auto;flex-wrap:wrap;align-items:center;padding-top:26px}
.prof-actions .btn-ghost,.prof-actions .btn-primary{font-size:13.5px;padding:11px 20px}

/* tabs */
.tab-bar{display:inline-flex;gap:4px;background:#fff;border:1px solid var(--border);border-radius:14px;padding:5px;box-shadow:var(--shadow-sm);margin:28px 0 0 24px}
.prof-tab{display:inline-flex;align-items:center;gap:6px;padding:9px 20px;font-size:13.5px;font-weight:700;color:var(--text3);border-radius:10px;cursor:pointer;transition:all .15s;text-decoration:none}
.prof-tab .material-symbols-rounded{font-size:18px}
.prof-tab:hover{color:var(--brand)}
.prof-tab.active{background:linear-gradient(90deg,#4f46e5,#7c3aed);color:#fff;box-shadow:0 4px 14px rgba(79,70,229,.28)}

.prof-wrap{max-width:1100px;margin:0 auto;padding:28px 48px 96px}

/* stats */
.score-band{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-bottom:40px}
.score-blk{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid var(--border);border-radius:18px;padding:18px;box-shadow:var(--shadow-sm)}
.score-icon{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.score-icon .material-symbols-rounded{font-size:24px;font-variation-settings:'FILL' 1}
.score-blk .sv{font-family:var(--font-display);font-size:26px;font-weight:800;color:var(--text1);line-height:1.1;letter-spacing:-.02em}
.score-blk .sv.c-blue{color:#2563eb}
.score-blk .sv.c-teal{color:#0d9488}
.score-blk .sl{font-size:12.5px;color:var(--text3);font-weight:500;margin-top:3px}

/* portfolio */
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.sec-title{font-family:var(--font-display);font-size:24px;font-weight:800;color:var(--text1);letter-spacing:-.03em}
.owner-note{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--text3);background:#fff;border:1px solid var(--border);border-radius:100px;padding:6px 14px}
.owner-note:empty{display:none}
.port-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.port-item{background:#fff;border:1px solid var(--border);border-radius:20px;overflow:hidden;box-shadow:var(--shadow-sm);transition:box-shadow .2s,transform .2s,border-color .2s}
.port-item:hover{transform:translateY(-4px);box-shadow:var(--shadow-md);border-color:#e2defb}
.port-preview{position:relative;height:170px;overflow:hidden;display:flex;align-items:center;justify-content:center}
.port-preview img{width:100%;height:100%;object-fit:cover;transition:transform .5s}
.port-item:hover .port-preview img{transform:scale(1.05)}
.port-preview-icon{width:72px;height:72px;border-radius:20px;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 12px 30px rgba(79,70,229,.18)}
.port-preview-icon .material-symbols-rounded{font-size:36px;font-variation-settings:'FILL' 1}
.port-type{position:absolute;top:12px;left:12px;display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:5px 11px;border-radius:100px;background:rgba(255,255,255,.95);color:var(--text1);box-shadow:var(--shadow-sm)}
.port-type .material-symbols-rounded{font-size:14px;color:var(--brand)}
.port-body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:14px}
.port-title{font-size:15.5px;font-weight:700;color:var(--text1);font-family:var(--font-display);line-height:1.3;letter-spacing:-.01em}
.port-meta{display:flex;align-items:center;justify-content:space-between;padding-top:14px;border-top:1px solid var(--border)}
.port-score{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:800;color:var(--text1)}
.port-score .material-symbols-rounded{font-size:16px;color:#f59e0b;font-variation-settings:'FILL' 1}
.port-toggle-row{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text4);font-weight:600}
.priv-badge{font-size:11px;font-weight:700;padding:4px 10px;border-radius:100px;background:#fdecef;color:#e11d48}
.pub-badge{font-size:11px;font-weight:700;padding:4px 10px;border-radius:100px;background:#e6f8f5;color:#0d9488}
.empty-box{grid-column:1/-1;text-align:center;padding:64px 24px;color:var(--text3);display:flex;flex-direction:column;align-items:center;gap:14px;font-size:14px;background:#fff;border:1px dashed var(--border-light);border-radius:20px}
.empty-icon{width:64px;height:64px;border-radius:50%;background:#eeedfd;color:var(--brand);display:flex;align-items:center;justify-content:center}

@media(max-width:960px){
  .score-band{grid-template-columns:repeat(2,1fr)}
  .port-grid{grid-template-columns:repeat(2,1fr)}
  .prof-wrap{padding-left:24px;padding-right:24px}
  .tab-bar{margin-left:0}
  .prof-card{margin-left:0;margin-right:0}
}
@media(max-width:640px){
  .prof-cover{height:150px}
  .prof-card{flex-direction:column;align-items:center;text-align:center;padding:0 20px 24px}
  .prof-info{padding-top:4px;min-width:0;width:100%}
  .prof-name-row,.prof-skills,.prof-follow{justify-content:center}
  .prof-actions{margin-left:0;padding-top:0;justify-content:center;width:100%}
  .prof-actions a,.prof-actions button{flex:1;justify-content:center}
  .port-grid{grid-template-columns:1fr}
  .score-band{gap:12px}
  .score-blk{flex-direction:column;align-items:flex-start;gap:10px;padding:16px}
}
</style>
</head>
<body>
<div id="navbar"></div>

<div class="page-wrap">
  <div class="prof-inner">
    <div class="prof-cover">
      <div class="b1"></div><div class="b2"></div><div class="b3"></div>
      <svg viewBox="0 0 44 44" aria-hidden="true"><path d="M8 30 L26 6"/><path d="M20 36 L38 14"/><path d="M30 40 L40 32"/></svg>
    </div>

    <div class="prof-card">
      <div class="prof-av" id="profAv"></div>
      <div class="prof-info">
        <div class="prof-name-row">
          <div class="prof-name" id="profName"></div>
          <span class="material-symbols-rounded prof-verified" title="Verified">verified</span>
        </div>
        <div class="prof-uname" id="profUname"></div>
        <div class="prof-skills" id="profSkills"></div>
        <div class="prof-follow">
          <span><span class="material-symbols-rounded">group</span><strong id="profFollowers"></strong> followers</span>
          <span><span class="material-symbols-rounded">person_add</span><strong id="profFollowing"></strong> following</span>
          <span><span class="material-symbols-rounded">task_alt</span><strong id="profTasks"></strong> tasks done</span>
        </div>
      </div>
      <div class="prof-actions" id="profActions"></div>
    </div>

    <div class="tab-bar">
      <a class="prof-tab active" onclick="showTab('portfolio',this)"><span class="material-symbols-rounded">photo_library</span>Portfolio</a>
      <a class="prof-tab" onclick="showTab('activity',this)"><span class="material-symbols-rounded">history</span>Activity</a>
    </div>
  </div>

  <div class="prof-wrap">
    <div class="score-band">
      <div class="score-blk"><div class="score-icon tint-purple"><span class="material-symbols-rounded">star</span></div><div><div class="sv grad-text" id="profScore"></div><div class="sl">Skill Score</div></div></div>
      <div class="score-blk"><div class="score-icon tint-blue"><span class="material-symbols-rounded">leaderboard</span></div><div><div class="sv c-blue" id="profRank"></div><div class="sl">Global Rank</div></div></div>
      <div class="score-blk"><div class="score-icon tint-pink"><span class="material-symbols-rounded">workspace_premium</span></div><div><div class="sv" id="profBadge"></div><div class="sl">Badge</div></div></div>
      <div class="score-blk"><div class="score-icon tint-teal"><span class="material-symbols-rounded">visibility</span></div><div><div class="sv c-teal" id="profPublic"></div><div class="sl">Public Items</div></div></div>
    </div>

    <div id="portfolioTab">
      <div class="sec-head">
        <h2 class="sec-title">Portfolio</h2>
        <span class="owner-note" id="ownerNote"></span>
      </div>
      <div class="port-grid" id="portGrid"></div>
    </div>

    <div id="activityTab" style="display:none">
      <div style="display:flex;flex-direction:column;gap:10px" id="actList">
        <div class="empty-box"><div class="empty-icon"><span class="material-symbols-rounded" style="font-size:30px">history</span></div>No public activity yet.</div>
      </div>
    </div>
  </div>
</div>

<div id="footer"></div>
<script src="js/components.js"></script>
<script src="js/data.js"></script>
<script>
const gradients = [
  'linear-gradient(135deg,#38bdf8,#2563eb)',
  'linear-gradient(135deg,#8b5cf6,#6d28d9)',
  'linear-gradient(135deg,#e879f9,#a855f7)',
  'linear-gradient(135deg,#2dd4bf,#0d9488)',
  'linear-gradient(135deg,#fbbf24,#f97316)',
  'linear-gradient(135deg,#818cf8,#4f46e5)',
];
const previewCfg = {
  image:    { icon:'image',       label:'Image' },
  website:  { icon:'language',    label:'Website',  bg:'linear-gradient(160deg,#eaf1ff,#d6e4ff)', color:'#2563eb' },
  document: { icon:'description', label:'Document', bg:'linear-gradient(160deg,#f1ecfe,#e1d6fd)', color:'#7c3aed' },
};

const params = new URLSearchParams(location.search);
const username = params.get('u');
const isOwner = !username || username === 'jay-dev'; // simulate owner if no user param or is "self"

const candidates = getCandidates();
const c = username ? candidates.find(x => x.username === username) : candidates[0];
const ci = candidates.indexOf(c);

if (!c) {
  document.body.innerHTML = '<div style="text-align:center;padding:120px 24px;color:var(--text3)">Candidate not found.</div>';
} else {
  const initials = c.name.split(' ').map(w=>w[0]).join('').slice(0,2);
  document.getElementById('profAv').style.background = gradients[ci%gradients.length];
  document.getElementById('profAv').textContent = initials;
  document.getElementById('profName').textContent = c.name;
  document.getElementById('profUname').textContent = '@' + c.username;
  document.getElementById('profFollowers').textContent = c.followers;
  document.getElementById('profFollowing').textContent = c.following;
  document.getElementById('profTasks').textContent = c.tasksCompleted;
  document.getElementById('profScore').textContent = c.score;
  document.getElementById('profRank').textContent = '#' + c.rank;
  const BADGE_CFG = {
    Diamond: { color:'#2563eb', bg:'#eaf1ff', icon:'diamond' },
    Gold:    { color:'#b7791f', bg:'#fef6e4', icon:'workspace_premium' },
    Silver:  { color:'#64748b', bg:'#f1f5f9', icon:'military_tech' },
  };
  const bc = BADGE_CFG[c.badge] || { color:'var(--text2)', bg:'var(--bg-elevated)', icon:'verified' };
  document.getElementById('profBadge').innerHTML = `<span style="display:inline-flex;align-items:center;gap:4px;padding:5px 12px;background:${bc.bg};border-radius:100px;font-size:13px;font-weight:800;color:${bc.color};letter-spacing:0"><span class="material-symbols-rounded" style="font-size:16px;font-variation-settings:'FILL' 1">${bc.icon}</span>${c.badge}</span>`;
  document.getElementById('profPublic').textContent = c.portfolio.filter(p=>p.isPublic).length;

  document.getElementById('profSkills').innerHTML = c.skills.map(s =>
    `<span class="prof-skill">${s}</span>`
  ).join('');

  document.getElementById('profActions').innerHTML = isOwner
    ? `<a href="candidate-dashboard.html" class="btn-ghost">My Dashboard</a>
       <a href="edit-profile.html" class="btn-primary"><span class="material-symbols-rounded" style="font-size:18px">edit</span>Edit Profile</a>`
    : `<button class="btn-ghost" onclick="this.textContent=this.textContent==='Following'?'Follow':'Following'">Follow</button>
       <a href="chat.html" class="btn-primary"><span class="material-symbols-rounded" style="font-size:18px">chat</span>Message</a>`;

  if (isOwner) {
    document.getElementById('ownerNote').innerHTML = '<span class="material-symbols-rounded" style="font-size:16px;color:var(--brand)">info</span>Toggle visibility per item. Only public items show to others.';
  }

  let portfolio = isOwner ? c.portfolio : c.portfolio.filter(p => p.isPublic);

  function previewHTML(p) {
    const cfg = previewCfg[p.previewType] || previewCfg.document;
    const inner = p.previewType === 'image'
      ? `<img src="${getPortfolioPreview(p.id)}" alt="${p.title}" loading="lazy">`
      : `<div class="port-preview-icon"><span class="material-symbols-rounded" style="color:${cfg.color}">${cfg.icon}</span></div>`;
    return `<div class="port-preview" style="background:${cfg.bg || 'linear-gradient(160deg,#eeedfd,#dcd7fb)'}">
      ${inner}
      <span class="port-type"><span class="material-symbols-rounded">${cfg.icon}</span>${cfg.label}</span>
    </div>`;
  }

  function renderPort() {
    document.getElementById('portGrid').innerHTML = portfolio.map(p => `<div class="port-item">
        ${previewHTML(p)}
        <div class="port-body">
          <div class="port-title">${p.title}</div>
          <div class="port-meta">
            ${p.score ? `<span class="port-score"><span class="material-symbols-rounded">star</span>${p.score}/100</span>` : '<span></span>'}
            <div class="port-toggle-row">
              ${isOwner ? `
                <div class="toggle-track ${p.isPublic?'on':''}" id="tog-${p.id}" onclick="toggleItem('${p.id}',this)" title="${p.isPublic?'Public — click to hide':'Private — click to show'}"></div>
                <span id="tog-lbl-${p.id}">${p.isPublic?'<span class="pub-badge">Public</span>':'<span class="priv-badge">Private</span>'}</span>
              ` : '<span class="pub-badge">Public</span>'}
            </div>
          </div>
        </div>
      </div>`).join('') || `<div class="empty-box">
      <div class="empty-icon"><span class="material-symbols-rounded" style="font-size:30px">lock</span></div>
      No public portfolio items yet.
    </div>`;
  }

  function toggleItem(id, el) {
    const item = portfolio.find(p => p.id == id);
    if (!item) return;
    item.isPublic = !item.isPublic;
    el.classList.toggle('on', item.isPublic);
    const lbl = document.getElementById('tog-lbl-' + id);
    lbl.innerHTML = item.isPublic ? '<span class="pub-badge">Public</span>' : '<span class="priv-badge">Private</span>';
    document.getElementById('profPublic').textContent = portfolio.filter(p=>p.isPublic).length;
  }

  window.toggleItem = toggleItem;
  renderPort();
}

function showTab(tab, el) {
  document.querySelectorAll('.prof-tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('portfolioTab').style.display = tab === 'portfolio' ? '' : 'none';
  document.getElementById('activityTab').style.display = tab === 'activity' ? '' : 'none';
}
</script>
</body>
</html>
