<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<link rel="icon" type="image/png" href="images/favicon.png">
<title>Candidate Profile — Unresume</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
<link rel="stylesheet" href="css/globals.css">
<link rel="stylesheet" href="css/navbar.css">
<link rel="stylesheet" href="css/dashboard.css">
<style>
.page-wrap{overflow-x:clip}
.prof-inner{max-width:1100px;margin:0 auto;padding:28px 24px 0}

/* cover */
.prof-cover{position:relative;height:190px;border-radius:24px;overflow:hidden;background:linear-gradient(100deg,#efedfd 0%,#e4defc 50%,#d6cefb 100%);border:1px solid #e2defb}
.prof-cover .b1{position:absolute;width:320px;height:320px;right:8%;top:-120px;border-radius:46% 54% 42% 58%/52% 38% 62% 48%;background:linear-gradient(160deg,#c7c2fa,#b9b1f7);opacity:.6}
.prof-cover .b2{position:absolute;width:220px;height:220px;left:18%;bottom:-140px;border-radius:60% 40% 55% 45%/50% 60% 40% 50%;background:linear-gradient(160deg,#d9d4fb,#c7c2fa);opacity:.7}
.prof-cover .b3{position:absolute;width:420px;height:420px;right:-120px;bottom:-260px;border-radius:50%;background:radial-gradient(circle,rgba(124,58,237,.18),transparent 65%)}
.prof-cover svg{position:absolute;right:40px;top:28px;width:56px;height:56px;stroke:var(--brand);stroke-width:2.4;fill:none;stroke-linecap:round}

/* profile card */
.prof-card{position:relative;margin:-64px 24px 0;background:#fff;border:1px solid var(--border);border-radius:22px;box-shadow:var(--shadow-md);padding:0 28px 26px;display:flex;gap:24px;align-items:flex-start;flex-wrap:wrap}
.prof-av{width:124px;height:124px;border-radius:50%;margin-top:-52px;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-size:40px;font-weight:800;color:#fff;flex-shrink:0;box-shadow:0 0 0 6px #fff,0 16px 36px rgba(79,70,229,.25)}
.prof-info{flex:1;min-width:240px;padding-top:22px}
.prof-name-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:2px}
.prof-name{font-family:var(--font-display);font-size:clamp(24px,3.4vw,34px);font-weight:800;color:var(--text1);letter-spacing:-.03em;line-height:1.15}
.prof-verified{color:var(--brand);font-size:24px;font-variation-settings:'FILL' 1}
.prof-uname{font-size:14px;color:var(--text3);font-weight:500;margin-bottom:14px}
.prof-skills{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.prof-skill{font-size:12px;font-weight:700;padding:6px 13px;border-radius:100px;background:#eeedfd;color:var(--brand)}
.prof-follow{display:flex;gap:22px;flex-wrap:wrap;font-size:13.5px;color:var(--text3)}
.prof-follow span{display:inline-flex;align-items:center;gap:6px}
.prof-follow .material-symbols-rounded{font-size:18px;color:var(--text4)}
.prof-follow strong{color:var(--text1);font-family:var(--font-display);font-weight:800}
.prof-actions{display:flex;gap:10px;margin-left:auto;flex-wrap:wrap;align-items:center;padding-top:26px}
.prof-actions .btn-ghost,.prof-actions .btn-primary{font-size:13.5px;padding:11px 20px}

/* tabs */
.tab-bar{display:inline-flex;gap:4px;background:#fff;border:1px solid var(--border);border-radius:14px;padding:5px;box-shadow:var(--shadow-sm);margin:28px 0 0 24px}
.prof-tab{display:inline-flex;align-items:center;gap:6px;padding:9px 20px;font-size:13.5px;font-weight:700;color:var(--text3);border-radius:10px;cursor:pointer;transition:all .15s;text-decoration:none}
.prof-tab .material-symbols-rounded{font-size:18px}
.prof-tab:hover{color:var(--brand)}
.prof-tab.active{background:linear-gradient(90deg,#4f46e5,#7c3aed);color:#2563eb;box-shadow:0 4px 14px rgba(79,70,229,.28)}

.prof-wrap{max-width:1100px;margin:0 auto;padding:28px 48px 96px}

/* stats */
.score-band{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-bottom:40px}
.score-blk{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid var(--border);border-radius:18px;padding:18px;box-shadow:var(--shadow-sm)}
.score-icon{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.score-icon .material-symbols-rounded{font-size:24px;font-variation-settings:'FILL' 1}
.score-blk .sv{font-family:var(--font-display);font-size:26px;font-weight:800;color:var(--text1);line-height:1.1;letter-spacing:-.02em}
.score-blk .sv.c-blue{color:#2563eb}
.score-blk .sv.c-teal{color:#0d9488}
.score-blk .sl{font-size:12.5px;color:var(--text3);font-weight:500;margin-top:3px}

/* portfolio */
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.sec-title{font-family:var(--font-display);font-size:24px;font-weight:800;color:var(--text1);letter-spacing:-.03em}
.owner-note{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--text3);background:#fff;border:1px solid var(--border);border-radius:100px;padding:6px 14px}
.owner-note:empty{display:none}
.port-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.port-item{background:#fff;border:1px solid var(--border);border-radius:20px;overflow:hidden;box-shadow:var(--shadow-sm);transition:box-shadow .2s,transform .2s,border-color .2s}
.port-item:hover{transform:translateY(-4px);box-shadow:var(--shadow-md);border-color:#e2defb}
.port-preview{position:relative;height:170px;overflow:hidden;display:flex;align-items:center;justify-content:center}
.port-preview img{width:100%;height:100%;object-fit:cover;transition:transform .5s}
.port-item:hover .port-preview img{transform:scale(1.05)}
.port-preview-icon{width:72px;height:72px;border-radius:20px;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 12px 30px rgba(79,70,229,.18)}
.port-preview-icon .material-symbols-rounded{font-size:36px;font-variation-settings:'FILL' 1}
.port-type{position:absolute;top:12px;left:12px;display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:5px 11px;border-radius:100px;background:rgba(255,255,255,.95);color:var(--text1);box-shadow:var(--shadow-sm)}
.port-type .material-symbols-rounded{font-size:14px;color:var(--brand)}
.port-body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:14px}
.port-title{font-size:15.5px;font-weight:700;color:var(--text1);font-family:var(--font-display);line-height:1.3;letter-spacing:-.01em}
.port-meta{display:flex;align-items:center;justify-content:space-between;padding-top:14px;border-top:1px solid var(--border)}
.port-score{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:800;color:var(--text1)}
.port-score .material-symbols-rounded{font-size:16px;color:#f59e0b;font-variation-settings:'FILL' 1}
.port-toggle-row{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text4);font-weight:600}
.priv-badge{font-size:11px;font-weight:700;padding:4px 10px;border-radius:100px;background:#fdecef;color:#e11d48}
.pub-badge{font-size:11px;font-weight:700;padding:4px 10px;border-radius:100px;background:#e6f8f5;color:#0d9488}
.empty-box{grid-column:1/-1;text-align:center;padding:64px 24px;color:var(--text3);display:flex;flex-direction:column;align-items:center;gap:14px;font-size:14px;background:#fff;border:1px dashed var(--border-light);border-radius:20px}
.empty-icon{width:64px;height:64px;border-radius:50%;background:#eeedfd;color:var(--brand);display:flex;align-items:center;justify-content:center}

@media(max-width:960px){
  .score-band{grid-template-columns:repeat(2,1fr)}
  .port-grid{grid-template-columns:repeat(2,1fr)}
  .prof-wrap{padding-left:24px;padding-right:24px}
  .tab-bar{margin-left:0}
  .prof-card{margin-left:0;margin-right:0}
}
@media(max-width:640px){
  .prof-cover{height:150px}
  .prof-card{flex-direction:column;align-items:center;text-align:center;padding:0 20px 24px}
  .prof-info{padding-top:4px;min-width:0;width:100%}
  .prof-name-row,.prof-skills,.prof-follow{justify-content:center}
  .prof-actions{margin-left:0;padding-top:0;justify-content:center;width:100%}
  .prof-actions a,.prof-actions button{flex:1;justify-content:center}
  .port-grid{grid-template-columns:1fr}
  .score-band{gap:12px}
  .score-blk{flex-direction:column;align-items:flex-start;gap:10px;padding:16px}
}
</style>
</head>
<body>
<div id="navbar"></div>

<div class="page-wrap">
  <div class="prof-inner">
    <div class="prof-cover">
      <div class="b1"></div><div class="b2"></div><div class="b3"></div>
      <svg viewBox="0 0 44 44" aria-hidden="true"><path d="M8 30 L26 6"/><path d="M20 36 L38 14"/><path d="M30 40 L40 32"/></svg>
    </div>

    <div class="prof-card">
      <div class="prof-av" id="profAv"></div>
      <div class="prof-info">
        <div class="prof-name-row">
          <div class="prof-name" id="profName"></div>
          <span class="material-symbols-rounded prof-verified" id="profVerified" title="Identity verified by Unresume" hidden>verified</span>
        </div>
        <div class="prof-uname" id="profUname"></div>
        <div class="prof-skills" id="profSkills"></div>
        <div class="prof-follow">
          <span><span class="material-symbols-rounded">group</span><strong id="profFollowers"></strong> followers</span>
          <span><span class="material-symbols-rounded">person_add</span><strong id="profFollowing"></strong> following</span>
          <span><span class="material-symbols-rounded">task_alt</span><strong id="profTasks"></strong> tasks done</span>
        </div>
      </div>
      <div class="prof-actions" id="profActions"></div>
    </div>

    <div class="tab-bar" role="tablist">
      <button type="button" class="prof-tab active" style="border:none;background:none;font-family:var(--font-body)" onclick="showTab('portfolio',this)"><span class="material-symbols-rounded">photo_library</span>Portfolio</button>
      <button type="button" class="prof-tab" style="border:none;background:none;font-family:var(--font-body)" onclick="showTab('skills',this)"><span class="material-symbols-rounded">verified</span>Verified Skills</button>
      <button type="button" class="prof-tab" style="border:none;background:none;font-family:var(--font-body)" onclick="showTab('activity',this)"><span class="material-symbols-rounded">history</span>Activity</button>
    </div>
  </div>

  <div class="prof-wrap">
    <div class="score-band">
      <div class="score-blk"><div class="score-icon tint-purple"><span class="material-symbols-rounded">star</span></div><div><div class="sv grad-text" id="profScore"></div><div class="sl">Skill Score</div></div></div>
      <div class="score-blk"><div class="score-icon tint-blue"><span class="material-symbols-rounded">leaderboard</span></div><div><div class="sv c-blue" id="profRank"></div><div class="sl">Global Rank</div></div></div>
      <div class="score-blk"><div class="score-icon tint-pink"><span class="material-symbols-rounded">workspace_premium</span></div><div><div class="sv" id="profBadge"></div><div class="sl">Badge</div></div></div>
      <div class="score-blk"><div class="score-icon tint-teal"><span class="material-symbols-rounded">visibility</span></div><div><div class="sv c-teal" id="profPublic"></div><div class="sl">Public Items</div></div></div>
    </div>

    <div id="portfolioTab">
      <div class="sec-head">
        <h2 class="sec-title">Portfolio</h2>
        <span class="owner-note" id="ownerNote"></span>
      </div>
      <div class="port-grid" id="portGrid"></div>
    </div>

    <div id="skillsTab" style="display:none"></div>
    <div id="activityTab" style="display:none">
      <div style="display:flex;flex-direction:column;gap:10px" id="actList"></div>
    </div>
  </div>
</div>

<div id="footer"></div>
<script src="js/data.js"></script>
<script src="js/store.js"></script>
<script src="js/ui.js"></script>
<script src="js/components.js"></script>
<script>
const $ = id => document.getElementById(id), esc = UI.esc;
const previewCfg = {
  image:    { icon:'image',       label:'Image' },
  website:  { icon:'language',    label:'Website',  bg:'linear-gradient(160deg,#eaf1ff,#d6e4ff)', color:'#2563eb' },
  document: { icon:'description', label:'Document', bg:'linear-gradient(160deg,#f1ecfe,#e1d6fd)', color:'#7c3aed' },
};
let curTab = 'portfolio';

function render() {
  const me = UR.user();
  const username = UI.param('u') || (me && me.role === 'candidate' ? me.username : null);
  if (!username) { location.replace('login.html?next=candidate-profile.html'); return; }
  const c = UR.candidates.get(username);
  const isOwner = !!me && me.username === username;

  if (!c || c.restricted) {
    document.querySelector('.prof-inner').innerHTML = `<div style="padding:80px 0">${UI.empty(c ? 'lock' : 'person_off', c ? 'This profile is private' : 'Candidate not found', c ? (c.name === 'Private profile' ? 'This candidate has chosen to keep their profile private.' : 'Sign in as a company or academy to view this profile.') : 'The link may be wrong or the account was removed.', c && !me ? '<a class="btn-primary" href="login.html?next=' + encodeURIComponent(location.pathname.split('/').pop() + location.search) + '">Sign in</a>' : '<a class="btn-ghost" href="leaderboard.html">Back to leaderboard</a>')}</div>`;
    document.querySelector('.prof-wrap').style.display = 'none';
    return;
  }
  const st = c.stats, hidden = st.hidden;
  document.title = `${c.name} — Unresume`;
  $('profAv').style.background = UI.grad(c.username); $('profAv').textContent = UI.initials(c.name);
  $('profName').textContent = c.name;
  $('profVerified').hidden = c.verification.identity !== 'verified';
  $('profUname').textContent = '@' + c.username + (c.location ? ' · ' + c.location : '') + (c.bio ? ' — ' + c.bio : '');
  $('profFollowers').textContent = c.followers; $('profFollowing').textContent = c.following;
  $('profTasks').textContent = hidden ? '—' : st.tasksVerified;
  document.querySelector('.prof-follow span:last-child').lastChild.textContent = ' verified tasks';
  $('profScore').textContent = hidden ? 'Hidden' : (st.skillScore || '—');
  document.querySelector('#profScore + .sl').textContent = hidden || !st.primaryTrackLabel ? 'Skill Score' : `${st.primaryTrackLabel} score (primary track)`;
  document.querySelector('#profRank + .sl').textContent = st.primaryTrackLabel ? `Rank in ${st.primaryTrackLabel}` : 'Track rank';
  $('profRank').textContent = hidden ? '—' : c.rank ? '#' + c.rank : 'Unranked';
  $('profBadge').innerHTML = hidden ? '—' : UI.tierPill(st.tier);
  $('profPublic').textContent = c.portfolio.filter(p => (p.visibility || (p.isPublic ? 'public' : 'private')) !== 'private').length;
  $('profSkills').innerHTML = c.skills.map(s => { const v = !hidden && st.skills.find(x => x.skill === s && x.badge); return `<span class="prof-skill" ${v ? 'title="Verified by task scores" style="background:#e6f8f5;color:#0d9488"' : ''}>${v ? '✓ ' : ''}${esc(s)}</span>`; }).join('');

  const following = me && !isOwner ? UR.candidates.isFollowing(username) : false;
  $('profActions').innerHTML = isOwner
    ? `<a href="candidate-dashboard.html" class="btn-ghost">My Dashboard</a><a href="edit-profile.html" class="btn-primary"><span class="material-symbols-rounded" style="font-size:18px">edit</span>Edit Profile</a>`
    : me ? `<button class="btn-ghost" onclick="follow('${username}')">${following ? 'Following ✓' : 'Follow'}</button>
       <button class="btn-primary" onclick="message('${c.userId}')"><span class="material-symbols-rounded" style="font-size:18px">chat</span>Message</button>
       <button class="btn-ghost" title="Report profile" aria-label="Report profile" onclick="report('${username}')" style="padding:11px 13px"><span class="material-symbols-rounded" style="font-size:18px">flag</span></button>`
    : `<a href="login.html?next=${encodeURIComponent('candidate-profile.html?u=' + username)}" class="btn-primary">Sign in to connect</a>`;

  $('ownerNote').innerHTML = isOwner ? `<span class="material-symbols-rounded" style="font-size:16px;color:var(--brand)">info</span>Only public items show to others. <button class="see-all" style="margin-left:6px" onclick="addExternal()">+ Add external work</button>` : '';

  const portfolio = c.portfolio; // already filtered by the store for this viewer (public / recruiters / owner)
  const subScore = id => { const r = st.results ? st.results.find(x => x.submissionId === id || x.historyId === id) : null; return r ? r.score : null; };
  $('portGrid').innerHTML = portfolio.map(p => {
    const cfg = previewCfg[p.previewType] || previewCfg.document;
    const score = p.type === 'task' && !hidden ? subScore(p.submissionId || p.historyId) : null;
    const likes = UR.feed.portfolioLikes(p.id);
    const imgId = p.legacyId;
    const inner = p.previewType === 'image' && imgId ? `<img src="${getPortfolioPreview(imgId)}" alt="${esc(p.title)}" loading="lazy">` : `<div class="port-preview-icon"><span class="material-symbols-rounded" style="color:${cfg.color || 'var(--brand)'}">${cfg.icon}</span></div>`;
    return `<div class="port-item">
      <div class="port-preview" style="background:${cfg.bg || 'linear-gradient(160deg,#eeedfd,#dcd7fb)'}">${inner}<span class="port-type"><span class="material-symbols-rounded">${p.type === 'task' ? 'task_alt' : cfg.icon}</span>${p.type === 'task' ? 'Task output' : 'External · ' + cfg.label}</span></div>
      <div class="port-body">
        <div class="port-title">${p.url ? `<a href="${esc(p.url)}" target="_blank" rel="noopener" style="color:inherit">${esc(p.title)} ↗</a>` : esc(p.title)}</div>
        <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center">
          ${p.type === 'task' ? (score != null ? UI.verifiedScore(score, true) : hidden ? '' : UI.pill('Awaiting review', 'tint-amber')) : '<span class="d-pill gray" title="External work is not scored by a reviewer">Not verified</span>'}
          <button class="c-rating" style="border:none;cursor:${me ? 'pointer' : 'default'}" title="Community likes — not a verified score" ${me ? `onclick="like('${p.id}')"` : 'disabled'}><span class="material-symbols-rounded" style="font-variation-settings:'FILL' ${likes.liked ? 1 : 0}">favorite</span>${likes.count}</button>
        </div>
        <div class="port-meta">
          <span style="font-size:12px;color:var(--text3)">${UI.fmtDate(p.createdAt)}</span>
          <div class="port-toggle-row">${isOwner ? `
            <select class="tc-select" aria-label="Visibility of ${esc(p.title)}" onchange="setVis('${p.id}', this.value)" style="width:auto;padding:6px 8px;font-size:12px;font-weight:700">
              ${[['public', 'Public'], ['recruiters', 'Recruiters only'], ['private', 'Only me']].map(([v, l]) => `<option value="${v}" ${(p.visibility || (p.isPublic ? 'public' : 'private')) === v ? 'selected' : ''}>${l}</option>`).join('')}</select>
            ${p.type === 'external' ? `<button class="req-del" title="Delete" aria-label="Delete item" style="border:none;background:none;cursor:pointer;color:var(--text4);display:flex" onclick="removeItem('${p.id}')"><span class="material-symbols-rounded" style="font-size:18px">delete</span></button>` : ''}`
            : (p.visibility === 'recruiters' ? '<span class="priv-badge" style="background:#eaf1ff;color:#2563eb">Recruiters only</span>' : '<span class="pub-badge">Public</span>')}</div>
        </div>
      </div></div>`;
  }).join('') || `<div class="empty-box"><div class="empty-icon"><span class="material-symbols-rounded" style="font-size:30px">photo_library</span></div>${isOwner ? 'Your portfolio is empty. Complete a task or add external work.' : 'No public portfolio items yet.'}</div>`;

  $('skillsTab').innerHTML = hidden ? `<div class="empty-box">This candidate keeps their scores private.</div>` : `
    <details class="how" style="margin-bottom:16px"><summary><span class="material-symbols-rounded" style="color:var(--brand)">help</span>Verified score vs portfolio likes</summary>
      <ul><li><b>Verified score</b> (green shield) — awarded by a reviewer against the task's published 100-point rubric. Only these count towards track scores and ranks (difficulty-weighted, best attempt per task). <a href="leaderboard.html#how" style="color:var(--brand);font-weight:700">Methodology</a></li><li><b>Likes</b> (heart) — community appreciation on portfolio items. They never affect scores or rank.</li><li><b>External work</b> — linked by the candidate, not reviewed, labelled "Not verified".</li></ul></details>
    <div class="d-sec-title">Track scores — each track is scored and ranked separately</div>
    <div class="kv" style="margin-bottom:18px">${st.tracks.map(tr => `<div><span>${esc(tr.label)}</span><b>${tr.score}</b><span>${tr.count} verified task${tr.count === 1 ? '' : 's'}${tr.ranked ? '' : ' · not ranked yet'}</span></div>`).join('') || '<div><span>No verified tasks yet</span><b>—</b></div>'}</div>
    <div class="d-sec-title">By skill</div>
    <div class="d-table-wrap"><table class="d-table stack"><thead><tr><th>Skill</th><th>Verified tasks</th><th>Avg score</th><th>Badge</th></tr></thead><tbody>
      ${st.skills.map(k => `<tr><td class="who-cell"><b>${esc(k.skill)}</b></td><td data-label="Tasks">${k.count}</td><td data-label="Avg">${UI.verifiedScore(Math.round(k.avg), true)}</td><td data-label="Badge">${k.badge ? UI.pill(k.badge, 'tint-teal', 'verified') : '<span style="color:var(--text4);font-size:12px">—</span>'}</td></tr>`).join('') || '<tr><td colspan="4">No verified skills yet.</td></tr>'}</tbody></table></div>`;

  const acts = UR.feed.list().filter(f => f.actor === username);
  $('actList').innerHTML = acts.length ? acts.map(f => `<div class="l-row"><span class="sec-icon tint-purple">${UI.icon({ score: 'grade', submission: 'task_alt', follow: 'person_add', hired: 'handshake' }[f.type] || 'bolt', 18, true)}</span><div class="l-main"><div class="l-title" style="font-weight:600">${esc(c.name)} ${esc(f.text)}</div><div class="l-sub">${UI.timeAgo(f.createdAt)}</div></div></div>`).join('')
    : `<div class="empty-box"><div class="empty-icon"><span class="material-symbols-rounded" style="font-size:30px">history</span></div>No public activity yet.</div>`;
  showTab(curTab);
}
const setVis = (id, v) => UI.run(() => UR.candidates.portfolio.setVisibility(id, v), { public: 'Item is now public', recruiters: 'Only signed-in recruiters can see this item', private: 'Item is now private' }[v]).catch(() => render());
const like = id => UI.run(() => UR.feed.likePortfolio(id)).catch(() => {});
const follow = u => UI.run(() => UR.candidates.follow(u), r => r ? 'Following' : 'Unfollowed').catch(() => {});
function message(userId) { UI.run(() => UR.messages.start(userId)).then(id => location.href = `chat.html?c=${id}`).catch(() => {}); }
async function removeItem(id) { const r = await UI.confirm({ title: 'Delete this item?', danger: true, confirmLabel: 'Delete' }); if (r.ok) UI.run(() => UR.candidates.portfolio.remove(id), 'Item deleted').catch(() => {}); }
function addExternal() {
  UI.modal({ title: 'Add external work', icon: 'add_link', sub: 'External items appear as "Not verified" — only task outputs carry verified scores.', submitLabel: 'Add to portfolio',
    body: UI.field({ name: 'title', label: 'Title', required: true }) + UI.field({ name: 'url', label: 'URL', type: 'url', required: true, placeholder: 'https://' }) + UI.field({ name: 'previewType', label: 'Type', type: 'select', options: [['website', 'Website'], ['document', 'Document'], ['image', 'Image']] }),
    onSubmit: d => { UR.candidates.portfolio.addExternal(d); UI.toast('Added to your portfolio'); } });
}
async function report(u) {
  const r = await UI.confirm({ title: 'Report this profile', icon: 'flag', confirmLabel: 'Send report', input: { label: 'Reason', type: 'select', required: true, options: ['Fake or impersonated profile', 'Plagiarised portfolio work', 'Harassment', 'Spam', 'Other'] } });
  if (r.ok) UI.run(() => UR.reports.create({ type: 'user', targetId: u, targetLabel: '@' + u, reason: r.value }), 'Report sent to Unresume moderators').catch(() => {});
}
function showTab(tab, el) {
  curTab = tab;
  document.querySelectorAll('.prof-tab').forEach(t => t.classList.toggle('active', t.textContent.toLowerCase().includes(tab === 'skills' ? 'verified' : tab)));
  $('portfolioTab').style.display = tab === 'portfolio' ? '' : 'none';
  $('skillsTab').style.display = tab === 'skills' ? '' : 'none';
  $('activityTab').style.display = tab === 'activity' ? '' : 'none';
}
render();
UI.onChange(render);
</script>
</body>
</html>
