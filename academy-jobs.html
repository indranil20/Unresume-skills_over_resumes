<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<link rel="icon" type="image/png" href="images/favicon.png">
<title>Jobs — Unresume</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
<link rel="stylesheet" href="css/globals.css">
<link rel="stylesheet" href="css/navbar.css">
<style>
.aj-layout{display:grid;grid-template-columns:380px 1fr;gap:20px;align-items:start}
@media(max-width:900px){.aj-layout{grid-template-columns:1fr}}
.pills{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.aj-list{display:flex;flex-direction:column;gap:10px;max-height:calc(100vh - 0px);overflow-y:auto}
.aj-list{padding:4px;scrollbar-width:none}
.aj-list::-webkit-scrollbar{display:none}
.aj-card{background:var(--bg-card);border:1px solid var(--border);border-radius:14px;padding:16px 18px;cursor:pointer;transition:border-color .15s}
.aj-card:hover{border-color:rgba(91,108,245,.3)}
.aj-card.active{border-color:rgba(128,64,216,.5);background:rgba(128,64,216,.05)}
.aj-card-top{display:flex;align-items:flex-start;gap:10px;margin-bottom:8px}
.aj-logo{width:44px;height:44px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.aj-company{font-size:12px;color:var(--text3);font-weight:600}
.aj-title{font-size:14.5px;font-weight:700;color:var(--text1);line-height:1.3;font-family:var(--font-display)}
.aj-skills{display:flex;flex-wrap:wrap;gap:5px}
.aj-detail{background:var(--bg-card);border:1px solid var(--border);border-radius:18px;padding:30px;position:sticky;top:0}
.aj-empty{text-align:center;padding:80px 24px;color:var(--text3)}
.req-list{list-style:none;display:flex;flex-direction:column;gap:10px;margin:18px 0}
.req-item{display:flex;align-items:flex-start;gap:10px;font-size:14px;color:var(--text1);font-weight:500;line-height:1.5}
.req-check{width:22px;height:22px;border-radius:50%;background:#e6f8f5;color:#0d9488;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.skills-wrap{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px}
.refer-card{position:relative;overflow:hidden;background:linear-gradient(100deg,#f3f1fe,#ebe7fd);border:1px solid #e2defb;border-radius:18px;padding:20px 22px;margin-top:22px}
@media(max-width:1100px) and (min-width:901px){.aj-layout{grid-template-columns:300px 1fr}}
/* Tablet/phone: job list becomes a swipeable row above the detail */
@media(max-width:900px){
  .aj-list{flex-direction:row;max-height:none;overflow-x:auto;overflow-y:visible;scroll-snap-type:x mandatory;padding:4px 4px 8px}
  .aj-card{flex:0 0 min(280px,78%);scroll-snap-align:start}
  .aj-detail{position:static;padding:22px}
}
@media(max-width:640px){
  .pills{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
  .pills::-webkit-scrollbar{display:none}
  .pills .cat-pill{flex-shrink:0}
  .aj-detail{padding:18px 16px}
  .aj-detail>div:first-child{align-items:flex-start !important}
  .aj-detail>div:first-child .aj-logo{width:52px !important;height:52px !important;font-size:24px !important}
  .aj-detail>div:first-child>div:last-child>div:nth-child(2){font-size:20px !important}
  .refer-card{padding:18px 16px}
}
</style>
<link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
<div class="dash-root">
  <div id="sidebar" data-role="academy"></div>
  <div class="dash-content">
    <header class="dash-topbar">
      <div class="topbar-search">
        <span class="material-symbols-rounded" style="font-size:18px;color:var(--text4)">search</span>
        <input type="text" id="searchInput" placeholder="Search by role, company, or skill…" oninput="render()">
      </div>
      <div style="display:flex;align-items:center;gap:8px">
        <div class="topbar-popover">
          <button class="topbar-icon-btn" onclick="toggleTopbarPopover(this)"><span class="material-symbols-rounded" style="font-size:20px">notifications</span><span class="notif-dot"></span></button>
          <div class="popover-panel notif-panel">
            <div class="popover-head">Notifications <span class="mark-read" onclick="this.closest('.topbar-popover').querySelector('.notif-dot')?.remove()">Mark all read</span></div>
            <div class="notif-list">
              <div class="notif-item">
                <div class="notif-icon tint-blue"><span class="material-symbols-rounded" style="font-size:17px">work</span></div>
                <div><div class="notif-text">TechCorp has 2 open referral slots</div><div class="notif-time">2h ago</div></div>
              </div>
              <div class="notif-item">
                <div class="notif-icon tint-purple"><span class="material-symbols-rounded" style="font-size:17px">handshake</span></div>
                <div><div class="notif-text">Neha Patel was placed at DataSoft</div><div class="notif-time">1d ago</div></div>
              </div>
            </div>
          </div>
        </div>
        <div class="topbar-popover">
          <div class="topbar-avatar" onclick="toggleTopbarPopover(this)">AC</div>
          <div class="popover-panel avatar-panel">
            <a href="#" class="avatar-menu-item" onclick="alert('Settings coming soon');return false"><span class="material-symbols-rounded" style="font-size:18px">settings</span> Account Settings</a>
            <a href="login.html" class="avatar-menu-item danger"><span class="material-symbols-rounded" style="font-size:18px">logout</span> Sign Out</a>
          </div>
        </div>
      </div>
    </header>
    <main class="dash-main">
      <div class="dash-greeting"><div class="g-blob"></div><svg class="g-spark" viewBox="0 0 44 44" aria-hidden="true"><path d="M8 30 L26 6"/><path d="M20 36 L38 14"/><path d="M30 40 L40 32"/></svg><div><h1 class="dash-h1">Job <span class="grad-text">Opportunities</span></h1><p class="dash-sub">Browse open roles and refer your students directly — without leaving the academy dashboard.</p></div></div>

      <div class="pills" id="catPills"></div>

      <div class="aj-layout">
        <div class="aj-list" id="jobsList"></div>
        <div id="jobDetail"></div>
      </div>
    </main>
  </div>
</div>

<script src="js/components.js"></script>
<script src="js/data.js"></script>
<script>
const jobs = getJobs();
const students = getCandidates();
const catTint = { Engineering:'tint-blue', Design:'tint-pink', Data:'tint-purple' };
let search = '', category = 'All', selectedId = jobs[0].id;

function renderPills() {
  const cats = ['All', ...new Set(jobs.map(j => j.category))];
  document.getElementById('catPills').innerHTML = cats.map(c =>
    `<button class="cat-pill ${c===category?'active':''}" onclick="setCategory('${c}')">${c}</button>`
  ).join('');
}
function setCategory(c) { category = c; render(); }

function selectJob(id) { selectedId = id; render(); }

function renderDetail() {
  const job = jobs.find(j => j.id === selectedId);
  if (!job) {
    document.getElementById('jobDetail').innerHTML = `<div class="aj-detail"><div class="aj-empty">Select a job to see details</div></div>`;
    return;
  }
  document.getElementById('jobDetail').innerHTML = `
    <div class="aj-detail">
      <div style="display:flex;gap:16px;align-items:center;margin-bottom:18px">
        <div class="aj-logo ${catTint[job.category] || 'tint-teal'}" style="width:64px;height:64px;font-size:30px;border-radius:18px">${job.logo}</div>
        <div>
          <div class="aj-company">${job.company}</div>
          <div style="font-family:var(--font-display);font-size:24px;font-weight:800;color:var(--text1);letter-spacing:-.03em">${job.title}</div>
          <span class="d-pill ${catTint[job.category] || 'tint-teal'}" style="margin-top:6px">${job.category}</span>
        </div>
      </div>
      <p style="font-size:14.5px;color:var(--text2);line-height:1.75">${job.description}</p>
      <ul class="req-list">${job.requirements.map(r=>`<li class="req-item"><span class="req-check"><span class="material-symbols-rounded" style="font-size:15px;font-weight:700">check</span></span>${r}</li>`).join('')}</ul>
      <div class="skills-wrap">${job.skills.map(s=>`<span class="skill-tag">${s}</span>`).join('')}</div>

      <div class="refer-card">
        <div class="sec-title" style="font-size:16px;margin-bottom:6px"><span class="sec-icon" style="background:linear-gradient(90deg,#4f46e5,#7c3aed);color:#fff"><span class="material-symbols-rounded">send</span></span>Refer a Student</div>
        <p style="font-size:13px;color:var(--text2);line-height:1.6;margin-bottom:14px">Put one of your students forward for this role at ${job.company}.</p>
        <select id="referSelect" style="width:100%;padding:12px 14px;color:var(--text1);font-size:14px;font-family:var(--font-body);margin-bottom:12px;background:#fff !important">
          ${students.map(s => `<option value="${s.username}">${s.name}</option>`).join('')}
        </select>
        <button id="referBtn" class="cta-btn" style="width:100%;justify-content:center" onclick="handleRefer()">Refer Student</button>
      </div>
    </div>`;
}

function handleRefer() {
  const select = document.getElementById('referSelect');
  const btn = document.getElementById('referBtn');
  const name = select.options[select.selectedIndex].textContent;
  btn.textContent = `✓ ${name} Referred`;
  btn.style.opacity = '.7';
  btn.disabled = true;
  select.disabled = true;
}

function render() {
  search = document.getElementById('searchInput').value;
  renderPills();
  const q = search.toLowerCase();
  const filtered = jobs.filter(j => {
    const ms = !q || j.title.toLowerCase().includes(q) || j.company.toLowerCase().includes(q) || j.skills.some(s=>s.toLowerCase().includes(q));
    const mc = category==='All' || j.category===category;
    return ms && mc;
  });

  if (!filtered.find(j => j.id === selectedId) && filtered.length) selectedId = filtered[0].id;

  document.getElementById('jobsList').innerHTML = filtered.length ? filtered.map(j => `
    <div class="aj-card ${j.id===selectedId?'active':''}" onclick="selectJob(${j.id})">
      <div class="aj-card-top">
        <div class="aj-logo ${catTint[j.category] || 'tint-teal'}">${j.logo}</div>
        <div><div class="aj-company">${j.company}</div><div class="aj-title">${j.title}</div></div>
      </div>
      <div class="aj-skills">${j.skills.slice(0,3).map(s=>`<span class="skill-tag">${s}</span>`).join('')}</div>
    </div>`).join('') : `<div class="aj-empty">No listings match your search.</div>`;

  renderDetail();
}

render();
</script>
</body>
</html>
