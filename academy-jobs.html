<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<link rel="icon" type="image/png" href="images/favicon.png">
<title>Jobs — Unresume</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
<link rel="stylesheet" href="css/globals.css">
<link rel="stylesheet" href="css/navbar.css">
<style>
.aj-layout{display:grid;grid-template-columns:380px 1fr;gap:20px;align-items:start}
@media(max-width:900px){.aj-layout{grid-template-columns:1fr}}
.pills{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.aj-list{display:flex;flex-direction:column;gap:10px;max-height:calc(100vh - 0px);overflow-y:auto}
.aj-list{padding:4px;scrollbar-width:none}
.aj-list::-webkit-scrollbar{display:none}
.aj-card{background:var(--bg-card);border:1px solid var(--border);border-radius:14px;padding:16px 18px;cursor:pointer;transition:border-color .15s}
.aj-card:hover{border-color:rgba(91,108,245,.3)}
.aj-card.active{border-color:rgba(128,64,216,.5);background:rgba(128,64,216,.05)}
.aj-card-top{display:flex;align-items:flex-start;gap:10px;margin-bottom:8px}
.aj-logo{width:44px;height:44px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.aj-company{font-size:12px;color:var(--text3);font-weight:600}
.aj-title{font-size:14.5px;font-weight:700;color:var(--text1);line-height:1.3;font-family:var(--font-display)}
.aj-skills{display:flex;flex-wrap:wrap;gap:5px}
.aj-detail{background:var(--bg-card);border:1px solid var(--border);border-radius:18px;padding:30px;position:sticky;top:0}
.aj-empty{text-align:center;padding:80px 24px;color:var(--text3)}
.req-list{list-style:none;display:flex;flex-direction:column;gap:10px;margin:18px 0}
.req-item{display:flex;align-items:flex-start;gap:10px;font-size:14px;color:var(--text1);font-weight:500;line-height:1.5}
.req-check{width:22px;height:22px;border-radius:50%;background:#e6f8f5;color:#0d9488;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.skills-wrap{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px}
.refer-card{position:relative;overflow:hidden;background:linear-gradient(100deg,#f3f1fe,#ebe7fd);border:1px solid #e2defb;border-radius:18px;padding:20px 22px;margin-top:22px}
@media(max-width:1100px) and (min-width:901px){.aj-layout{grid-template-columns:300px 1fr}}
/* Tablet/phone: job list becomes a swipeable row above the detail */
@media(max-width:900px){
  .aj-list{flex-direction:row;max-height:none;overflow-x:auto;overflow-y:visible;scroll-snap-type:x mandatory;padding:4px 4px 8px}
  .aj-card{flex:0 0 min(280px,78%);scroll-snap-align:start}
  .aj-detail{position:static;padding:22px}
}
@media(max-width:640px){
  .pills{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
  .pills::-webkit-scrollbar{display:none}
  .pills .cat-pill{flex-shrink:0}
  .aj-detail{padding:18px 16px}
  .aj-detail>div:first-child{align-items:flex-start !important}
  .aj-detail>div:first-child .aj-logo{width:52px !important;height:52px !important;font-size:24px !important}
  .aj-detail>div:first-child>div:last-child>div:nth-child(2){font-size:20px !important}
  .refer-card{padding:18px 16px}
}
</style>
<link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
<div class="dash-root">
  <div id="sidebar" data-roles="academy"></div>
  <div class="dash-content">
    <header class="dash-topbar">
      <div class="topbar-search">
        <span class="material-symbols-rounded" style="font-size:18px;color:var(--text4)">search</span>
        <input type="text" id="searchInput" placeholder="Search by role, company, or skill…" oninput="render()" data-local>
      </div>
    </header>
    <main class="dash-main">
      <div class="dash-greeting"><div class="g-blob"></div><svg class="g-spark" viewBox="0 0 44 44" aria-hidden="true"><path d="M8 30 L26 6"/><path d="M20 36 L38 14"/><path d="M30 40 L40 32"/></svg><div><h1 class="dash-h1">Job <span class="grad-text">Opportunities</span></h1><p class="dash-sub">Browse open roles and refer your students directly — without leaving the academy dashboard.</p></div></div>

      <div class="pills" id="catPills"></div>

      <div class="aj-layout">
        <div class="aj-list" id="jobsList"></div>
        <div id="jobDetail"></div>
      </div>
    </main>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/store.js"></script>
<script src="js/ui.js"></script>
<script src="js/components.js"></script>
<script>
const $ = id => document.getElementById(id), esc = UI.esc;
const catTint = { Engineering:'tint-blue', Design:'tint-pink', Data:'tint-purple', Product:'tint-amber' };
let category = 'All', selectedId = parseInt(UI.param('job'), 10) || null;
const preStudent = UI.param('student');
const picked = new Set(preStudent ? [preStudent] : []);

function renderPills(jobs) {
  const cats = ['All', ...new Set(jobs.map(j => j.category))];
  $('catPills').innerHTML = cats.map(c => `<button class="cat-pill ${c === category ? 'active' : ''}" onclick="setCategory('${c}')">${c}</button>`).join('');
}
function setCategory(c) { category = c; render(); }
function selectJob(id) { selectedId = id; picked.clear(); render(); }

function renderDetail(job) {
  if (!job) { $('jobDetail').innerHTML = `<div class="aj-detail"><div class="aj-empty">Select a job to see details</div></div>`; return; }
  const ac = UR.academies.mine();
  const used = UR.academy.referralUsage(job.id), open = Math.max(0, job.referralSlots - used);
  const refs = UR.academy.referrals().filter(r => r.jobId === job.id);
  const students = UR.academy.students().filter(s => !['Placed', 'Left Academy'].includes(s.status));
  const already = new Set(refs.map(r => r.studentId));
  const skillMatch = s => s.candidate ? (UR.candidates.stats(s.candidate) || { skills: [] }).skills.filter(k => job.skills.includes(k.skill)) : [];
  const ranked = students.map(s => ({ s, m: skillMatch(s) })).sort((a, b) => b.m.length - a.m.length || (b.s.skillScore || 0) - (a.s.skillScore || 0));
  [...picked].forEach(id => { if (already.has(id) || !students.some(s => s.id === id)) picked.delete(id); });
  $('jobDetail').innerHTML = `<div class="aj-detail">
    <div style="display:flex;gap:16px;align-items:center;margin-bottom:18px">
      <div class="aj-logo ${catTint[job.category] || 'tint-teal'}" style="width:64px;height:64px;font-size:30px;border-radius:18px">${job.logo}</div>
      <div><div class="aj-company">${esc(job.company)}</div><div style="font-family:var(--font-display);font-size:24px;font-weight:800;color:var(--text1);letter-spacing:-.03em">${esc(job.title)}</div>
        <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px"><span class="d-pill ${catTint[job.category] || 'tint-teal'}">${esc(job.category)}</span>${UI.pill(`Task: ${job.task.title} · ${UR.fmtDuration(job.task.timeLimitMin)}`, 'tint-purple')}${UI.pill('Closes ' + UI.fmtDate(job.deadline), 'tint-amber')}</div></div>
    </div>
    <p style="font-size:14.5px;color:var(--text2);line-height:1.75">${esc(job.description)}</p>
    <ul class="req-list">${job.requirements.map(r => `<li class="req-item"><span class="req-check"><span class="material-symbols-rounded" style="font-size:15px;font-weight:700">check</span></span>${esc(r)}</li>`).join('')}</ul>
    <div class="skills-wrap">${job.skills.map(s => `<span class="skill-tag">${esc(s)}</span>`).join('')}</div>
    <div class="refer-card">
      <div class="sec-title" style="font-size:16px;margin-bottom:6px"><span class="sec-icon" style="background:linear-gradient(90deg,#4f46e5,#7c3aed);color:#fff"><span class="material-symbols-rounded">send</span></span>Refer students</div>
      <p style="font-size:13px;color:var(--text2);line-height:1.6;margin-bottom:12px">${open ? `${UI.plural(open, 'slot')} left of ${job.referralSlots}.` : 'All referral slots for this job are used.'} Referred students are notified and still apply by completing the task — the company sees them as an academy referral.</p>
      ${ac.verification !== 'verified' ? `<div class="d-note warn">${UI.icon('gpp_maybe')}<div>Referrals unlock once your academy is verified.</div></div>` : open ? `
        <div style="display:flex;flex-direction:column;gap:6px;max-height:280px;overflow:auto;margin-bottom:12px">${ranked.map(({ s, m }) => { const on = picked.has(s.id), done = already.has(s.id), full = picked.size >= open && !on;
          return `<button class="pick-row ${on ? 'on' : ''}" ${done || full ? 'disabled' : ''} onclick="togglePick('${s.id}')"><span class="pick-check"><span class="material-symbols-rounded">check</span></span>${UI.avatar(s.name, 34, s.email)}
            <div style="flex:1;min-width:0"><div class="pick-name">${esc(s.name)}</div><div class="pick-sub">${s.tasksVerified ? `Skill score ${s.skillScore}` : 'No verified tasks yet'}${m.length ? ` · ${m.map(k => esc(k.skill) + ' ' + Math.round(k.avg)).join(', ')}` : ''}${s.candidate ? '' : ' · not signed up'}</div></div>
            ${done ? '<span class="d-pill tint-teal">Referred</span>' : m.length ? `<span class="d-pill tint-purple">${m.length} skill match</span>` : ''}</button>`; }).join('') || '<div class="pick-note">No active students to refer.</div>'}</div>
        ${UI.field({ name: 'refNote', label: 'Note to the company (optional)', placeholder: 'Why these students fit' })}
        <button class="cta-btn" style="width:100%;justify-content:center;margin-top:10px" ${picked.size ? '' : 'disabled'} onclick="refer(${job.id})">${UI.icon('send')} Refer ${picked.size || ''} student${picked.size === 1 ? '' : 's'}</button>` : ''}
      ${refs.length ? `<div class="d-sec-title" style="margin-top:16px">Already referred</div>${refs.map(r => `<div class="l-sub" style="margin-bottom:4px">${esc(r.studentName)} · ${UI.fmtDate(r.createdAt)} · ${r.application ? UR.APP_STATUS[r.application.status].label : r.status}</div>`).join('')}` : ''}
    </div></div>`;
}
function togglePick(id) { picked.has(id) ? picked.delete(id) : picked.add(id); render(); }
function refer(jobId) {
  const note = (document.querySelector('[name=refNote]') || {}).value || '';
  UI.run(() => UR.academy.refer([...picked], jobId, note), names => `Referred ${names.join(', ')} — they and the company were notified`).then(() => picked.clear()).catch(() => {});
}
function render() {
  const jobs = UR.jobs.list();
  renderPills(jobs);
  const q = $('searchInput').value.toLowerCase();
  const filtered = jobs.filter(j => (!q || j.title.toLowerCase().includes(q) || j.company.toLowerCase().includes(q) || j.skills.some(s => s.toLowerCase().includes(q))) && (category === 'All' || j.category === category));
  if (!filtered.find(j => j.id === selectedId) && filtered.length) selectedId = filtered[0].id;
  $('jobsList').innerHTML = filtered.length ? filtered.map(j => { const used = UR.academy.referralUsage(j.id); return `
    <div class="aj-card ${j.id === selectedId ? 'active' : ''}" role="button" tabindex="0" onclick="selectJob(${j.id})" onkeydown="if(event.key==='Enter')selectJob(${j.id})">
      <div class="aj-card-top"><div class="aj-logo ${catTint[j.category] || 'tint-teal'}">${j.logo}</div><div><div class="aj-company">${esc(j.company)}</div><div class="aj-title">${esc(j.title)}</div></div></div>
      <div class="aj-skills">${j.skills.slice(0, 3).map(s => `<span class="skill-tag">${esc(s)}</span>`).join('')}<span class="d-pill ${used < j.referralSlots ? 'tint-purple' : 'gray'}">${used}/${j.referralSlots} referred</span></div>
    </div>`; }).join('') : `<div class="aj-empty">No listings match your search.</div>`;
  renderDetail(filtered.find(j => j.id === selectedId));
}
render();
UI.onChange(render);
</script>
</body>
</html>
