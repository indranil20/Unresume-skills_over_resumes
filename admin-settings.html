<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<link rel="icon" type="image/png" href="images/favicon.png">
<title>Platform Settings — Unresume Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
<link rel="stylesheet" href="css/globals.css">
<link rel="stylesheet" href="css/navbar.css">
<link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
<div class="dash-root">
  <div id="sidebar" data-roles="admin"></div>
  <div class="dash-content">
    <header class="dash-topbar" data-auto data-search="Search…"></header>
    <main class="dash-main">
      <div class="dash-greeting"><div class="g-blob"></div><div><h1 class="dash-h1">Platform <span class="grad-text">Settings</span></h1><p class="dash-sub">Scoring rules, integrity thresholds and platform content. Every change is audit-logged.</p></div></div>
      <form id="form" style="max-width:860px;display:flex;flex-direction:column;gap:18px" novalidate></form>
    </main>
  </div>
</div>
<script src="js/data.js"></script>
<script src="js/store.js"></script>
<script src="js/ui.js"></script>
<script src="js/components.js"></script>
<script>
const $ = id => document.getElementById(id);
function render() {
  const s = UR.admin.settings();
  const card = (icon, title, body) => `<section class="panel-card" style="display:flex;flex-direction:column;gap:14px"><h2 class="sec-title"><span class="sec-icon tint-purple">${UI.icon(icon, 19, true)}</span>${title}</h2>${body}</section>`;
  $('form').innerHTML =
    card('leaderboard', 'Scoring & ranking', `<div class="form-grid2">${UI.field({ name: 'rankMinTasks', label: 'Verified tasks needed to be ranked', type: 'number', min: 1, max: 20, value: s.rankMinTasks })}${UI.field({ name: 'certificateThreshold', label: 'Minimum score for a certificate', type: 'number', min: 0, max: 100, value: s.certificateThreshold })}</div>
      <div class="form-grid2">${UI.field({ name: 'badgeMinTasks', label: 'Tasks in a skill for a skill badge', type: 'number', min: 1, max: 20, value: s.badgeMinTasks })}${UI.field({ name: 'badgeMinAvg', label: 'Average score for a skill badge', type: 'number', min: 0, max: 100, value: s.badgeMinAvg })}</div>
      <div class="d-note">${UI.icon('info')}<div>Skill Score is always 10 × the mean verified task score. These thresholds change who is ranked and which badges show — recalculated instantly for everyone.</div></div>`)
    + card('policy', 'Assessment integrity', `<div class="form-grid3">${UI.field({ name: 'fastCompletionPct', label: 'Flag if finished in under (% of limit)', type: 'number', min: 0, max: 100, value: s.fastCompletionPct })}${UI.field({ name: 'similarityThreshold', label: 'Note similarity threshold (0.1–1)', type: 'number', min: 0.1, max: 1, step: 0.05, value: s.similarityThreshold })}${UI.field({ name: 'focusLossThreshold', label: 'Flag after N tab switches', type: 'number', min: 1, max: 100, value: s.focusLossThreshold })}</div>
      ${UI.field({ name: 'maxUploadMB', label: 'Max upload size per file (MB)', type: 'number', min: 1, max: 500, value: s.maxUploadMB })}`)
    + card('shield', 'Access & trust', `<label style="display:flex;gap:10px;align-items:center;font-size:14px;font-weight:600;color:var(--text1)"><input type="checkbox" name="requireCompanyVerification" ${s.requireCompanyVerification ? 'checked' : ''}> Companies must be verified before jobs go live</label>
      <label style="display:flex;gap:10px;align-items:center;font-size:14px;font-weight:600;color:var(--text1)"><input type="checkbox" name="allowCandidateChat" ${s.allowCandidateChat ? 'checked' : ''}> Allow candidate-to-candidate messaging (when the recipient allows it)</label>`)
    + card('sell', 'Pricing plans (proposed — shown on pricing.html, not enforced)', `<p style="font-size:12.5px;color:var(--text3)">Edit the plan cards. No payments are taken and no limits are enforced until billing is integrated (see BACKEND.md).</p>${s.plans.map((p, i) => `<div class="panel-card" style="box-shadow:none;background:#fafaff;display:flex;flex-direction:column;gap:10px"><div class="form-grid3">${UI.field({ name: 'plan' + i + '_name', label: 'Plan name', value: p.name })}${UI.field({ name: 'plan' + i + '_price', label: 'Price', value: p.price })}${UI.field({ name: 'plan' + i + '_period', label: 'Period', value: p.period })}</div>${UI.field({ name: 'plan' + i + '_blurb', label: 'Short description', value: p.blurb })}${UI.field({ name: 'plan' + i + '_features', label: 'Features (one per line)', type: 'textarea', rows: 4, value: p.features.join('\n') })}</div>`).join('')}`)
    + card('campaign', 'Platform announcement', UI.field({ name: 'announcement', label: 'Banner shown at the top of every dashboard (leave empty to hide)', value: s.announcement, placeholder: 'e.g. Scheduled maintenance Sunday 02:00–03:00 IST' }))
    + `<div><button class="cta-btn" type="submit">${UI.icon('save')}Save settings</button></div>`;
}
$('form').addEventListener('submit', e => {
  e.preventDefault();
  const d = Object.fromEntries(new FormData(e.target));
  d.requireCompanyVerification = !!e.target.requireCompanyVerification.checked;
  d.allowCandidateChat = !!e.target.allowCandidateChat.checked;
  const cur = UR.admin.settings().plans;
  d.plans = cur.map((p, i) => ({ ...p, name: (d['plan' + i + '_name'] || p.name).trim(), price: (d['plan' + i + '_price'] || '').trim(), period: (d['plan' + i + '_period'] || '').trim(), blurb: (d['plan' + i + '_blurb'] || '').trim(), features: String(d['plan' + i + '_features'] || '').split('\n').map(x => x.trim()).filter(Boolean) }));
  Object.keys(d).filter(k => /^plan\d_/.test(k)).forEach(k => delete d[k]);
  UI.run(() => UR.admin.updateSettings(d), 'Settings saved').then(() => location.reload()).catch(() => {});
});
render();
</script>
</body>
</html>
