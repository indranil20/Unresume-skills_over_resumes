<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<link rel="icon" type="image/png" href="images/favicon.png">
<title>Manage Students — Unresume</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
<link rel="stylesheet" href="css/globals.css">
<link rel="stylesheet" href="css/navbar.css">
<link rel="stylesheet" href="css/dashboard.css">
<style>
.id-pill{font-size:11.5px;font-weight:700;padding:5px 11px;border-radius:100px;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.id-pill.student{background:#eaf1ff;color:#2563eb}.id-pill.candidate{background:#e6f8f5;color:#0d9488}
.priority-tag{font-size:11px;font-weight:700;padding:5px 11px;border-radius:100px;background:#fef6e4;color:#b7791f;white-space:nowrap}
.status-select{font-size:13px;font-weight:600;padding:7px 10px;color:var(--text1);cursor:pointer;font-family:var(--font-body)}
.csv-drop{border:2px dashed var(--border-light);border-radius:14px;padding:16px;text-align:center;font-size:13px;color:var(--text3)}
.prev-table{max-height:220px;overflow:auto;border:1px solid var(--border);border-radius:12px}
</style>
</head>
<body>
<div class="dash-root">
  <div id="sidebar" data-roles="academy"></div>
  <div class="dash-content">
    <header class="dash-topbar"><div class="topbar-search"><span class="material-symbols-rounded" style="font-size:18px;color:var(--text4)">search</span><input type="text" id="searchInput" placeholder="Search name, email or ID…" aria-label="Search students" data-local></div></header>
    <main class="dash-main">
      <div class="dash-greeting"><div class="g-blob"></div><svg class="g-spark" viewBox="0 0 44 44" aria-hidden="true"><path d="M8 30 L26 6"/><path d="M20 36 L38 14"/><path d="M30 40 L40 32"/></svg>
        <div><h1 class="dash-h1">Manage Students</h1><p class="dash-sub">Issue Student IDs, assign batches and track progress. When a student is Placed or leaves, their access auto-converts to an independent Candidate ID.</p></div>
        <div style="display:flex;gap:8px;flex-wrap:wrap"><button onclick="addOne()" class="cta-btn"><span class="material-symbols-rounded" style="font-size:17px">person_add</span> Add student</button><button onclick="bulk()" class="cta-btn" style="background:#fff;color:var(--brand);box-shadow:var(--shadow-sm)"><span class="material-symbols-rounded" style="font-size:17px">upload_file</span> Bulk import</button></div></div>
      <div class="d-toolbar">
        <select id="batchF" aria-label="Batch"></select>
        <select id="statusF" aria-label="Status"><option value="">All statuses</option><option>Active</option><option>Referred</option><option>Placed</option><option>Left Academy</option></select>
        <select id="sortF" aria-label="Sort"><option value="name">Name</option><option value="score">Skill score</option><option value="tasks">Verified tasks</option><option value="recent">Recently added</option></select>
        <span class="spacer"></span><span id="studentCount" class="d-pill gray"></span>
        <button class="btn-sm" onclick="exportCSV()"><span class="material-symbols-rounded">download</span>Export CSV</button>
      </div>
      <div class="d-table-wrap"><table class="d-table stack"><thead><tr><th>Student</th><th>ID</th><th>Batch</th><th>Progress</th><th>Status</th><th>Access</th><th></th></tr></thead><tbody id="rows"></tbody></table></div>
    </main>
  </div>
</div>
<script src="js/data.js"></script>
<script src="js/store.js"></script>
<script src="js/ui.js"></script>
<script src="js/components.js"></script>
<script>
const $ = id => document.getElementById(id), esc = UI.esc;
if (UI.param('q')) $('searchInput').value = UI.param('q');
let batches = [], initBatch = UI.param('batch') || '';
function list() {
  const sort = $('sortF').value;
  let l = UR.academy.students({ q: $('searchInput').value, batchId: $('batchF').value || undefined, status: $('statusF').value || undefined });
  return sort === 'score' ? UI.sortBy(l, s => s.skillScore || 0) : sort === 'tasks' ? UI.sortBy(l, 'tasksVerified') : sort === 'recent' ? UI.sortBy(l, s => new Date(s.createdAt).getTime()) : UI.sortBy(l, s => s.name.toLowerCase(), 'asc');
}
function render() {
  batches = UR.academy.batches();
  const cur = $('batchF').value || initBatch; initBatch = '';
  $('batchF').innerHTML = `<option value="">All batches</option>` + batches.map(b => `<option value="${b.id}" ${b.id === cur ? 'selected' : ''}>${esc(b.name)} — ${esc(b.course)}</option>`).join('');
  const l = list(), total = UR.academy.students().length;
  $('studentCount').textContent = `${l.length} of ${total} students`;
  $('rows').innerHTML = l.length ? l.map(s => `<tr>
    <td class="who-cell"><div class="who">${UI.avatar(s.name, 34, s.email)}<div><b>${s.candidate ? `<a href="candidate-profile.html?u=${s.candidate}">${esc(s.name)}</a>` : esc(s.name)}</b><small>${esc(s.email)}${s.candidate ? '' : s.consent === 'pending' ? ' · <span style="color:#b7791f;font-weight:700" title="The candidate must accept in their Settings">link request pending</span>' : s.consent === 'declined' ? ' · <span style="color:#be123c">declined link</span>' : ' · <span title="They get a link request when they sign up with this email">no linked account</span>'}</small></div></div></td>
    <td data-label="ID">${s.idType === 'student' ? `<span class="id-pill student">${UI.icon('school', 13)} ${s.recordId}</span>` : `<span class="id-pill candidate">${UI.icon('badge', 13)} ${s.recordId}</span>`}</td>
    <td data-label="Batch"><select class="status-select" aria-label="Batch for ${esc(s.name)}" onchange="update('${s.id}',{batchId:this.value})"><option value="">—</option>${batches.map(b => `<option value="${b.id}" ${b.id === s.batchId ? 'selected' : ''}>${esc(b.name)}</option>`).join('')}</select></td>
    <td data-label="Progress">${s.tasksVerified ? `<b class="num">${s.skillScore}</b> <small style="color:var(--text3)">· ${s.tasksVerified} tasks</small>` : '<span style="color:var(--text4);font-size:12px">No verified tasks</span>'}${s.pendingReviews ? '<br>' + UI.pill(s.pendingReviews + ' in review', 'tint-amber') : ''}${s.activeApplications ? '<br><small style="color:var(--text3)">' + UI.plural(s.activeApplications, 'active application') + '</small>' : ''}</td>
    <td data-label="Status"><select class="status-select" aria-label="Status for ${esc(s.name)}" onchange="setStatus('${s.id}', this.value, this)">${['Active', 'Referred', 'Placed', 'Left Academy'].map(o => `<option ${s.status === o ? 'selected' : ''}>${o}</option>`).join('')}</select></td>
    <td data-label="Access">${s.idType === 'student' ? '<span class="priority-tag">⚡ Priority Referral</span>' : '<span style="font-size:12px;color:var(--text3)">Independent access</span>'}</td>
    <td><div class="acts">${s.status !== 'Placed' && s.status !== 'Left Academy' ? `<a class="btn-sm" href="academy-jobs.html?student=${s.id}">${UI.icon('send')}Refer</a>` : ''}<button class="btn-sm danger" aria-label="Remove ${esc(s.name)}" onclick="removeS('${s.id}','${esc(s.name).replace(/'/g, '&#39;')}')">${UI.icon('delete')}</button></div></td></tr>`).join('')
    : `<tr><td colspan="7">${UI.empty('school', total ? 'No students match these filters' : 'No students yet', total ? '' : 'Add students one at a time or import a CSV for a whole batch.')}</td></tr>`;
}
const update = (id, patch) => UI.run(() => UR.academy.updateStudent(id, patch), 'Student updated').catch(() => render());
async function setStatus(id, value, el) {
  const s = UR.academy.students().find(x => x.id === id);
  if (s.idType === 'student' && (value === 'Placed' || value === 'Left Academy')) {
    const r = await UI.confirm({ title: `Mark ${s.name} as ${value}?`, text: 'Their Student ID converts to an independent Candidate ID. They keep their account and scores but lose priority-referral status. This can\'t be undone.', confirmLabel: 'Convert & save' });
    if (!r.ok) { el.value = s.status; return; }
    if (value === 'Placed') return placementFor(s);
  }
  update(id, { status: value });
}
function placementFor(s) {
  UI.modal({ title: `Record placement for ${s.name}`, icon: 'handshake', submitLabel: 'Save placement', sub: 'Hires made through Unresume are recorded automatically. Use this for placements outside the platform — they are marked "self-reported".',
    body: `<div class="form-grid2">${UI.field({ name: 'companyName', label: 'Company', required: true })}${UI.field({ name: 'role', label: 'Role', required: true })}</div><div class="form-grid2">${UI.field({ name: 'placedAt', label: 'Start date', type: 'date' })}${UI.field({ name: 'salary', label: 'Package (optional)', placeholder: '₹ LPA' })}</div>`,
    onSubmit: d => { UR.academy.addPlacement({ studentId: s.id, ...d }); UI.toast(`${s.name} marked as placed`); } });
  setTimeout(render, 50);
}
function addOne() {
  UI.modal({ title: 'Add a student', icon: 'person_add', submitLabel: 'Issue Student ID',
    body: `<div class="form-grid2">${UI.field({ name: 'name', label: 'Full name', required: true })}${UI.field({ name: 'email', label: 'Email', type: 'email', required: true, hint: 'If they already have an Unresume account with this email, they get a request to accept — candidates own their accounts, so links need their consent.' })}</div>${UI.field({ name: 'batchId', label: 'Batch', type: 'select', options: [['', 'No batch'], ...batches.map(b => [b.id, `${b.name} — ${b.course}`])] })}`,
    onSubmit: d => { const s = UR.academy.addStudent(d); UI.toast(`${s.name} added — ${s.recordId} issued`); } });
}
function bulk() {
  let rows = [];
  const m = UI.modal({ title: 'Bulk import students', icon: 'upload_file', wide: true, submitLabel: 'Import', sub: 'CSV with columns <code>name,email,batch</code> (batch optional — must match a batch name). Paste below or choose a file.',
    body: `<div class="csv-drop"><input type="file" id="csvFile" accept=".csv,text/csv" aria-label="CSV file"></div>
      ${UI.field({ name: 'csv', label: 'CSV text', type: 'textarea', rows: 6, placeholder: 'name,email,batch\nAsha Roy,asha@example.com,FS-2026A' })}
      ${UI.field({ name: 'batchId', label: 'Default batch (for rows without one)', type: 'select', options: [['', 'No batch'], ...batches.map(b => [b.id, b.name])] })}
      <div id="csvPreview"></div>`,
    onSubmit: d => {
      rows = parse(d.csv);
      if (!rows.length) throw new Error('No rows found. Check the CSV has a name,email header.');
      const r = UR.academy.bulkAdd(rows, d.batchId || null);
      if (r.errors.length) {
        $('csvPreview').innerHTML = `<div class="d-note ${r.added.length ? 'warn' : 'bad'}">${UI.icon('info')}<div><b>${r.added.length} added, ${r.errors.length} skipped.</b><br>${r.errors.map(e => `Row ${e.row}: ${esc(e.message)}`).join('<br>')}</div></div>`;
        if (r.added.length) UI.toast(`${r.added.length} students imported`);
        const ta = m.form.querySelector('[name=csv]'); ta.value = 'name,email,batch\n' + r.errors.map(e => { const x = rows[e.row - 2]; return [x.name, x.email, x.batch || ''].join(','); }).join('\n');
        return false; // keep the dialog open so failed rows can be fixed
      }
      UI.toast(`${r.added.length} students imported with Student IDs`);
    } });
  const ta = m.form.querySelector('[name=csv]');
  const preview = () => { const r = parse(ta.value); $('csvPreview').innerHTML = r.length ? `<div class="d-sec-title">${r.length} row${r.length > 1 ? 's' : ''} detected</div><div class="prev-table"><table class="d-table"><thead><tr><th>Name</th><th>Email</th><th>Batch</th></tr></thead><tbody>${r.slice(0, 50).map(x => `<tr><td>${esc(x.name)}</td><td>${esc(x.email)}</td><td>${esc(x.batch || '')}</td></tr>`).join('')}</tbody></table></div>` : ''; };
  ta.addEventListener('input', UI.debounce(preview, 200));
  m.form.querySelector('#csvFile').addEventListener('change', e => { const f = e.target.files[0]; if (!f) return; if (f.size > 2e6) return UI.toast('CSV is larger than 2 MB', 'error'); f.text().then(t => { ta.value = t; preview(); }); });
}
function parse(text) {
  const rows = UI.parseCSV(String(text || '').trim()); if (!rows.length) return [];
  const head = rows[0].map(h => h.trim().toLowerCase());
  const hasHead = head.includes('email');
  const idx = k => hasHead ? head.indexOf(k) : { name: 0, email: 1, batch: 2 }[k];
  return (hasHead ? rows.slice(1) : rows).map(r => ({ name: (r[idx('name')] || '').trim(), email: (r[idx('email')] || '').trim(), batch: idx('batch') >= 0 ? (r[idx('batch')] || '').trim() : '' }));
}
async function removeS(id, name) { const r = await UI.confirm({ title: `Remove ${name} from your roster?`, danger: true, confirmLabel: 'Remove', text: 'Their Unresume account (if any) is not deleted — they just stop being your student.' }); if (r.ok) UI.run(() => UR.academy.removeStudent(id), 'Student removed').catch(() => {}); }
function exportCSV() {
  UI.csv(`students-${new Date().toISOString().slice(0, 10)}.csv`, ['Name', 'Email', 'ID', 'Batch', 'Course', 'Status', 'Skill score', 'Verified tasks', 'Pending reviews', 'Active applications', 'Referrals', 'Has account'],
    list().map(s => [s.name, s.email, s.recordId, s.batchName, s.course, s.status, s.tasksVerified ? s.skillScore : '', s.tasksVerified, s.pendingReviews, s.activeApplications, s.referrals, s.candidate ? 'yes' : 'no']));
}
['batchF', 'statusF', 'sortF'].forEach(id => $(id).addEventListener('change', render));
$('searchInput').addEventListener('input', UI.debounce(render, 150));
render();
if (UI.param('bulk')) bulk();
UI.onChange(render);
</script>
</body>
</html>
