<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<link rel="icon" type="image/png" href="images/favicon.png">
<title>Disputes &amp; Reports — Unresume Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
<link rel="stylesheet" href="css/globals.css">
<link rel="stylesheet" href="css/navbar.css">
<link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
<div class="dash-root">
  <div id="sidebar" data-roles="admin"></div>
  <div class="dash-content">
    <header class="dash-topbar" data-auto data-search="Search…"></header>
    <main class="dash-main">
      <div class="dash-greeting"><div class="g-blob"></div><div><h1 class="dash-h1">Disputes &amp; <span class="grad-text">Reports</span></h1><p class="dash-sub">Score disputes are decided here — not by the company that scored. Also user reports, account requests and contact-form messages.</p></div></div>
      <div class="d-tabs" id="tabs"></div>
      <div id="out"></div>
    </main>
  </div>
</div>
<script src="js/data.js"></script>
<script src="js/store.js"></script>
<script src="js/ui.js"></script>
<script src="js/components.js"></script>
<script>
const $ = id => document.getElementById(id), esc = UI.esc;
let tab = UI.param('tab') || 'disputes', showClosed = false;
function render() {
  const disputes = UR.disputes.list(), reports = UR.reports.list(), contact = UR.contact.list();
  const open = { disputes: disputes.filter(d => ['open', 'under_review'].includes(d.status)), reports: reports.filter(r => r.status === 'open'), contact: contact.filter(c => c.status === 'open') };
  $('tabs').innerHTML = [['disputes', 'Score disputes'], ['reports', 'User reports'], ['contact', 'Contact messages']].map(([k, l]) => `<button class="d-tab ${tab === k ? 'active' : ''}" data-tab="${k}">${l}<span class="cnt">${open[k].length}</span></button>`).join('')
    + `<label style="display:flex;gap:6px;align-items:center;font-size:12.5px;font-weight:600;color:var(--text2);padding:0 10px"><input type="checkbox" ${showClosed ? 'checked' : ''} onchange="showClosed=this.checked;render()"> Show closed</label>`;
  UI.tabs($('tabs'), k => { tab = k; render(); });
  const list = showClosed ? { disputes, reports, contact }[tab] : open[tab];
  if (!list.length) { $('out').innerHTML = UI.empty('task_alt', 'Nothing open here', 'All caught up.'); return; }
  if (tab === 'disputes') $('out').innerHTML = list.map(d => { const s = d.submission;
    return `<div class="panel-card" style="margin-bottom:14px;display:flex;flex-direction:column;gap:14px">
      <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">${UI.avatar(d.candidateName, 42, d.candidate)}<div style="flex:1;min-width:200px"><div class="sec-title">${esc(d.candidateName)} · ${esc(s.task.title)} ${d.kind === 'integrity' ? UI.pill('Integrity appeal', 'tint-red', 'policy') : UI.pill('Score dispute', 'tint-purple')}</div><div class="l-sub">Scored by ${esc(s.reviewerName)} (${esc(s.companyName)}) · disputed ${UI.timeAgo(d.createdAt)}</div></div>
        ${UI.pill({ open: 'Open', under_review: 'Under review', resolved: 'Resolved', rejected: 'Upheld' }[d.status], { open: 'tint-amber', under_review: 'tint-blue', resolved: 'tint-teal', rejected: 'gray' }[d.status])}${s.score ? UI.verifiedScore(s.score.total, true) : ''}</div>
      <div class="d-note warn">${UI.icon('gavel')}<div><b>${esc(d.reason)}:</b> ${esc(d.details)}</div></div>
      ${s.score ? `<div class="grid-2"><div><div class="d-sec-title">Reviewer's breakdown</div>${s.score.breakdown.map(b => `<div class="bd-row"><div><div class="bd-name">${esc(b.criterion)}</div>${b.comment ? `<div class="bd-comment">${esc(b.comment)}</div>` : ''}</div><div class="rubric-bar-outer" style="height:7px;background:#eeedfd"><div class="rubric-bar-inner" style="width:${b.awarded / b.max * 100}%"></div></div><div class="bd-pts">${b.awarded}<small>/${b.max}</small></div></div>`).join('')}</div>
        <div><div class="d-sec-title">Reviewer feedback</div><p style="font-size:13px;color:var(--text2);line-height:1.6">${esc(s.score.feedback)}</p><div class="d-sec-title" style="margin-top:12px">Submission</div><div class="l-sub">${s.files.map(f => esc(f.name)).join(', ')}${s.note ? '<br>Note: ' + esc(s.note) : ''}</div></div></div>` : ''}
      ${d.resolution ? `<div class="d-note good">${UI.icon('check')}<div><b>${esc(d.decision || '')}</b> — ${esc(d.resolution)} (${UI.fmtDate(d.resolvedAt)})</div></div>` : `<div style="display:flex;gap:8px;flex-wrap:wrap">${d.status === 'open' ? `<button class="btn-sm" onclick="UI.run(()=>UR.disputes.markReviewing('${d.id}'),'Marked under review').catch(()=>{})">${UI.icon('visibility')}Start review</button>` : ''}<button class="btn-sm primary" onclick="resolve('${d.id}', ${s.score ? s.score.total : 0}, '${d.kind || 'score'}')">${UI.icon('gavel')}Decide</button></div>`}
    </div>`; }).join('');
  if (tab === 'reports') $('out').innerHTML = list.map(r => `<div class="l-row" style="align-items:flex-start"><span class="sec-icon ${r.type === 'account_deletion' ? 'tint-amber' : 'tint-red'}">${UI.icon(r.type === 'account_deletion' ? 'person_remove' : 'flag', 19, true)}</span>
      <div class="l-main"><div class="l-title">${esc(r.reason)} ${UI.pill(r.type.replace('_', ' '), 'gray')}</div><div class="l-sub">${esc(r.targetLabel || r.targetId)} · reported by ${esc(r.reporterName)} · ${UI.timeAgo(r.createdAt)}</div>${r.details ? `<div class="l-sub" style="margin-top:4px">${esc(r.details)}</div>` : ''}${r.resolution ? `<div class="l-sub" style="margin-top:4px">${UI.icon('check')} ${esc(r.resolution)}</div>` : ''}</div>
      <div class="l-acts">${r.status === 'open' ? `${r.type === 'job' ? `<a class="btn-sm" href="admin-moderation.html?tab=jobs">Moderate job</a>` : ''}${r.type === 'user' ? `<a class="btn-sm" href="candidate-profile.html?u=${esc(r.targetId)}" target="_blank">Open profile</a>` : ''}<button class="btn-sm good" onclick="closeR('${r.id}','resolved')">Actioned</button><button class="btn-sm" onclick="closeR('${r.id}','dismissed')">Dismiss</button>` : UI.pill(r.status, 'gray')}</div></div>`).join('');
  if (tab === 'contact') $('out').innerHTML = list.map(c => `<div class="l-row" style="align-items:flex-start"><span class="sec-icon tint-blue">${UI.icon('mail', 19, true)}</span>
      <div class="l-main"><div class="l-title">${esc(c.name)} · ${esc(c.topic)}</div><div class="l-sub">${esc(c.email)} · ${UI.timeAgo(c.createdAt)}</div><p style="font-size:13.5px;color:var(--text2);margin-top:6px;line-height:1.6">${esc(c.message)}</p></div>
      <div class="l-acts">${c.status === 'open' ? `<a class="btn-sm" href="mailto:${esc(c.email)}?subject=${encodeURIComponent('Re: ' + c.topic)}">${UI.icon('reply')}Reply by email</a><button class="btn-sm good" onclick="UI.run(()=>UR.contact.close('${c.id}'),'Marked handled').catch(()=>{})">Mark handled</button>` : UI.pill('handled', 'gray')}</div></div>`).join('');
}
function resolve(id, current, kind) {
  UI.modal({ title: 'Decide dispute', icon: 'gavel', submitLabel: 'Record decision', sub: 'The candidate is notified. Adjusting or voiding also notifies the company.',
    body: (kind === 'integrity' ? `<div class="d-note warn">${UI.icon('policy')}<div>Review the original flags in Moderation. Don't decide on automated signals alone — ask for a short live walkthrough if authorship is unclear.</div></div>` : '') + UI.field({ name: 'decision', label: 'Decision', type: 'select', required: true, options: kind === 'integrity' ? [['', 'Choose…'], ['reinstated', 'Reinstate the submission'], ['upheld', 'Uphold the void']] : [['', 'Choose…'], ['upheld', 'Uphold original score'], ['adjusted', 'Adjust score'], ['voided', 'Void submission']] })
      + UI.field({ name: 'newScore', label: `New total score (currently ${current})`, type: 'number', min: 0, max: 100, hint: 'Only for "Adjust score".' })
      + UI.field({ name: 'note', label: 'Resolution (shown to the candidate)', type: 'textarea', required: true }),
    onSubmit: d => { if (!d.decision) throw new Error('Choose a decision.'); UR.disputes.resolve(id, { decision: d.decision, note: d.note, newScore: d.newScore === '' ? undefined : Number(d.newScore) }); UI.toast('Decision recorded — candidate notified'); } });
}
async function closeR(id, st) { const r = await UI.confirm({ title: st === 'resolved' ? 'Mark as actioned?' : 'Dismiss report?', confirmLabel: 'Confirm', input: { label: 'Note (logged; reporter is told it was reviewed)' } }); if (r.ok) UI.run(() => UR.reports.resolve(id, st, r.value || ''), 'Report closed').catch(() => {}); }
render();
UI.onChange(render);
</script>
</body>
</html>
