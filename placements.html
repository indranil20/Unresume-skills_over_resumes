<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<link rel="icon" type="image/png" href="images/favicon.png">
<title>Referrals &amp; Placements — Unresume</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
<link rel="stylesheet" href="css/globals.css">
<link rel="stylesheet" href="css/navbar.css">
<link rel="stylesheet" href="css/dashboard.css">
<style>.global-toggle-bar{padding:18px 20px;display:flex;align-items:center;gap:16px;margin-bottom:20px}</style>
</head>
<body>
<div class="dash-root">
  <div id="sidebar" data-roles="academy"></div>
  <div class="dash-content">
    <header class="dash-topbar" data-auto data-search="Search student or company…"></header>
    <main class="dash-main">
      <div class="dash-greeting"><div class="g-blob"></div><svg class="g-spark" viewBox="0 0 44 44" aria-hidden="true"><path d="M8 30 L26 6"/><path d="M20 36 L38 14"/><path d="M30 40 L40 32"/></svg>
        <div><h1 class="dash-h1">Referrals &amp; <span class="grad-text">Placements</span></h1><p class="dash-sub">Follow every referral through to hire, and control which placements appear on your public placement record.</p></div>
        <a class="cta-btn" href="academy-jobs.html"><span class="material-symbols-rounded" style="font-size:18px">send</span> Refer students</a></div>
      <div class="d-tabs" id="tabs"></div>
      <div id="out"></div>
    </main>
  </div>
</div>
<script src="js/data.js"></script>
<script src="js/store.js"></script>
<script src="js/ui.js"></script>
<script src="js/components.js"></script>
<script>
const $ = id => document.getElementById(id), esc = UI.esc;
let tab = UI.param('tab') || 'referrals';
const REF = { referred: ['Referred — not started', 'gray'], started: ['Task started', 'tint-blue'], applied: ['Applied', 'tint-purple'], placed: ['Hired', 'tint-teal'], rejected: ['Not selected', 'tint-red'] };
function render() {
  const q = ($('topbarSearch') || { value: '' }).value.toLowerCase();
  const refs = UR.academy.referrals().filter(r => !q || (r.studentName || '').toLowerCase().includes(q) || (r.job && r.job.company.toLowerCase().includes(q)));
  const pls = UR.academy.placements().filter(p => !q || (p.studentName || '').toLowerCase().includes(q) || (p.companyName || p.externalCompany || '').toLowerCase().includes(q));
  $('tabs').innerHTML = [['referrals', 'Referrals', refs.length], ['placements', 'Placements', pls.length]].map(([k, l, n]) => `<button class="d-tab ${tab === k ? 'active' : ''}" data-tab="${k}">${l}<span class="cnt">${n}</span></button>`).join('');
  UI.tabs($('tabs'), k => { tab = k; render(); });
  if (tab === 'referrals') {
    $('out').innerHTML = refs.length ? `<div class="d-table-wrap"><table class="d-table stack"><thead><tr><th>Student</th><th>Job</th><th>Referred</th><th>Progress</th><th>Task score</th></tr></thead><tbody>${refs.map(r => `<tr>
      <td class="who-cell"><div class="who">${UI.avatar(r.studentName, 34, r.studentId)}<div><b>${esc(r.studentName)}</b><small>${r.studentLinked ? 'Has an Unresume account' : 'Not signed up — invite them to create an account with their roster email'}</small></div></div></td>
      <td data-label="Job">${r.job ? `${r.job.logo} ${esc(r.job.title)}<br><small style="color:var(--text3)">${esc(r.job.company)}</small>` : '—'}</td>
      <td data-label="Referred">${UI.fmtDate(r.createdAt)}</td>
      <td data-label="Progress">${r.application ? UI.appPill(r.application.status) : UI.pill(...REF[r.status] || [r.status, 'gray'])}</td>
      <td data-label="Score">${r.application && r.application.taskScore != null ? UI.verifiedScore(r.application.taskScore, true) : '—'}</td></tr>`).join('')}</tbody></table></div>`
      : UI.empty('send', 'No referrals yet', 'Refer students to open jobs from the Jobs page.', '<a class="cta-btn" href="academy-jobs.html">Browse jobs</a>');
    return;
  }
  const allOn = pls.length && pls.every(p => p.visible);
  $('out').innerHTML = `<div class="global-toggle-bar"><div class="stat-icon tint-pink" style="grid-row:auto">${UI.icon('public')}</div><div style="flex:1"><div style="font-size:14px;font-weight:800;color:var(--text1)">Show all placements publicly</div><div style="font-size:12.5px;color:var(--text3)">Visible placements count towards your public placement record. Hidden ones stay private but are still counted in your own reports.</div></div>
      <div class="toggle-track ${allOn ? 'on' : ''}" role="switch" tabindex="0" aria-checked="${allOn}" aria-label="Show all placements" onclick="UI.run(()=>UR.academy.setAllPlacementVisibility(${!allOn}), '${allOn ? 'All placements hidden' : 'All placements visible'}').catch(()=>{})"></div></div>
    <div style="display:flex;justify-content:flex-end;margin-bottom:12px"><button class="btn-sm" onclick="addManual()">${UI.icon('add')}Record an off-platform placement</button></div>
    ${pls.length ? `<div class="d-table-wrap"><table class="d-table stack"><thead><tr><th>Student</th><th>Company & role</th><th>Placed</th><th>Source</th><th>Package</th><th>Public</th></tr></thead><tbody>${pls.map(p => `<tr>
      <td class="who-cell"><div class="who">${UI.avatar(p.studentName, 34, p.studentId)}<div><b>${p.candidate ? `<a href="candidate-profile.html?u=${p.candidate}">${esc(p.studentName)}</a>` : esc(p.studentName)}</b><small>${p.skillScore ? 'Skill score ' + p.skillScore : ''}</small></div></div></td>
      <td data-label="Company">${esc(p.companyLogo || '🏢')} ${esc(p.companyName || p.externalCompany)}<br><small style="color:var(--text3)">${esc(p.role)}</small></td>
      <td data-label="Placed">${UI.fmtDate(p.placedAt)}</td>
      <td data-label="Source">${p.source === 'application' ? UI.pill('Verified hire on Unresume', 'tint-teal', 'verified') : UI.pill('Self-reported', 'gray')}</td>
      <td data-label="Package">${esc(p.salary || '—')}</td>
      <td data-label="Public"><div class="toggle-track ${p.visible ? 'on' : ''}" role="switch" tabindex="0" aria-checked="${p.visible}" aria-label="Public" onclick="UI.run(()=>UR.academy.setPlacementVisibility('${p.id}', ${!p.visible}), '${p.visible ? 'Placement hidden' : 'Placement visible'}').catch(()=>{})"></div></td></tr>`).join('')}</tbody></table></div>`
      : UI.empty('handshake', 'No placements yet', 'Hires through Unresume are recorded automatically when a company marks your student as hired.')}`;
}
function addManual() {
  const students = UR.academy.students().filter(s => s.status !== 'Placed');
  if (!students.length) return UI.toast('No unplaced students on your roster.', 'info');
  UI.modal({ title: 'Record off-platform placement', icon: 'handshake', submitLabel: 'Save', sub: 'Shown as "Self-reported" — only hires completed on Unresume are marked verified.',
    body: UI.field({ name: 'studentId', label: 'Student', type: 'select', required: true, options: students.map(s => [s.id, s.name]) }) + `<div class="form-grid2">${UI.field({ name: 'companyName', label: 'Company', required: true })}${UI.field({ name: 'role', label: 'Role', required: true })}</div><div class="form-grid2">${UI.field({ name: 'placedAt', label: 'Start date', type: 'date' })}${UI.field({ name: 'salary', label: 'Package (optional)' })}</div>`,
    onSubmit: d => { UR.academy.addPlacement(d); UI.toast('Placement recorded'); } });
}
render();
if ($('topbarSearch')) $('topbarSearch').addEventListener('input', UI.debounce(render, 150));
UI.onChange(render);
</script>
</body>
</html>
